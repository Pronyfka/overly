<meta charset="utf-8">
<title>Lumen — чат</title>
<!--
  ТЕМА LUMEN · ЧАТ
  Каждое сообщение — тёмная карточка: раскрывается из полосы цвета ника, потом поднимаются ник и текст.
  Значки — маленькие плашки: стример, модератор, VIP, саб. Смайлы Twitch — картинками.
  Удалённые модераторами сообщения и баны сворачиваются обратно в полосу и пропадают.
  Размер источника в OBS — любой: чат занимает всю его площадь.
-->
<link href="../../fonts/montserrat.css" rel="stylesheet">
<link rel="stylesheet" href="lumen.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #chat { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    gap: var(--gap, 8px); padding: 14px; box-sizing: border-box; font: 500 var(--fs, 20px)/1.35 var(--font); color: var(--text); }
  #chat.newest-top { flex-direction: column-reverse; }
  #chat.right { align-items: flex-end; }
  #chat.right .m { text-align: right; }
  #chat.stretch .m { align-self: stretch; }

  .m { max-width: 100%; box-sizing: border-box; padding: .6em .85em .62em; overflow-wrap: anywhere; flex: none; }
  /* Карточка раскрывается от левого края (справа — от правого) */
  .m > .bg { transform-origin: left center; }
  #chat.right .m > .bg { transform-origin: right center; }
  .m.p-line > .bg, .m.p-close > .bg, .m.p-gone > .bg { transform: scaleX(.02); }
  #chat.no-panel .m > .bg { background: none; box-shadow: none; }
  #chat.no-panel .m { padding-left: 0; padding-right: 0; text-shadow: 0 1px 4px rgba(0,0,0,.85); }

  .head { display: flex; align-items: center; gap: .4em; margin-bottom: .2em; }
  #chat.right .head { justify-content: flex-end; }
  .n { font-weight: 700; color: var(--c, var(--acc)); }
  #chat.inline .head { display: inline-flex; margin: 0 .45em 0 0; vertical-align: baseline; }
  .b { font-size: .58em; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; line-height: 1; padding: .38em .5em .34em;
    border-radius: 99px; color: var(--acc); background: color-mix(in srgb, var(--acc) 16%, transparent); }
  #chat.no-badges .b { display: none; }
  .t { color: var(--text); }
  #chat.inline .t { display: inline; }
  .m img { height: var(--emote, 1.5em); vertical-align: middle; margin: -.3em .05em; }
  .m mark { background: none; color: var(--hl); font-weight: 700; }
  .m.hl > .bg { box-shadow: inset 0 0 0 1.5px var(--hl); }

  /* Без анимации */
  #chat.a-none .m [data-s] { opacity: 1; translate: 0 0; transition: none; }
  #chat.a-none .m > .bg { transform: none; opacity: 1; transition: none; }
  #chat.a-none .m .glow, #chat.a-none .m .seam { display: none; }
</style>
</head>
<body>
<div id="chat"></div>

<script src="../../runtime/overly.js?v=mwe36yl1"></script>
<script src="lumen.js"></script>
<script>
const box = document.getElementById('chat');
const BADGES = { broadcaster: 'стример', moderator: 'мод', vip: 'vip', subscriber: 'саб' };
let S = null;

Overly.onSettings(v => {
  S = v;
  const st = box.style;
  st.setProperty('--fs', v['chat.fontSize'] + 'px');
  st.setProperty('--acc', v['chat.accent']);
  st.setProperty('--gap', v['chat.gap'] + 'px');
  st.setProperty('--text', v['chat.textColor']);
  st.setProperty('--surf', Lumen.rgba(v['chat.surface'], v['chat.surfaceOpacity']));
  st.setProperty('--r', v['chat.radius'] + 'px');
  st.setProperty('--emote', v['chat.emoteSize'] + 'em');
  st.setProperty('--hl', v['chat.highlightColor']);
  st.setProperty('--font', Overly.font(v['chat.font']));
  box.className = [
    v['chat.align'] === 'right' && 'right',
    v['chat.newest'] === 'top' && 'newest-top',
    !v['chat.panel'] && 'no-panel',
    !v['chat.badges'] && 'no-badges',
    v['chat.layout'] === 'inline' && 'inline',
    v['chat.stretch'] && 'stretch',
    'a-' + (v['chat.anim'] || 'line'),
  ].filter(Boolean).join(' ');
  for (const m of box.children) m.style.setProperty('--acc', v['chat.userColors'] && m.dataset.color ? m.dataset.color : '');
  Overly.css(v['chat.css']);
  trim();
});

const list = (text) => String(text || '').toLowerCase().split(/[\s,;]+/).filter(Boolean);

function hidden(msg) {
  const text = (msg.fragments || []).map(f => f.text).join('').trim();
  if (S['chat.hideCommands'] && text.startsWith('!')) return true;
  return list(S['chat.hideBots']).includes(String(msg.login || '').toLowerCase());
}

function remove(m) {
  if (!m.isConnected || m.dataset.out) return;
  m.dataset.out = '1';
  if (S['chat.anim'] === 'none') { m.remove(); return; }
  Lumen.close(m).then(() => m.remove());
}

function trim() {
  const live = [...box.children].filter(m => !m.dataset.out);
  live.slice(0, Math.max(0, live.length - S['chat.max'])).forEach(m => m.remove());
}

// Текст с подсветкой слов из настройки «Подсвечивать слова»
function appendText(el, text, words) {
  if (!words.length) { el.append(document.createTextNode(text)); return false; }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  let found = false;
  for (const part of text.split(re)) {
    if (!part) continue;
    if (words.includes(part.toLowerCase())) { el.append(Object.assign(document.createElement('mark'), { textContent: part })); found = true; }
    else el.append(document.createTextNode(part));
  }
  return found;
}

const make = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text || '' });

Overly.onChat(msg => {
  if (!S || hidden(msg)) return;
  const m = make('div', 'm card');
  m.dataset.id = msg.id || '';
  m.dataset.login = String(msg.login || '').toLowerCase();
  m.dataset.color = msg.color || '';
  // Цвет ника — он же цвет полосы, из которой раскрывается карточка
  if (S['chat.userColors'] && msg.color) m.style.setProperty('--acc', msg.color);
  m.innerHTML = '<div class="bg"><i class="glow"></i></div>';

  const head = make('div', 'head');
  head.dataset.s = ''; head.style.setProperty('--d', 0);
  for (const b of msg.badges || []) if (BADGES[b]) head.append(make('span', 'b', BADGES[b]));
  head.append(make('span', 'n', msg.name));
  const t = make('div', 't');
  t.dataset.s = ''; t.style.setProperty('--d', 1);
  const words = list(S['chat.highlight']);
  let hl = false;
  for (const f of msg.fragments || []) {
    if (f.emote || f.url) {   // url — смайл BetterTTV / 7TV
      const img = new Image();
      img.alt = f.text;
      img.src = f.url || `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(f.emote)}/default/dark/3.0`;
      t.append(img);
    } else if (appendText(t, f.text, words)) {
      hl = true;
    }
  }
  if (hl) m.classList.add('hl');
  m.append(head, t);
  box.append(m);
  trim();
  const anim = S['chat.anim'] || 'line';
  if (anim === 'none') m.classList.add('p-on');
  else Lumen.open(m, anim);
  if (S['chat.fadeSec'] > 0) setTimeout(() => remove(m), S['chat.fadeSec'] * 1000);
});

// Модерация: удалённое сообщение, бан/таймаут (все сообщения человека), очистка чата
Overly.onChatMod(a => {
  for (const m of [...box.children]) {
    if (a.kind === 'clear' || (a.kind === 'delete' && m.dataset.id === a.id) ||
        (a.kind === 'clear_user' && m.dataset.login === String(a.login || '').toLowerCase())) remove(m);
  }
});
</script>
</body>
</html>
