<meta charset="utf-8">
<title>Lumen — таймер марафона</title>
<!--
  ТЕМА LUMEN · ТАЙМЕР МАРАФОНА
  Карточка как у цели: название с точкой-индикатором, под ним крупное время. Справа всплывает «+5:00 · Ник»,
  когда кто-то продлил марафон, время «пружинит». Пауза — точка гаснет, время приглушено. Время вышло — надпись конца.
-->
<link href="../../fonts/montserrat.css" rel="stylesheet">
<link rel="stylesheet" href="lumen.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #timer { position: absolute; inset: 6px; box-sizing: border-box; padding: .7em 1.2em; display: flex; align-items: center; gap: 1em;
    font-family: var(--font); font-size: min(14vh, 3vw); color: var(--text); }
  .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: .2em; }
  .head { display: flex; align-items: center; gap: .5em; min-width: 0; }
  .head .dot { width: .42em; height: .42em; animation: pulse 1.6s var(--ease) infinite; }
  #timer:not(.running) .head .dot { animation: none; opacity: .35; }
  .title { font-size: 1em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-size: 2.7em; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
    transform-origin: left center; transition: opacity .3s; white-space: nowrap; }
  #timer.paused .time { opacity: .55; }
  #timer.done .time { color: var(--acc); font-size: 1.6em; letter-spacing: 0; }
  .add { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: .15em; opacity: 0; translate: 0 .4em; }
  .add b { font-size: 1.5em; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
  .add span { font-size: .8em; font-weight: 600; color: var(--muted); max-width: 9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .add.show { animation: addIn 3.2s var(--ease) forwards; }
  @keyframes addIn { 0% { opacity: 0; translate: 0 .5em; } 10%, 80% { opacity: 1; translate: 0 0; } 100% { opacity: 0; translate: 0 -.4em; } }
</style>
</head>
<body>
<div id="timer" class="card">
  <div class="bg"><i class="glow"></i><i class="seam"></i><i class="shine"></i></div>
  <div class="info">
    <span class="head" data-s style="--d:0"><i class="dot"></i><span class="title"></span></span>
    <span class="time" data-s style="--d:1"></span>
  </div>
  <div class="add"><b></b><span></span></div>
</div>

<script src="../../runtime/overly.js?v=mwe2s8ed"></script>
<script src="lumen.js"></script>
<script src="../../runtime/timer.js?v=mwe2s8ed"></script>
<script>
const box = document.getElementById('timer');
const $ = (s) => box.querySelector(s);
let S = null, opened = false;

function look() {
  const st = box.style;
  st.setProperty('--acc', S['timer.color']);
  st.setProperty('--text', S['timer.textColor']);
  st.setProperty('--font', Overly.font(S['timer.font']));
  st.setProperty('--surf', Lumen.rgba(S['timer.surface'], S['timer.surfaceOpacity']));
  st.setProperty('--r', S['timer.radius'] + 'px');
  $('.title').textContent = S['timer.title'] || '';
  Overly.css(S['timer.css']);
}

OverlyTimer.start({
  render(text, info) {
    for (const s of ['idle', 'running', 'paused', 'done']) box.classList.toggle(s, info.state === s);
    $('.time').textContent = info.state === 'done' ? (S?.['timer.endText'] || '0:00') : text;
  },
  added(a) {
    if (!S || !S['timer.showAdd'] || a.seconds < 0) return;
    $('.add b').textContent = a.text;
    $('.add span').textContent = a.name || '';
    Lumen.replay($('.add'), 'show');
    Lumen.pop($('.time'));
  },
});

Overly.onSettings(v => {
  S = v;
  look();
  if (!opened) { opened = true; document.fonts.ready.then(() => Lumen.open(box, 'line')); }
});
</script>
</body>
</html>
