<meta charset="utf-8">
<title>Lumen — музыка</title>
<!--
  ТЕМА LUMEN · МУЗЫКА
  Что играет в Яндекс Музыке: тёмная карточка раскрывается из полосы, внутри — скруглённая обложка,
  «● Сейчас играет», название, исполнитель и тонкая полоса прогресса со временем.
  Новый трек — содержимое опускается и поднимается заново. Пауза — карточка сворачивается в полосу.
  Высота источника задаёт размер, ширина — длину карточки.
-->
<link href="../../fonts/montserrat.css" rel="stylesheet">
<link rel="stylesheet" href="lumen.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #music { position: absolute; left: 6px; top: 0; height: 140px; display: flex; align-items: center; gap: 20px; padding: 0 24px 0 18px;
    box-sizing: border-box; font-family: var(--font); color: var(--text); visibility: hidden; }
  #music.shown { visibility: visible; }
  .cover { width: 100px; height: 100px; flex: none; border-radius: max(4px, calc(var(--r) - 4px)); overflow: hidden;
    background: color-mix(in srgb, var(--acc) 14%, transparent); display: grid; place-items: center; color: var(--acc); font-size: 38px; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover [hidden] { display: none; }
  #music.no-cover .cover { display: none; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .kicker { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .kicker .dot { width: 7px; height: 7px; }
  #music.no-label .kicker { display: none; }
  .title { font-size: 30px; font-weight: 800; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 18px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  #music.no-progress .prog { display: none; }
  .bar { position: relative; flex: 1; height: 5px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar i { position: absolute; inset: 0; border-radius: inherit; background: var(--acc); transform-origin: left; transform: scaleX(0); }
  /* Мини-версия: обложка и подпись уходят, остаются название, исполнитель и таймлайн — полоска ниже */
  #music { transition: height .45s var(--ease), top .45s var(--ease), padding .45s var(--ease); }
  #music > .cover, #music > .info { transition: opacity .2s; }
  #music.swap > .cover, #music.swap > .info { opacity: 0; }
  #music.mini { height: 84px; padding-left: 24px; }
  #music.mini .cover, #music.mini .kicker { display: none; }
  #music.mini .info { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0 12px; }
  #music.mini .title { font-size: 22px; flex: 0 1 auto; max-width: 65%; }
  #music.mini .artist { font-size: 16px; flex: 1 1 0; }
  #music.mini .prog { flex-basis: 100%; margin-top: 8px; }
  #music.still, #music.still * { transition: none !important; }
  .t { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<div id="music" class="card">
  <div class="bg"><i class="glow"></i><i class="seam"></i><i class="shine"></i></div>
  <div class="cover" data-s style="--d:0"><img alt=""><span class="ph">♪</span></div>
  <div class="info">
    <div class="kicker" data-s style="--d:1"><i class="dot pulse"></i><span></span></div>
    <div class="title" data-s style="--d:2"></div>
    <div class="artist" data-s style="--d:3"></div>
    <div class="prog" data-s style="--d:4"><div class="bar"><i></i></div><span class="t"></span></div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe2s8ed"></script>
<script src="../../runtime/music.js?v=mwe2s8ed"></script>
<script src="lumen.js"></script>
<script>
const box = document.getElementById('music');
const $ = (s) => box.querySelector(s);
let swapT = 0;

function fit() {
  const k = Math.min(innerHeight / 150, innerWidth / 400);
  box.style.zoom = k;
  box.style.width = innerWidth / k - 12 + 'px';
  box.style.top = (innerHeight / k - 140) / 2 + (box.classList.contains('mini') ? OverlyMusic.miniShift(56) : 0) + 'px';
}
addEventListener('resize', fit);
fit();

Overly.onSettings(v => {
  const st = box.style;
  st.setProperty('--acc', v['music.color']);
  st.setProperty('--font', Overly.font(v['music.font']));
  st.setProperty('--surf', Lumen.rgba(v['music.surface'], v['music.surfaceOpacity']));
  st.setProperty('--r', v['music.radius'] + 'px');
  box.classList.toggle('no-cover', !v['music.cover']);
  box.classList.toggle('no-label', !v['music.showLabel']);
  box.classList.toggle('no-progress', !v['music.progress']);
  $('.kicker span').textContent = v['music.label'] || '';
  Overly.css(v['music.css']);
});

function fill(m) {
  $('.title').textContent = m.title || '';
  $('.artist').textContent = m.artist || '';
  const img = $('.cover img');
  img.hidden = !m.cover;
  $('.cover .ph').hidden = !!m.cover;
  if (m.cover) img.src = m.cover;
}

OverlyMusic.watch({
  show() { box.classList.add('shown'); Lumen.open(box, 'line'); setTimeout(() => Lumen.shine(box), 1100); },
  hide() { Lumen.close(box).then(() => box.classList.remove('shown')); },
  track(m, first) {
    if (first) return fill(m);
    // Смена трека: содержимое опускается, меняется и поднимается заново
    box.classList.remove('p-on'); box.classList.add('p-leave');
    setTimeout(() => { fill(m); box.classList.remove('p-leave'); box.classList.add('p-enter'); }, 280);
    setTimeout(() => { box.classList.remove('p-enter'); box.classList.add('p-on'); Lumen.shine(box); }, 1000);
  },
  mini(on, instant) {
    clearTimeout(swapT);
    if (instant) { box.classList.add('still'); box.classList.toggle('mini', on); fit(); box.offsetWidth; box.classList.remove('still', 'swap'); return; }
    // Содержимое гаснет, полоска меняет высоту, содержимое проявляется уже в новом виде
    box.classList.add('swap');
    swapT = setTimeout(() => { box.classList.toggle('mini', on); fit(); swapT = setTimeout(() => box.classList.remove('swap'), 450); }, 220);
  },
  tick(pos, dur) {
    $('.bar i').style.transform = `scaleX(${dur ? pos / dur : 0})`;
    $('.t').textContent = dur ? `${OverlyMusic.time(pos)} / ${OverlyMusic.time(dur)}` : OverlyMusic.time(pos);
  },
});
</script>
</body>
</html>
