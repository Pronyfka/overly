<meta charset="utf-8">
<title>Lumen — цель</title>
<!--
  ТЕМА LUMEN · ЦЕЛЬ
  Карточка: крупный процент слева, название и цифры справа, шкала снизу.
  Фолловеры или сабы (всего на канале — берутся с Twitch) или битсы (с последнего сброса в редакторе).
  При росте шкала плавно дорастает, по ней пробегает блик, процент «пружинит».
  Размер источника в OBS — любой: карточка растягивается по ширине, текст растёт вместе с высотой.
-->
<link href="../../fonts/montserrat.css" rel="stylesheet">
<link rel="stylesheet" href="lumen.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  /* Всё в em: базовый шрифт растёт с высотой источника (и не даёт вылезти по ширине) */
  #goal { position: absolute; inset: 6px; box-sizing: border-box; padding: .9em 1.2em; display: flex; flex-direction: column; justify-content: center; gap: .8em;
    font-family: var(--font); font-size: min(14vh, 3vw); color: var(--text); }
  .row { display: flex; align-items: center; gap: 1em; min-width: 0; }
  .pct { font-size: 2.6em; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
    transform-origin: left bottom; }
  #goal.no-pct .pct { display: none; }
  .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: .35em; }
  .head { display: flex; align-items: center; gap: .5em; min-width: 0; }
  .head .dot { width: .42em; height: .42em; }
  .title { font-size: 1.15em;font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { font-size: .9em; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .count b { color: var(--text); font-weight: 700; }
  .count:empty { display: none; }

  .bar { position: relative; height: calc(.32em * var(--barH, 1)); border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--acc); transform-origin: left; transform: scaleX(0);
    transition: transform .8s var(--ease); }
  .bar::after { content: ''; position: absolute; inset: 0; transform: translateX(-110%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); }
  .bar.sweep::after { transform: translateX(110%); transition: transform .9s cubic-bezier(.45, 0, .3, 1); }
  #goal.done .dot { animation: pulse 1.6s var(--ease) infinite; }
</style>
</head>
<body>
<div id="goal" class="card">
  <div class="bg"><i class="glow"></i><i class="seam"></i><i class="shine"></i></div>
  <div class="row">
    <span class="pct" data-s style="--d:0"></span>
    <div class="info">
      <span class="head" data-s style="--d:1"><i class="dot"></i><span class="title"></span></span>
      <span class="count" data-s style="--d:2"></span>
    </div>
  </div>
  <div class="bar" data-s style="--d:3"><span class="fill"></span></div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="lumen.js"></script>
<script>
const goal = document.getElementById('goal');
const $ = (s) => goal.querySelector(s);
let S = null, stats = {}, last = null, opened = false;

function render() {
  if (!S) return;
  const st = goal.style;
  st.setProperty('--acc', S['goal.color']);
  st.setProperty('--text', S['goal.textColor']);
  st.setProperty('--font', Overly.font(S['goal.font']));
  st.setProperty('--surf', Lumen.rgba(S['goal.surface'], S['goal.surfaceOpacity']));
  st.setProperty('--r', S['goal.radius'] + 'px');
  st.setProperty('--barH', (S['goal.barHeight'] || 100) / 100);
  Overly.css(S['goal.css']);

  const target = Math.max(1, Number(S['goal.target']) || 1);
  const value = stats[S['goal.type']];
  const known = typeof value === 'number';
  const done = known && value >= target;
  const pct = known ? Math.min(100, Math.floor(100 * value / target)) : 0;
  goal.classList.toggle('done', done);
  goal.classList.toggle('no-pct', !S['goal.percentBig']);

  $('.title').textContent = done ? (S['goal.done'] || S['goal.title']) : S['goal.title'];
  $('.pct').textContent = known ? pct + '%' : '—';
  const fmt = (n) => n.toLocaleString('ru-RU');
  const mode = S['goal.countMode'] || 'both';
  $('.count').innerHTML = !known ? 'подключите Twitch'
    : mode === 'none' ? ''
    : mode === 'percent' ? `<b>${pct}%</b>`
    : mode === 'count' ? `<b>${fmt(value)}</b>`
    : mode === 'left' ? `<b>${done ? 0 : fmt(target - value)}</b> осталось`
    : `<b>${fmt(value)}</b> / ${fmt(target)}`;
  $('.fill').style.transform = `scaleX(${pct / 100})`;

  if (known && last !== null && value > last) {   // выросло: блик по шкале и «пружинка» у процента
    Lumen.replay($('.bar'), 'sweep');
    Lumen.pop($('.pct'));
  }
  last = known ? value : null;
}

Overly.onSettings(v => {
  const typeChanged = S && S['goal.type'] !== v['goal.type'];
  S = v;
  if (typeChanged) last = null;
  render();
  if (!opened) { opened = true; document.fonts.ready.then(() => Lumen.open(goal, 'line')); }
});
Overly.onStats(s => { stats = s; render(); });
</script>
</body>
</html>
