<meta charset="utf-8">
<title>Новогодняя ночь — голосование</title>
<!--
  ТЕМА «НОВОГОДНЯЯ НОЧЬ» · ГОЛОСОВАНИЕ
  Стеклянная карточка со снежной шапкой. У каждого варианта — тонкий провод с огоньком на конце полосы;
  у лидера огонёк ярче. Итоги: у победителя звезда, остальные тускнеют.
-->
<link href="../../fonts/comfortaa.css" rel="stylesheet">
<link href="../../fonts/manrope.css" rel="stylesheet">
<link rel="stylesheet" href="ny.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #poll { position: absolute; left: 8px; right: 8px; top: 16px; box-sizing: border-box; padding: 1em 1.2em 1.1em; display: flex; flex-direction: column; gap: .6em;
    font-family: Manrope, sans-serif; font-size: min(5.2vh, 4vw); color: var(--text, var(--ink));
    background: var(--surf); border: 1px solid var(--line); border-radius: .9em; box-shadow: 0 16px 36px -18px rgba(0, 0, 0, .7);
    opacity: 0; transform-origin: 50% -1em; }
  #poll.in { animation: swingIn .9s cubic-bezier(.2, .9, .25, 1) forwards; }
  #poll.out { opacity: 1; animation: melt .5s ease-in forwards; }
  @keyframes swingIn { 0% { opacity: 0; transform: translateY(-.5em) rotate(-2deg); } 45% { opacity: 1; transform: translateY(.06em) rotate(1deg); }
    70% { transform: rotate(-.3deg); } 100% { opacity: 1; transform: none; } }
  @keyframes melt { to { opacity: 0; transform: translateY(-.4em); filter: blur(4px); } }

  .head { display: flex; align-items: flex-start; gap: .7em; }
  .q { flex: 1; min-width: 0; font: 700 1.2em/1.2 var(--font); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .left { flex: none; margin-top: .15em; padding: .15em .6em; border-radius: 99px; background: rgba(0, 0, 0, .3); font-size: .8em; font-weight: 800;
    color: var(--acc); font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--acc) 45%, transparent); }
  .left:empty { display: none; }
  .list { display: flex; flex-direction: column; gap: .55em; }
  .opt { position: relative; display: flex; flex-direction: column; gap: .3em; transition: opacity .5s; }
  .line { display: flex; align-items: baseline; gap: .6em; min-width: 0; }
  .name { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { flex: none; font-size: .8em; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .num:empty { display: none; }
  .opt.lead .num { color: var(--text, var(--ink)); }
  .track { position: relative; height: calc(.16em * var(--barH, 1)); border-radius: 99px; background: rgba(255, 255, 255, .12); margin: .25em .3em .25em 0; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: color-mix(in srgb, var(--acc) 55%, #6E7A99);
    transition: width 1.2s cubic-bezier(.3, 1.2, .5, 1); }
  .fill .dot { --c: color-mix(in srgb, var(--acc) 55%, #6E7A99); position: absolute; right: -.25em; top: 50%; width: .5em; height: .5em; margin-top: -.25em; }
  .opt.lead .fill { background: var(--acc); }
  .opt.lead .fill .dot { --c: var(--acc); animation: nyTw 1.6s ease-in-out infinite; }
  .star { position: absolute; right: 0; top: -.15em; width: 1.3em; height: 1.3em; color: var(--acc); opacity: 0; }
  .star svg { width: 100%; height: 100%; display: block; }
  .opt.win .star { animation: starIn .8s var(--pop) forwards; }
  @keyframes starIn { from { opacity: 0; scale: .3; rotate: -40deg; } to { opacity: 1; scale: 1; rotate: 0deg; } }
  .opt.win .num { margin-right: 1.6em; }
  #poll.ended .opt:not(.win) { opacity: .45; }
  .total { font-size: .75em; font-weight: 700; color: var(--muted); }
  .total:empty { display: none; }
</style>
</head>
<body>
<div id="poll">
  <div class="cap"></div>
  <div class="head"><span class="q"></span><span class="left"></span></div>
  <div class="list"></div>
  <div class="total"></div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="ny.js"></script>
<script src="../../runtime/poll.js?v=mwe6bc1p"></script>
<script>
const box = document.getElementById('poll');
const $ = (s) => box.querySelector(s);
let S = null, P = null, left = '', outTimer = 0;
NY.cap($('.cap'), true);

const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
function numText(c) {
  const mode = S?.['poll.numbers'] || 'both';
  return mode === 'none' ? '' : mode === 'pct' ? c.pct + '%' : mode === 'votes' ? c.votes.toLocaleString('ru-RU') : `${c.pct}% · ${c.votes.toLocaleString('ru-RU')}`;
}

function look() {
  const st = box.style;
  st.setProperty('--acc', S['poll.color']);
  st.setProperty('--text', S['poll.textColor']);
  st.setProperty('--font', Overly.font(S['poll.font']));
  st.setProperty('--surf', NY.rgba(S['poll.surface'], S['poll.surfaceOpacity']));
  st.setProperty('--barH', (S['poll.barHeight'] || 100) / 100);
  box.classList.toggle('no-caps', !S['poll.caps']);
  Overly.css(S['poll.css']);
  if (P) fill(P);
}
function tag() { $('.left').textContent = P?.state === 'ended' ? 'Итоги' : S?.['poll.showTimer'] ? left : ''; }

function fill(p, grow = true) {
  P = p;
  box.classList.toggle('ended', p.state === 'ended');
  $('.q').textContent = p.title;
  [...$('.list').children].forEach((row, i) => {
    const c = p.choices[i];
    if (!c) return;
    row.querySelector('.name').textContent = c.title;
    row.querySelector('.num').textContent = numText(c);
    if (grow) row.querySelector('.fill').style.width = Math.max(c.pct ? 2 : 0, c.pct) + '%';
    row.classList.toggle('lead', c.lead);
    row.classList.toggle('win', c.win);
  });
  $('.total').textContent = S?.['poll.showTotal']
    ? `${p.state === 'ended' ? 'Итого' : 'Всего'}: ${p.total.toLocaleString('ru-RU')} ${plural(p.total, 'голос', 'голоса', 'голосов')}` : '';
  tag();
}

OverlyPoll.start({
  show(p) {
    clearTimeout(outTimer);
    P = null;
    $('.list').replaceChildren(...p.choices.map(() => {
      const row = document.createElement('div');
      row.className = 'opt';
      row.innerHTML = `<div class="line"><span class="name"></span><span class="num"></span></div><div class="track"><div class="fill"><span class="dot"></span></div></div><span class="star">${NY.icon('star')}</span>`;
      return row;
    }));
    fill(p, false);
    box.classList.remove('out', 'in');
    document.fonts.ready.then(() => { void box.offsetWidth; box.classList.add('in'); setTimeout(() => fill(P), 500); });
  },
  update(p) { fill(p); },
  hide() { box.classList.remove('in'); box.classList.add('out'); outTimer = setTimeout(() => box.classList.remove('out'), 600); },
  tick(text) { left = text; tag(); },
});

Overly.onSettings(v => { S = v; look(); });
</script>
</body>
</html>
