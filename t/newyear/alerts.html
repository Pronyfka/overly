<meta charset="utf-8">
<title>Новогодняя ночь — алерты</title>
<!--
  ТЕМА «НОВОГОДНЯЯ НОЧЬ» · АЛЕРТЫ
  Прочерчивается провод гирлянды, огоньки загораются слева направо, карточка падает и повисает на двух нитях,
  качаясь как маятник. На верхний край ложится снег с облачком снежинок, ник проявляется по буквам.
  Уход в обратном порядке: огни гаснут справа налево, карточка поднимается и тает, провод сматывается.
  Типы: follow, sub, resub, gift, raid, bits, tip
-->
<link href="../../fonts/comfortaa.css" rel="stylesheet">
<link href="../../fonts/manrope.css" rel="stylesheet">
<link rel="stylesheet" href="ny.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  /* Алерт рисуется в коробке 1000×430 и вписывается в источник любого размера */
  #alert { position: absolute; left: 50%; top: 50%; width: 1000px; height: 430px; translate: -50% -50%;
    scale: var(--scale, 1); transform-origin: 50% 50%; visibility: hidden; color: var(--text, var(--ink)); font-family: Manrope, sans-serif; }
  #alert.shown { visibility: visible; }
  #alert[data-valign="top"] { top: calc(6px * var(--scale, 1)); translate: -50% 0; transform-origin: 50% 0; }
  #alert[data-valign="bottom"] { top: auto; bottom: calc(6px * var(--scale, 1)); translate: -50% 0; transform-origin: 50% 100%; }

  .card { position: absolute; left: 180px; top: 120px; width: 640px; min-height: 150px; box-sizing: border-box; padding: 28px 34px 28px 150px;
    background: var(--cardBg, var(--card)); border: 1px solid var(--line); border-radius: 26px; opacity: 0; transform-origin: 50% -80px;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06); }
  .thread { position: absolute; width: 1.5px; background: linear-gradient(#5A6788, #3A4560); }
  #alert.no-threads .thread { display: none; }
  .card .bauble { position: absolute; left: 30px; top: 28px; width: 92px; height: 92px; }
  .card .pic { position: absolute; left: 22px; top: 20px; width: 110px; height: 110px; border-radius: 20px; overflow: hidden; }
  .card .pic .media { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card [hidden] { display: none !important; }
  .kick { font: 800 15px/1 Manrope, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--acc); opacity: 0; }
  .name { font: 700 50px/1.15 var(--font); margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .ch { display: inline-block; white-space: pre; opacity: 0; }
  .line { font: 600 19px/1.35 Manrope, sans-serif; color: var(--mutedText, var(--muted)); margin-top: 8px; opacity: 0; }
  .line b { font-weight: 800; color: var(--acc); }
  .msg { font: 500 18px/1.35 Manrope, sans-serif; color: var(--text, var(--ink)); margin-top: 8px; opacity: 0;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .msg:empty, .line:empty { display: none; }
  .card .cap { opacity: 0; }
</style>
</head>
<body>
<div id="alert">
  <svg class="garland" width="1000" height="140" viewBox="0 0 1000 140" style="left:0;top:0"><path class="wire"/></svg>
  <div class="card">
    <div class="cap"></div>
    <div class="bauble"></div>
    <div class="pic"><img class="media" alt="" hidden><video class="media" muted playsinline loop hidden></video></div>
    <div class="kick"></div>
    <div class="name"></div>
    <div class="line"></div>
    <div class="msg"></div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="ny.js"></script>
<script>
const root = document.getElementById('alert');
const $ = (s) => root.querySelector(s);
const card = $('.card'), svg = $('svg.garland'), wire = $('.wire');
let S = null, timers = [];
const at = (ms, fn) => timers.push(setTimeout(fn, ms));

// Провод через всю ширину, провисает к середине; на нём 15 лампочек
const X0 = 40, X1 = 960, Y = 26, DEPTH = 40;
wire.setAttribute('d', NY.sag(X0, X1, Y, DEPTH));
const G = NY.garland(svg, wire, { count: 15 });
const wireY = (x) => { const t = (x - X0) / (X1 - X0); return Y + 4 * DEPTH * t * (1 - t); };
// Нити от провода к верхнему краю карточки
for (const x of [230, 770]) {
  const th = document.createElement('div'); th.className = 'thread';
  const top = wireY(x) - 120;   // относительно карточки (она на y=120)
  th.style.cssText = `left:${x - 180}px;top:${top}px;height:${-top}px`;
  card.prepend(th);
}

const NUM = { follow: () => 1, sub: a => a.amount > 1 ? a.amount : 1, resub: a => a.amount ?? 1, gift: a => a.amount || 1,
  raid: a => a.amount ?? 1, bits: a => a.amount ?? 0, tip: a => a.amount ?? 0 };

function fit() {
  if (!S) return;
  const k = Math.min(innerWidth / 1010, innerHeight / 440) * S.size / 100;
  root.style.setProperty('--scale', k);
  root.dataset.valign = S.valign;
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  const st = root.style;
  st.setProperty('--font', Overly.font(v.font));
  st.setProperty('--text', v.textColor);
  st.setProperty('--mutedText', v.mutedColor);
  st.setProperty('--cardBg', NY.rgba(v.card, v.cardOpacity));
  root.classList.toggle('no-caps', !v.caps);
  root.classList.toggle('no-threads', !v.threads);
  G.paint(NY.lights(v), v.twinkle);
  Overly.css(v.css);
  fit();
});

const durationOf = (a) => (S[a.type + '.dur'] > 0 ? S[a.type + '.dur'] : S.showSec) * 1000;

// Облачко снега с верхнего края карточки
function puff() {
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('i'), size = NY.rnd(3, 7);
    s.className = 'puffdot';
    s.style.cssText = `top:-6px;left:${NY.rnd(6, 94)}%;width:${size}px;height:${size}px`;
    card.appendChild(s);
    const dx = NY.rnd(-60, 60);
    s.animate([{ transform: 'translate(0,0)', opacity: .95 }, { transform: `translate(${dx * .6}px,${-NY.rnd(20, 60)}px)`, opacity: .9, offset: .35 },
      { transform: `translate(${dx}px,${NY.rnd(30, 80)}px)`, opacity: 0 }], { duration: NY.rnd(900, 1500), easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => s.remove();
  }
}

function showAlert(a) {
  const k = a.type, n = NUM[k](a), showMs = durationOf(a);
  timers.forEach(clearTimeout); timers = [];
  card.getAnimations({ subtree: true }).forEach(x => x.cancel());

  root.style.setProperty('--acc', S[k + '.color'] || '#FFD59A');
  $('.bauble').innerHTML = NY.icon(S[k + '.icon']);
  const hasMedia = NY.setMedia(root, S[k + '.media']);
  $('.bauble').hidden = hasMedia; $('.pic').hidden = !hasMedia;
  $('.kick').textContent = S[k + '.label'] || '';
  const name = String(a.name);
  if ([...name].length <= 18) NY.letters($('.name'), name); else $('.name').textContent = name;
  $('.line').innerHTML = '';
  $('.line').append(NY.fill(S[k + '.line'], n));
  $('.msg').textContent = (S.showMessage && a.message) || '';
  NY.cap($('.cap'), true);
  if (S.sound) {
    const vol = (S[k + '.volume'] ?? 100) / 100 * S.volume / 100;
    if (S[k + '.sound']) Overly.play(S[k + '.sound'], vol);
    else if (S.themeSound) NY.chime(k, vol);
  }

  // 1. Провод прочерчивается, огоньки загораются слева направо
  root.classList.add('shown');
  wire.classList.remove('draw');
  wire.style.strokeDasharray = G.len; wire.style.strokeDashoffset = G.len;
  void wire.getBoundingClientRect();
  wire.classList.add('draw'); wire.style.strokeDashoffset = 0;
  G.lit(0);
  G.bulbs.forEach((b, i) => at(220 + i * 45, () => { b.classList.add('on'); b.classList.remove('pop'); void b.getBBox(); b.classList.add('pop'); }));

  // 2. Карточка падает и качается на нитях (затухающий маятник)
  at(380, () => {
    card.animate(S.swing ? [
      { opacity: 0, transform: 'translateY(-60px) rotate(-7deg)' },
      { opacity: 1, transform: 'translateY(6px) rotate(4deg)', offset: .32 },
      { transform: 'translateY(-2px) rotate(-2.2deg)', offset: .55 },
      { transform: 'translateY(1px) rotate(1deg)', offset: .75 },
      { transform: 'translateY(0) rotate(-.35deg)', offset: .9 },
      { opacity: 1, transform: 'none' },
    ] : [{ opacity: 0, transform: 'translateY(-30px)' }, { opacity: 1, transform: 'none' }],
    { duration: S.swing ? 1500 : 600, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' });
  });
  // 3. Снег оседает на верхний край, облачко снежинок
  at(800, () => {
    $('.cap').animate([{ opacity: 0, transform: 'scaleY(0)' }, { opacity: 1, transform: 'scaleY(1.25)', offset: .6 }, { opacity: 1, transform: 'scaleY(1)' }],
      { duration: 520, easing: 'ease-out', fill: 'forwards' });
    if (S.caps) puff();
    // 4. Подпись, ник по буквам, строка и сообщение
    $('.kick').animate([{ opacity: 0, transform: 'translateY(8px)', letterSpacing: '.4em' }, { opacity: 1, transform: 'none', letterSpacing: '.2em' }],
      { duration: 500, easing: 'ease-out', fill: 'forwards' });
    const chars = root.querySelectorAll('.name .ch');
    if (chars.length) chars.forEach((s, i) => s.animate([{ opacity: 0, transform: 'translateY(18px) scale(.8)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
      { duration: 520, delay: 120 + i * 38, easing: 'cubic-bezier(.2,.9,.3,1.3)', fill: 'forwards' }));
    else $('.name').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: 'forwards' });
    const d = 300 + chars.length * 38;
    for (const [sel, extra] of [['.line', 0], ['.msg', 160]])
      $(sel).animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: d + extra, easing: 'ease-out', fill: 'forwards' });
  });
  // 5. Уход: огни гаснут справа налево, карточка поднимается и тает, провод сматывается
  at(showMs - 1100, () => [...G.bulbs].reverse().forEach((b, i) => at(i * 35, () => b.classList.remove('on'))));
  at(showMs - 850, () => card.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-26px) rotate(1.5deg)', filter: 'blur(6px)' }],
    { duration: 520, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' }));
  at(showMs - 520, () => { wire.style.strokeDashoffset = -G.len; });
  at(showMs, () => { root.classList.remove('shown'); $('video.media').pause(); });
}

// Очередь: алерты идут по одному
const queue = [];
let busy = false;
function next() {
  const a = queue.shift();
  if (!a) { busy = false; return; }
  busy = true;
  showAlert(a);
  setTimeout(next, durationOf(a) + S.gapSec * 1000);
}
Overly.onEvent(a => {
  if (!S || !NUM[a?.type] || !S[a.type + '.on'] || !a.name) return;
  if ((S[a.type + '.min'] || 0) > (Number(a.amount) || 0)) return;
  queue.push(a);
  if (!busy) document.fonts.ready.then(() => { if (!busy) next(); });
});
</script>
</body>
</html>
