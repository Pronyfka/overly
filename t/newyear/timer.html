<meta charset="utf-8">
<title>Новогодняя ночь — таймер марафона</title>
<!--
  ТЕМА «НОВОГОДНЯЯ НОЧЬ» · ТАЙМЕР МАРАФОНА
  Стеклянная карточка с гирляндой по верхнему краю и крупным временем. Добавили время — по гирлянде
  пробегает волна огней, цифры подпрыгивают, сбоку всплывает «+5:00» и ник. На паузе огни гаснут.
-->
<link href="../../fonts/comfortaa.css" rel="stylesheet">
<link href="../../fonts/manrope.css" rel="stylesheet">
<link rel="stylesheet" href="ny.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #timer { position: absolute; inset: 22px 8px 8px; box-sizing: border-box; padding: .55em 1.2em .5em; display: flex; align-items: center; gap: .9em;
    font-family: Manrope, sans-serif; font-size: min(12.5vh, 2.6vw); color: var(--text, var(--ink));
    background: var(--surf); border: 1px solid var(--line); border-radius: .9em; box-shadow: 0 16px 36px -18px rgba(0, 0, 0, .7);
    opacity: 0; transform: translateY(-.5em) rotate(-1.5deg); transform-origin: 50% -1em; }
  #timer.in { animation: swingIn .9s cubic-bezier(.2, .9, .25, 1) forwards; }
  @keyframes swingIn { 0% { opacity: 0; transform: translateY(-.5em) rotate(-2deg); } 45% { opacity: 1; transform: translateY(.06em) rotate(1deg); }
    70% { transform: rotate(-.3deg); } 100% { opacity: 1; transform: none; } }
  #timer > svg.garland { left: 0; top: -14px; width: 100%; height: 40px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .1em; }
  .title { font: 700 .95em/1.2 var(--font); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font: 700 2.3em/1 var(--font); color: var(--text, var(--ink)); font-variant-numeric: tabular-nums; white-space: nowrap; transform-origin: 20% 80%; transition: opacity .4s; }
  #timer.paused .time { opacity: .45; }
  #timer.done .time { font-size: 1.5em; color: var(--acc); }
  .time.jump { animation: jump .55s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes jump { 40% { scale: 1.14; } }
  .add { flex: none; display: flex; flex-direction: column; align-items: flex-end; opacity: 0; }
  .add b { font: 700 1.5em/1 var(--font); color: var(--acc); }
  .add span { font-size: .75em; font-weight: 700; color: var(--muted); max-width: 8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .add.show { animation: rise 3.2s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; translate: 0 .6em; } 12%, 78% { opacity: 1; translate: 0 0; } 100% { opacity: 0; translate: 0 -.8em; } }
</style>
</head>
<body>
<div id="timer">
  <svg class="garland"><path class="wire"/></svg>
  <div class="main"><span class="title"></span><span class="time"></span></div>
  <div class="add"><b></b><span></span></div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="ny.js"></script>
<script src="../../runtime/timer.js?v=mwe6bc1p"></script>
<script>
const box = document.getElementById('timer');
const $ = (s) => box.querySelector(s);
let S = null, opened = false, G = null, built = 0, state = 'idle';

// Гирлянда вдоль верхнего края карточки
function build() {
  const svg = $('svg.garland'), w = svg.clientWidth;
  if (!w || w === built) return;
  built = w;
  svg.setAttribute('viewBox', `0 0 ${w} 40`);
  [...svg.querySelectorAll('.nyb')].forEach(b => b.remove());
  const wire = $('.wire');
  wire.setAttribute('d', NY.sag(18, w - 18, 10, 6, Math.max(1, Math.round(w / 200))));
  G = NY.garland(svg, wire, { count: Math.max(8, Math.round(w / 34)), scale: .8 });
  look();
}
addEventListener('resize', build);

function look() {
  if (!S) return;
  const st = box.style;
  st.setProperty('--acc', S['timer.color']);
  st.setProperty('--text', S['timer.textColor']);
  st.setProperty('--font', Overly.font(S['timer.font']));
  st.setProperty('--surf', NY.rgba(S['timer.surface'], S['timer.surfaceOpacity']));
  $('.title').textContent = S['timer.title'] || '';
  Overly.css(S['timer.css']);
  if (!G) return;
  G.paint(NY.lights(S), S.twinkle);
  G.lit(state === 'paused' || state === 'idle' ? 0 : G.bulbs.length);
}

const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

OverlyTimer.start({
  render(text, info) {
    for (const s of ['idle', 'running', 'paused', 'done']) box.classList.toggle(s, info.state === s);
    if (info.state !== state) { state = info.state; look(); }
    $('.time').textContent = info.state === 'done' ? (S?.['timer.endText'] || '0:00') : text;
  },
  added(a) {
    if (!S || !S['timer.showAdd'] || a.seconds < 0) return;
    $('.add b').textContent = a.text;
    $('.add span').textContent = a.name || '';
    replay($('.add'), 'show');
    replay($('.time'), 'jump');
    // Волна огней слева направо
    G?.bulbs.forEach((b, i) => setTimeout(() => { b.classList.add('on'); b.classList.remove('pop'); void b.getBBox(); b.classList.add('pop'); }, i * 40));
  },
});

Overly.onSettings(v => {
  S = v;
  look();
  if (!opened) { opened = true; document.fonts.ready.then(() => { build(); box.classList.add('in'); }); }
});
</script>
</body>
</html>
