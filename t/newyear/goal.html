<meta charset="utf-8">
<title>Новогодняя ночь — цель</title>
<!--
  ТЕМА «НОВОГОДНЯЯ НОЧЬ» · ЦЕЛЬ
  Прогресс — это гирлянда: сколько процентов набрано, столько лампочек горит. Новая загорается со вспышкой.
  Цель достигнута — по всей гирлянде бежит волна огней. Всё в em: размер растёт с высотой источника.
-->
<link href="../../fonts/comfortaa.css" rel="stylesheet">
<link href="../../fonts/manrope.css" rel="stylesheet">
<link rel="stylesheet" href="ny.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #goal { position: absolute; inset: 14px 8px 8px; box-sizing: border-box; padding: .7em 1.1em .5em; display: flex; flex-direction: column; gap: .2em;
    font-family: Manrope, sans-serif; font-size: min(12.5vh, 2.6vw); color: var(--text, var(--ink));
    background: var(--surf); border: 1px solid var(--line); border-radius: .9em; box-shadow: 0 16px 36px -18px rgba(0, 0, 0, .7);
    opacity: 0; transform: translateY(-.5em) rotate(-1.5deg); transform-origin: 50% -1em; }
  #goal.no-panel { background: none; border-color: transparent; box-shadow: none; }
  #goal.no-panel .cap { display: none; }
  #goal.in { animation: swingIn .9s cubic-bezier(.2, .9, .25, 1) forwards; }
  @keyframes swingIn { 0% { opacity: 0; transform: translateY(-.5em) rotate(-2deg); } 45% { opacity: 1; transform: translateY(.06em) rotate(1deg); }
    70% { transform: rotate(-.3deg); } 100% { opacity: 1; transform: none; } }
  .row { display: flex; align-items: baseline; gap: .8em; min-width: 0; }
  .title { flex: 1; min-width: 0; font: 700 1.05em/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { font-size: .85em; font-weight: 800; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .count b { color: var(--acc); }
  .count:empty { display: none; }
  .lane { position: relative; flex: 1; min-height: 1.6em; }
  .lane svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .count.jump { animation: jump .55s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes jump { 40% { scale: 1.2; } }
</style>
</head>
<body>
<div id="goal">
  <div class="cap"></div>
  <div class="row"><span class="title"></span><span class="count"></span></div>
  <div class="lane"><svg class="garland" style="left:0;top:0"></svg></div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="ny.js"></script>
<script>
const goal = document.getElementById('goal');
const $ = (s) => goal.querySelector(s);
let S = null, stats = {}, last = null, opened = false, G = null, built = '';
NY.cap($('.cap'));

// Гирлянда во всю ширину полосы: строится заново, когда меняется размер или число лампочек
function build() {
  const svg = $('.lane svg'), w = svg.clientWidth, h = svg.clientHeight, n = Math.max(6, S['goal.bulbs'] || 24);
  const key = `${w}x${h}x${n}`;
  if (!w || key === built) return;
  built = key;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = '';
  const spans = Math.max(1, Math.round(w / 260)), wire = NY.el('path', { class: 'wire', d: NY.sag(4, w - 4, h * .12, h * .14, spans) });
  svg.appendChild(wire);
  G = NY.garland(svg, wire, { count: n, scale: Math.max(.6, h / 46) });
  G.paint(NY.lights(S), S.twinkle);
  last = null;
}
addEventListener('resize', () => { built = ''; render(); });

function render() {
  if (!S) return;
  const st = goal.style;
  st.setProperty('--acc', S['goal.color']);
  st.setProperty('--text', S['goal.textColor']);
  st.setProperty('--font', Overly.font(S['goal.font']));
  st.setProperty('--surf', NY.rgba(S['goal.surface'], S['goal.surfaceOpacity']));
  goal.classList.toggle('no-panel', !S['goal.panel']);
  Overly.css(S['goal.css']);
  build();
  if (!G) return;
  G.paint(NY.lights(S), S.twinkle);

  const target = Math.max(1, Number(S['goal.target']) || 1);
  const value = stats[S['goal.type']];
  const known = typeof value === 'number';
  const done = known && value >= target;
  const pct = known ? Math.min(100, Math.floor(100 * value / target)) : 0;
  $('.title').textContent = done ? (S['goal.done'] || S['goal.title']) : S['goal.title'];
  const fmt = (n) => n.toLocaleString('ru-RU');
  const mode = S['goal.countMode'] || 'both';
  $('.count').innerHTML = !known ? 'подключите Twitch'
    : mode === 'none' ? '' : mode === 'percent' ? `<b>${pct}%</b>` : mode === 'count' ? `<b>${fmt(value)}</b>`
    : mode === 'left' ? `<b>${done ? 0 : fmt(target - value)}</b> осталось` : `<b>${fmt(value)}</b> / ${fmt(target)}`;
  // Горит столько лампочек, сколько набрано; цель достигнута — все горят и по ним бежит волна
  const lit = done ? G.bulbs.length : Math.round(pct / 100 * G.bulbs.length);
  const grew = known && last !== null && value > last;
  G.lit(lit, grew);
  G.bulbs.forEach((b, i) => { if (done) { b.style.setProperty('--td', '1.6s'); b.style.setProperty('--tdl', (i * .08).toFixed(2) + 's'); b.classList.add('tw'); } });
  if (grew) { $('.count').classList.remove('jump'); void $('.count').offsetWidth; $('.count').classList.add('jump'); }
  last = known ? value : null;
}

Overly.onSettings(v => {
  const typeChanged = S && (S['goal.type'] !== v['goal.type'] || S['goal.bulbs'] !== v['goal.bulbs']);
  S = v;
  if (typeChanged) { last = null; built = ''; }
  render();
  if (!opened) { opened = true; document.fonts.ready.then(() => { built = ''; render(); goal.classList.add('in'); }); }
});
Overly.onStats(s => { stats = s; render(); });
</script>
</body>
</html>
