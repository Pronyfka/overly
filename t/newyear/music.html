<meta charset="utf-8">
<title>Новогодняя ночь — музыка</title>
<!--
  ТЕМА «НОВОГОДНЯЯ НОЧЬ» · МУЗЫКА
  Что играет в Яндекс Музыке: стеклянная карточка, обложка со снежной шапкой, «Сейчас играет», название,
  исполнитель и тонкий провод-прогресс с огоньком на месте проигрывания. Появляется, качнувшись; на паузе тает.
  Высота источника задаёт размер, ширина — длину карточки.
-->
<link href="../../fonts/comfortaa.css" rel="stylesheet">
<link href="../../fonts/manrope.css" rel="stylesheet">
<link rel="stylesheet" href="ny.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #music { position: absolute; left: 6px; top: 0; height: 130px; display: flex; align-items: center; gap: 18px; padding: 0 26px 0 16px;
    box-sizing: border-box; font-family: Manrope, sans-serif; color: var(--text, var(--ink)); visibility: hidden;
    background: var(--surf); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 16px 36px -18px rgba(0, 0, 0, .7);
    opacity: 0; transform: translateY(-14px) rotate(-2deg); transform-origin: 50% -30px; }
  #music.shown { visibility: visible; }
  #music.in { animation: swingIn .9s cubic-bezier(.2, .9, .25, 1) forwards; }
  #music.out { opacity: 1; animation: melt .5s ease-in forwards; }
  @keyframes swingIn { 0% { opacity: 0; transform: translateY(-14px) rotate(-2.5deg); } 45% { opacity: 1; transform: translateY(2px) rotate(1.2deg); }
    70% { transform: rotate(-.4deg); } 100% { opacity: 1; transform: none; } }
  @keyframes melt { to { opacity: 0; transform: translateY(-10px); filter: blur(4px); } }
  #music > .cap { --cl: 30%; --cw: 36%; }

  .cover { position: relative; width: 98px; height: 98px; flex: none; border-radius: 18px; background: linear-gradient(135deg, #2C3D6B, #6B3A6E); }
  .cover .art { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; display: grid; place-items: center; color: #fff; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover .ph { width: 48%; height: 48%; opacity: .9; }
  .cover .ph svg { width: 100%; height: 100%; }
  .cover [hidden] { display: none; }
  .cover .cap { --cl: -2px; --cw: calc(100% + 4px); top: -8px; height: 14px; }
  #music.no-cover .cover { display: none; }

  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .kind { font: 800 12px Manrope, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--acc); }
  #music.no-label .kind { display: none; }
  .title { font: 700 27px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 17px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  #music.no-progress .prog { display: none; }
  .bar { position: relative; flex: 1; height: 2px; border-radius: 2px; background: rgba(255, 255, 255, .14); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: var(--acc); }
  .bar .dot { --c: var(--acc); position: absolute; top: 50%; left: 0; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; animation: nyTw 2.2s ease-in-out infinite; }
  .t { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Мини-версия: обложка и подпись уходят — остаются название, исполнитель и провод */
  #music { transition: height .45s var(--ease), top .45s var(--ease); }
  #music > .cover, #music > .info { transition: opacity .2s; }
  #music.swap > .cover, #music.swap > .info { opacity: 0; }
  #music.mini { height: 84px; }
  #music.mini .cover, #music.mini .info .kind { display: none; }
  #music.mini .info { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0 12px; }
  #music.mini .title { font-size: 22px; flex: 0 1 auto; max-width: 65%; }
  #music.mini .artist { font-size: 15px; flex: 1 1 0; }
  #music.mini .prog { flex-basis: 100%; margin-top: 6px; }
  #music.still, #music.still * { transition: none !important; }
  #music.flip > .cover, #music.flip > .info { opacity: 0; transition: opacity .2s; }
</style>
</head>
<body>
<div id="music">
  <div class="cap"></div>
  <div class="cover"><div class="art"><img alt=""><span class="ph"></span></div><div class="cap"></div></div>
  <div class="info">
    <div class="kind"></div>
    <div class="title"></div>
    <div class="artist"></div>
    <div class="prog"><div class="bar"><span class="fill"></span><span class="dot"></span></div><span class="t"></span></div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="../../runtime/music.js?v=mwe6bc1p"></script>
<script src="ny.js"></script>
<script>
const box = document.getElementById('music');
const $ = (s) => box.querySelector(s);
let S = null, swapT = 0;
$('.cover .ph').innerHTML = NY.icon('snowflake');
NY.cap(box.querySelector(':scope > .cap'));
NY.cap($('.cover .cap'), true);

function fit() {
  const k = Math.min(innerHeight / 150, innerWidth / 400);
  box.style.zoom = k;
  box.style.width = innerWidth / k - 12 + 'px';
  box.style.top = (innerHeight / k - 130) / 2 + 6 + (box.classList.contains('mini') ? OverlyMusic.miniShift(46) : 0) + 'px';
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  const st = box.style;
  st.setProperty('--acc', v['music.color']);
  st.setProperty('--font', Overly.font(v['music.font']));
  st.setProperty('--text', v['music.textColor']);
  st.setProperty('--surf', NY.rgba(v['music.surface'], v['music.surfaceOpacity']));
  box.classList.toggle('no-cover', !v['music.cover']);
  box.classList.toggle('no-label', !v['music.showLabel']);
  box.classList.toggle('no-progress', !v['music.progress']);
  box.classList.toggle('no-caps', !v['music.caps']);
  $('.kind').textContent = v['music.label'] || '';
  Overly.css(v['music.css']);
  fit();
});

function fill(m) {
  $('.title').textContent = m.title || '';
  $('.artist').textContent = m.artist || '';
  const img = $('.cover img');
  img.hidden = !m.cover;
  $('.cover .ph').hidden = !!m.cover;
  if (m.cover) img.src = m.cover;
}

OverlyMusic.watch({
  show() { box.classList.remove('out'); box.classList.add('shown'); requestAnimationFrame(() => { box.classList.remove('in'); void box.offsetWidth; box.classList.add('in'); }); },
  hide() { box.classList.remove('in'); box.classList.add('out'); setTimeout(() => { if (box.classList.contains('out')) box.classList.remove('shown', 'out'); }, 500); },
  track(m, first) {
    if (first) return fill(m);
    box.classList.add('flip');
    setTimeout(() => { fill(m); box.classList.remove('flip'); }, 240);
  },
  mini(on, instant) {
    clearTimeout(swapT);
    if (instant) { box.classList.add('still'); box.classList.toggle('mini', on); fit(); box.offsetWidth; box.classList.remove('still', 'swap'); return; }
    box.classList.add('swap');
    swapT = setTimeout(() => { box.classList.toggle('mini', on); fit(); swapT = setTimeout(() => box.classList.remove('swap'), 450); }, 220);
  },
  tick(pos, dur) {
    const p = dur ? Math.min(100, pos / dur * 100) : 0;
    $('.fill').style.width = p + '%';
    $('.bar .dot').style.left = p + '%';
    $('.t').textContent = dur ? `${OverlyMusic.time(pos)} / ${OverlyMusic.time(dur)}` : OverlyMusic.time(pos);
  },
});
</script>
</body>
</html>
