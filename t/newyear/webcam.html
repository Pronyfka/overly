<meta charset="utf-8">
<title>Новогодняя ночь — рамка вебки</title>
<!--
  ТЕМА «НОВОГОДНЯЯ НОЧЬ» · РАМКА ВЕБКИ
  Тёмная полоса по краю кадра, по ней обвита гирлянда (огоньки смотрят наружу и не закрывают лицо),
  сверху снежная шапка. Внутри кадра идёт снег, а в нижних углах растут сугробы — их наметает тем же снегом.
  Середина прозрачная: кладите поверх камеры и растягивайте по ней.
-->
<link href="../../fonts/comfortaa.css" rel="stylesheet">
<link href="../../fonts/manrope.css" rel="stylesheet">
<link rel="stylesheet" href="ny.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #frame { position: absolute; inset: 0; }
  #frame > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .inner { position: absolute; inset: calc(var(--t) + var(--m)); border-radius: var(--ri); overflow: hidden; }
  .inner canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #frame.no-snow .inner { display: none; }
  /* Сугроб лежит на верхней кромке тонкой рамки: плоское дно — на линии рамки, лампочки поверх снега */
  .capbox { position: absolute; left: var(--m); right: var(--m); top: var(--m); height: 0; }
  .capbox .cap { top: max(calc(var(--t) + 1px - var(--gs) * .5), calc(1px - var(--m))); height: calc(var(--gs) * .5); }
  /* Табличка на нижней или верхней полосе */
  .plate { position: absolute; display: flex; align-items: center; gap: .45em; padding: .35em .85em .4em; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); font: 700 calc(clamp(12px, 4vmin, 40px) * var(--labelScale, 1)) / 1 var(--font);
    color: var(--text); white-space: nowrap; box-shadow: 0 8px 20px -10px rgba(0, 0, 0, .7); }
  .plate .dot { --c: var(--acc); }
  .plate.tl { left: 8%; top: calc(var(--t) * .5 + var(--m)); translate: 0 -50%; }
  .plate.tr { right: 8%; top: calc(var(--t) * .5 + var(--m)); translate: 0 -50%; }
  .plate.bl { left: 8%; bottom: calc(var(--t) * .5 + var(--m)); translate: 0 50%; }
  .plate.br { right: 8%; bottom: calc(var(--t) * .5 + var(--m)); translate: 0 50%; }
  .plate.empty { display: none; }
</style>
</head>
<body>
<div id="frame">
  <svg class="band"></svg>
  <div class="inner"><canvas></canvas></div>
  <div class="capbox"><div class="cap"></div></div>
  <svg class="garland lights" style="left:0;top:0"></svg>
  <div class="plate"><span class="dot"></span><span class="txt"></span></div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="ny.js"></script>
<script>
const frame = document.getElementById('frame');
const $ = (s) => frame.querySelector(s);
let S = null, G = null, snow = null, sized = '';
const BULBS = { few: 1.85, normal: 1.25, many: .85 };     // расстояние между лампочками — в масштабах гирлянды (одинаково на любом размере)
const MIN_M = 10;                                       // от рамки до края источника — минимум; больше, если огоньки не помещаются
let M = MIN_M;
const DRIFT_MIN = { slow: 120, mid: 60, fast: 20 };     // за сколько минут дорастают сугробы

const rrect = (x, y, w, h, r) => `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;

// Всё рисуется в пикселях источника — пересчитываем при изменении размера
function draw() {
  if (!S) return;
  const W = innerWidth, H = innerHeight, m = Math.min(W, H);
  // Толщина полосы рамки: 5.5–9 px (тоньше на маленьком источнике), настройка — множитель. gs — масштаб гирлянды, от размера источника
  const t = Math.min(9, Math.max(5.5, m * .016)) * (S['cam.thickness'] || 100) / 100, gs = Math.max(14, m * .07);
  const R = Math.max(t, m * S['cam.radius'] / 100), ri = Math.max(3, R - t);
  frame.style.setProperty('--t', t + 'px');
  frame.style.setProperty('--ri', ri + 'px');
  frame.style.setProperty('--gs', gs + 'px');
  // Провод — по тонкой рамке, лампочки наружу; если свечение не помещается в 10 px — зазор растёт
  const bs = Math.min(gs / 30, (gs * .68 + MIN_M - 4) / 30), wireIn = t / 2;
  M = S['cam.garland'] ? Math.max(MIN_M, Math.ceil(30 * bs + gs * .07 + 3 - wireIn)) : MIN_M;
  frame.style.setProperty('--m', M + 'px');
  const bw = W - 2 * M, bh = H - 2 * M;   // размер самой рамки
  // Полоса рамки: внешний скруглённый прямоугольник минус внутренний
  $('svg.band').setAttribute('viewBox', `0 0 ${W} ${H}`);
  $('svg.band').innerHTML = `<path fill-rule="evenodd" fill="${NY.rgba(S['cam.band'], S['cam.bandOpacity'])}" d="${rrect(M, M, bw, bh, R)} ${rrect(M + t, M + t, bw - 2 * t, bh - 2 * t, ri)}"/>
    <path fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5" d="${rrect(M + t, M + t, bw - 2 * t, bh - 2 * t, ri)}"/>
    <path fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" d="${rrect(M + .75, M + .75, bw - 1.5, bh - 1.5, R)}"/>`;
  // Провод по середине полосы, чуть волнистый; лампочки наружу
  const lights = $('svg.lights');
  lights.setAttribute('width', W); lights.setAttribute('height', H); lights.setAttribute('viewBox', `0 0 ${W} ${H}`);
  lights.innerHTML = '';
  if (S['cam.garland']) {
    // Провод у внешней кромки рамки, лампочки смотрят наружу — в зазор до края источника
    const half = M + wireIn, base = NY.el('path', { d: rrect(half, half, W - 2 * half, H - 2 * half, Math.max(2, R - wireIn)) });
    lights.appendChild(base);
    const len = base.getTotalLength(), pts = [];
    for (let s = 0; s <= len; s += 5) {
      const p = base.getPointAtLength(s), q = base.getPointAtLength(Math.min(len, s + 1));
      const a = Math.atan2(q.y - p.y, q.x - p.x), off = Math.sin(s / (gs * 1.6)) * gs * .07;
      pts.push(`${(p.x + Math.sin(a) * off).toFixed(1)} ${(p.y - Math.cos(a) * off).toFixed(1)}`);
    }
    base.remove();
    const wire = NY.el('path', { class: 'wire', d: 'M' + pts.join('L') + 'Z' });
    wire.style.strokeWidth = Math.max(1.4, gs * .06);
    lights.appendChild(wire);
    G = NY.garland(lights, wire, { count: Math.max(8, Math.round(len / (gs * (BULBS[S['cam.bulbs']] || 1.85)))), scale: bs, outward: true, chase: true });
    G.lit(G.bulbs.length);
    G.paint(NY.lights(S), S.twinkle);
  }
  // Снег внутри кадра
  const inner = $('.inner canvas'), size = `${bw - 2 * t}x${bh - 2 * t}`;
  if (!snow) snow = new NY.Snow(inner, { per: 1.4, scale: Math.max(.5, m / 480), pile: { minutes: DRIFT_MIN[S['cam.driftSpeed']] || 60 } });
  else if (size !== sized) snow.resize(bw - 2 * t, bh - 2 * t);
  sized = size;
  snow.set(S['cam.snowInside'] ? S.snow : 'none');
  snow.pileRate(DRIFT_MIN[S['cam.driftSpeed']] || 60);
  if (!S['cam.drifts']) { snow.h = null; } else if (!snow.h) snow.initPile();
}
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 120); });

let capped = false;
Overly.onSettings(v => {
  S = v;
  frame.style.setProperty('--labelScale', (v['cam.labelSize'] || 100) / 100);
  frame.style.setProperty('--font', Overly.font(v['cam.font']));
  frame.style.setProperty('--text', v['cam.textColor']);
  frame.style.setProperty('--acc', NY.lights(v)[0]);
  frame.classList.toggle('no-caps', !v['cam.cap']);
  frame.classList.toggle('no-snow', !v['cam.snowInside'] && !v['cam.drifts']);
  if (!capped) { NY.cap($('.cap'), true); capped = true; }
  const plate = $('.plate');
  plate.querySelector('.txt').textContent = v['cam.label'] || '';
  plate.className = 'plate ' + v['cam.labelPos'] + (v['cam.label'] ? '' : ' empty');
  Overly.css(v['cam.css']);
  draw();
});
</script>
</body>
</html>
