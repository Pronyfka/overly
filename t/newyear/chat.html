<meta charset="utf-8">
<title>Новогодняя ночь — чат</title>
<!--
  ТЕМА «НОВОГОДНЯЯ НОЧЬ» · ЧАТ
  Сообщения — стеклянные карточки. Новое подвешено и покачивается при появлении, огонёк цвета ника вспыхивает,
  на верхний край ложится кусок сугроба (у каждого свой). Старые тают с лёгким размытием.
  Значки: стример — звезда, модератор — колокольчик, VIP — подарок, саб — снежинка.
-->
<link href="../../fonts/comfortaa.css" rel="stylesheet">
<link href="../../fonts/manrope.css" rel="stylesheet">
<link rel="stylesheet" href="ny.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #chat { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    gap: var(--gap, 14px); padding: 22px 16px 16px; box-sizing: border-box; font: 500 var(--fs, 20px)/1.4 var(--font); color: var(--text); }
  #chat.newest-top { flex-direction: column-reverse; }
  #chat.right { align-items: flex-end; }
  #chat.right .m { text-align: right; }
  #chat.stretch .m { align-self: stretch; }

  .m { position: relative; max-width: 100%; box-sizing: border-box; padding: .55em .85em .6em; overflow-wrap: anywhere; flex: none;
    background: var(--surf); border: 1px solid var(--line); border-radius: .9em; transform-origin: 50% -1.2em;
    box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .7); }
  #chat.no-panel .m { background: none; border-color: transparent; box-shadow: none; padding-left: 0; padding-right: 0; text-shadow: 0 1px 4px rgba(0, 0, 0, .85); }
  #chat.no-panel .m .cap { display: none; }
  .m .cap { transform: scaleY(0); animation: capIn .5s cubic-bezier(.3, 1.6, .5, 1) .35s forwards; }
  @keyframes capIn { to { transform: scaleY(1); } }

  .head { display: flex; align-items: center; gap: .4em; margin-bottom: .15em; }
  #chat.right .head { justify-content: flex-end; }
  .head .dot { --c: var(--acc); width: .46em; height: .46em; animation: dotIn 1.2s ease-out both; }
  #chat.no-dots .head .dot { display: none; }
  @keyframes dotIn { 0%, 40% { opacity: .2; box-shadow: 0 0 0 0 var(--c); } 55% { opacity: 1; box-shadow: 0 0 .9em .35em var(--c); } 100% { opacity: 1; } }
  .n { font-weight: 800; color: var(--acc); }
  #chat.inline .head { display: inline-flex; margin: 0 .45em 0 0; vertical-align: baseline; }
  .b { width: 1.05em; height: 1.05em; flex: none; color: var(--warm); display: inline-block; }
  .b svg { width: 100%; height: 100%; display: block; }
  #chat.no-badges .b { display: none; }
  .t { color: var(--text); }
  #chat.inline .t { display: inline; }
  .m img { height: var(--emote, 1.5em); vertical-align: middle; margin: -.3em .05em; }
  .m mark { background: none; color: var(--hl); font-weight: 800; text-shadow: 0 0 10px color-mix(in srgb, var(--hl) 70%, transparent); }
  .m.hl { border-color: var(--hl); box-shadow: 0 0 22px -4px color-mix(in srgb, var(--hl) 55%, transparent); }

  /* Появление: «Качается» — подвешено и покачивается; «Снизу» — поднимается; «Без анимации» */
  #chat.a-swing .m.in { animation: swingIn .8s cubic-bezier(.2, .9, .25, 1) both; }
  @keyframes swingIn { 0% { opacity: 0; transform: translateY(-22px) rotate(-3.5deg); } 45% { opacity: 1; transform: translateY(3px) rotate(1.6deg); }
    70% { transform: translateY(-1px) rotate(-.6deg); } 100% { transform: none; } }
  #chat.a-rise .m.in { animation: riseIn .5s var(--ease) both; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .m.out { animation: melt .6s ease-in forwards !important; }
  @keyframes melt { to { opacity: 0; transform: translateY(-14px); filter: blur(5px); } }
</style>
</head>
<body>
<div id="chat"></div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="ny.js"></script>
<script>
const box = document.getElementById('chat');
const BADGES = { broadcaster: 'star', moderator: 'bell', vip: 'gift', subscriber: 'snowflake' };
let S = null;

Overly.onSettings(v => {
  S = v;
  const st = box.style;
  st.setProperty('--fs', v['chat.fontSize'] + 'px');
  st.setProperty('--acc', v['chat.accent']);
  st.setProperty('--gap', v['chat.gap'] + 'px');
  st.setProperty('--text', v['chat.textColor']);
  st.setProperty('--surf', NY.rgba(v['chat.surface'], v['chat.surfaceOpacity']));
  st.setProperty('--emote', v['chat.emoteSize'] + 'em');
  st.setProperty('--hl', v['chat.highlightColor']);
  st.setProperty('--font', Overly.font(v['chat.font']));
  box.className = [
    v['chat.align'] === 'right' && 'right',
    v['chat.newest'] === 'top' && 'newest-top',
    !v['chat.panel'] && 'no-panel',
    !v['chat.badges'] && 'no-badges',
    !v['chat.caps'] && 'no-caps',
    !v['chat.dots'] && 'no-dots',
    v['chat.layout'] === 'inline' && 'inline',
    v['chat.stretch'] && 'stretch',
    'a-' + (v['chat.anim'] || 'swing'),
  ].filter(Boolean).join(' ');
  for (const m of box.children) m.style.setProperty('--acc', v['chat.userColors'] && m.dataset.color ? m.dataset.color : '');
  Overly.css(v['chat.css']);
  trim();
});

const list = (text) => String(text || '').toLowerCase().split(/[\s,;]+/).filter(Boolean);
function hidden(msg) {
  const text = (msg.fragments || []).map(f => f.text).join('').trim();
  if (S['chat.hideCommands'] && text.startsWith('!')) return true;
  return list(S['chat.hideBots']).includes(String(msg.login || '').toLowerCase());
}
function remove(m) {
  if (!m.isConnected || m.dataset.out) return;
  m.dataset.out = '1';
  if (S['chat.anim'] === 'none') { m.remove(); return; }
  m.classList.add('out');
  setTimeout(() => m.remove(), 620);
}
function trim() {
  const live = [...box.children].filter(m => !m.dataset.out);
  live.slice(0, Math.max(0, live.length - S['chat.max'])).forEach(m => m.remove());
}
function appendText(el, text, words) {
  if (!words.length) { el.append(document.createTextNode(text)); return false; }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  let found = false;
  for (const part of text.split(re)) {
    if (!part) continue;
    if (words.includes(part.toLowerCase())) { el.append(Object.assign(document.createElement('mark'), { textContent: part })); found = true; }
    else el.append(document.createTextNode(part));
  }
  return found;
}
const make = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text || '' });

Overly.onChat(msg => {
  if (!S || hidden(msg)) return;
  const m = make('div', 'm');
  m.dataset.id = msg.id || '';
  m.dataset.login = String(msg.login || '').toLowerCase();
  m.dataset.color = msg.color || '';
  if (S['chat.userColors'] && msg.color) m.style.setProperty('--acc', msg.color);

  const cap = make('div', 'cap'); NY.cap(cap);
  const head = make('div', 'head');
  head.append(make('span', 'dot'));
  for (const b of msg.badges || []) if (BADGES[b]) { const i = make('span', 'b'); i.title = b; i.innerHTML = NY.icon(BADGES[b]); head.append(i); }
  head.append(make('span', 'n', msg.name));
  const t = make('div', 't');
  const words = list(S['chat.highlight']);
  let hl = false;
  for (const f of msg.fragments || []) {
    if (f.emote || f.url) {
      const img = new Image();
      img.alt = f.text;
      img.src = f.url || `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(f.emote)}/default/dark/3.0`;
      t.append(img);
    } else if (appendText(t, f.text, words)) hl = true;
  }
  if (hl) m.classList.add('hl');
  m.append(cap, head, t);
  box.append(m);
  trim();
  if (S['chat.anim'] !== 'none') m.classList.add('in');
  if (S['chat.fadeSec'] > 0) setTimeout(() => remove(m), S['chat.fadeSec'] * 1000);
});

Overly.onChatMod(a => {
  for (const m of [...box.children]) {
    if (a.kind === 'clear' || (a.kind === 'delete' && m.dataset.id === a.id) ||
        (a.kind === 'clear_user' && m.dataset.login === String(a.login || '').toLowerCase())) remove(m);
  }
});
</script>
</body>
</html>
