<meta charset="utf-8">
<title>Тушь — алерты</title>
<!-- Порядок появления: мазок прописывается слева направо (щетинки вразнобой) → ник и строка проступают сквозь него
     из серого → с конца мазка слетают капли → вокруг ложатся цветные брызги → сверху ставится солнце.
     Уход: солнце сжимается → брызги тают → мазок стирается справа налево → текст растворяется последним. -->
<link href="../../fonts/shantell-sans.css" rel="stylesheet">
<link rel="stylesheet" href="sumi.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #alert { position: absolute; left: 50%; top: 50%; width: 780px; height: 300px; translate: -50% -50%; scale: var(--scale, 1); display: none;
    flex-direction: column; align-items: center; justify-content: center; font-family: var(--font);
    --paint: #0F0C0D; --text: #F8F4EF; }
  #alert.shown { display: flex; }
  #alert[data-valign="top"] { top: 0; translate: -50% 0; transform-origin: 50% 0; justify-content: flex-start; }
  #alert[data-valign="bottom"] { top: auto; bottom: 0; translate: -50% 0; transform-origin: 50% 100%; justify-content: flex-end; }
  #alert.light { --paint: #F3EEE8; --text: #191314; }

  .media { max-width: 200px; max-height: 110px; object-fit: contain; margin-bottom: -6px; opacity: 0; }
  .media[hidden] { display: none; }

  .stage { position: relative; flex: none; width: 760px; height: 200px; }
  .stage > * { position: absolute; }
  .brush { inset: 0; width: 100%; height: 100%; }
  .splat { inset: 0; background: var(--acc); -webkit-mask: var(--splat) center / 100% 100% no-repeat; opacity: 0; }
  .splat.in { animation: splatIn .34s var(--out) forwards; }
  @keyframes splatIn { from { opacity: 0; scale: .93; filter: blur(2px); } to { opacity: 1; scale: 1; filter: blur(0); } }
  .splat.out { opacity: 1; animation: fadeOut .3s ease forwards; }

  /* Солнце садится на верхний край мазка и дальше еле заметно дышит */
  .sun { left: 566px; top: -4px; width: 60px; height: 60px; scale: 0; }
  .sun i { position: absolute; inset: 0; background: radial-gradient(circle at 40% 36%, color-mix(in srgb, var(--acc) 93%, #fff), var(--acc) 62%, color-mix(in srgb, var(--acc) 82%, var(--deep)));
    -webkit-mask: var(--sun) center / contain no-repeat; animation: sunTurn 26s linear infinite; }
  @keyframes sunTurn { to { rotate: 360deg; } }
  .sun.in { animation: sunIn .58s cubic-bezier(.3, 1.6, .45, 1) forwards, sunBreath 3.2s ease-in-out .6s infinite alternate; }
  @keyframes sunIn { 0% { scale: 0; } 100% { scale: 1; } }
  @keyframes sunBreath { from { scale: 1; } to { scale: 1.07; } }
  .sun.out { scale: 1; animation: sunOut .26s cubic-bezier(.6, 0, .9, .4) forwards; }
  @keyframes sunOut { to { scale: 0; } }

  .text { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding-top: 4px;
    font-weight: 800; font-style: italic; text-transform: uppercase; line-height: 1.08; white-space: nowrap; }
  .name { font-size: 38px; color: var(--acc); letter-spacing: .02em; opacity: 0; }
  .line { font-size: 44px; color: var(--text); opacity: 0; }
  .chip { color: var(--acc); }
  .chip:empty { display: none; }
  .ink-in { animation: inkText .62s ease forwards; }
  @keyframes inkText {
    0%   { opacity: 0; filter: blur(4px); translate: 10px 0; }
    30%  { opacity: .3; filter: blur(0); translate: 0 0; }
    60%  { opacity: .45; }
    100% { opacity: 1; }
  }
  .ink-out { opacity: 1; animation: inkGone .34s ease forwards; }
  @keyframes inkGone { 40% { opacity: .4; } 100% { opacity: 0; filter: blur(2px); } }

  .msg { --stroke: var(--stroke2); position: relative; flex: none; max-width: 640px; margin-top: -14px; padding: 14px 48px 16px; box-sizing: border-box;
    background: var(--paint); color: var(--text); font-size: 21px; font-weight: 600; line-height: 1.3; text-align: center;
    -webkit-mask: var(--stroke2) center / 100% 100% no-repeat; opacity: 0; }
  .msg.wipe-in, .msg.wipe-out { opacity: 1; }
  .msg:empty { display: none; }
</style>
</head>
<body>
<div id="alert">
  <img class="media" alt="" hidden><video class="media" muted playsinline loop hidden></video>
  <div class="stage">
    <canvas class="brush" width="760" height="200"></canvas>
    <i class="splat"></i>
    <div class="text"><span class="name"></span><span class="line"><span class="kind"></span> <span class="chip"></span></span></div>
    <div class="sun"><i></i></div>
  </div>
  <div class="msg"></div>
</div>

<script src="../../runtime/overly.js?v=mwe36yl1"></script>
<script src="sumi.js"></script>
<script>
const root = document.getElementById('alert');
const $ = (s) => root.querySelector(s);
let S = null;
let timers = [];
let stopBrush = () => {};
let seed = 1;
const at = (ms, fn) => timers.push(setTimeout(fn, ms));

function fit() {
  if (!S) return;
  root.style.setProperty('--scale', Math.min(innerWidth / 780, innerHeight / 300) * S.size / 100);
  root.dataset.valign = S.valign;
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  root.style.setProperty('--font', Overly.font(v.font));
  root.classList.toggle('light', v.mode === 'light');
  Overly.css(v.css);
  fit();
});

const durationOf = (a) => (S[a.type + '.dur'] > 0 ? S[a.type + '.dur'] : S.showSec) * 1000;

function setMedia(url) {
  const img = $('img.media'), vid = $('video.media');
  const isVideo = /\.(webm|mp4)$/i.test(url || '');
  img.hidden = !url || isVideo;
  vid.hidden = !url || !isVideo;
  if (url && !isVideo) img.src = url;
  if (url && isVideo) { if (vid.getAttribute('src') !== url) vid.src = url; vid.currentTime = 0; vid.play().catch(() => {}); }
  if (!url || !isVideo) vid.pause();
}

function reset() {
  stopBrush();
  const cv = $('.brush');
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  $('.name').className = 'name';
  $('.line').className = 'line';
  $('.sun').className = 'sun';
  $('.splat').className = 'splat';
  for (const s of ['.msg', 'img.media', 'video.media']) $(s).classList.remove('pop-in', 'pop-out', 'wipe-in', 'wipe-out');
}

// Длинные строки уменьшаем, чтобы они не вылезали за мазок
function fitText() {
  for (const [sel, size] of [['.name', 38], ['.line', 44]]) {
    const el = $(sel);
    el.style.fontSize = '';
    const w = el.scrollWidth;
    if (w > 590) el.style.fontSize = size * 590 / w + 'px';
  }
}

function showAlert(a) {
  const k = a.type;
  const n = B.NUM[k](a);
  const showMs = durationOf(a);
  timers.forEach(clearTimeout); timers = [];
  reset();

  const color = S[k + '.color'];
  const paint = getComputedStyle(root).getPropertyValue('--paint').trim() || '#0F0C0D';
  root.style.setProperty('--acc', color);
  root.style.setProperty('--ink', B.ink(color));
  root.style.setProperty('--splat', Ink.url(Ink.splat(760, 200, ++seed, 26, true)));
  $('.name').textContent = a.name;
  $('.kind').textContent = S[k + '.label'] || '';
  $('.chip').textContent = B.fill(S[k + '.chip'], n);
  $('.msg').textContent = S.showMessage && a.message ? a.message : '';
  setMedia(S[k + '.media']);
  if (S.sound) {
    const vol = (S[k + '.volume'] ?? 100) / 100 * S.volume / 100;
    if (S[k + '.sound']) Overly.play(S[k + '.sound'], vol);
    else if (S.themeSound) B.sound(k, vol);
  }
  root.classList.add('shown');
  fitText();

  // Каждый алерт — свой мазок: форма не повторяется
  const cv = $('.brush'), src = Ink.stroke(760, 200, seed * 7 + 3);

  // ---- Появление ----
  stopBrush = Ink.animate(cv, src, { from: 0, to: 1, dur: 380, color: paint, seed });
  root.querySelectorAll('.media').forEach(m => B.replay(m, 'pop-in'));
  at(150, () => $('.name').classList.add('ink-in'));
  at(230, () => $('.line').classList.add('ink-in'));
  at(300, () => B.burst($('.stage'), 724, 100, paint, 7, 46));
  at(560, () => $('.splat').classList.add('in'));
  at(660, () => $('.sun').classList.add('in'));
  at(820, () => { if ($('.msg').textContent) B.replay($('.msg'), 'wipe-in'); });

  // ---- Уход в обратном порядке ----
  at(showMs - 780, () => { $('.sun').className = 'sun out'; });
  at(showMs - 660, () => { $('.splat').className = 'splat out'; });
  at(showMs - 580, () => {
    stopBrush();
    stopBrush = Ink.animate(cv, src, { from: 1, to: 0, dur: 330, color: paint, seed, ease: (t) => t * t });
    if ($('.msg').textContent) { $('.msg').classList.remove('wipe-in'); B.replay($('.msg'), 'wipe-out'); }
    root.querySelectorAll('.media').forEach(m => { m.classList.remove('pop-in'); B.replay(m, 'pop-out'); });
  });
  at(showMs - 340, () => { $('.name').className = 'name ink-out'; $('.line').className = 'line ink-out'; });
  at(showMs + 90, () => { root.classList.remove('shown'); reset(); $('video.media').pause(); });
}

const queue = [];
let busy = false;
function next() {
  const a = queue.shift();
  if (!a) { busy = false; return; }
  busy = true;
  showAlert(a);
  setTimeout(next, durationOf(a) + 120 + S.gapSec * 1000);
}
Overly.onEvent(a => {
  if (!S || !B.NUM[a?.type] || !S[a.type + '.on'] || !a.name) return;
  if ((S[a.type + '.min'] || 0) > (Number(a.amount) || 0)) return;
  queue.push(a);
  if (!busy) document.fonts.ready.then(() => { if (!busy) next(); });
});
</script>
</body>
</html>
