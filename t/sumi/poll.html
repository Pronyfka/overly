<meta charset="utf-8">
<title>Тушь — голосование</title>
<!--
  Тема «Тушь»: голосование (опрос Twitch). Карточка как у цели: сверху мелкая надпись, вопрос и время.
  Каждый вариант — маленькая шкала цели: цвет заливает строку по доле голосов, текст на заливке меняет цвет.
  У лидера слева квадрат. Конец — строка победителя заливается целиком, остальные гаснут, вместо времени «Итоги».
-->
<link href="../../fonts/shantell-sans.css" rel="stylesheet">
<link rel="stylesheet" href="sumi.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #poll { position: absolute; left: 10px; right: 10px; top: 10px; font-family: var(--font); font-size: var(--fs, 24px); visibility: hidden; }
  #poll.on { visibility: visible; }
  .card { position: relative; padding: .9em 1em 1em; display: flex; flex-direction: column; gap: .55em; background: var(--card); color: var(--cardInk);
    border-radius: var(--r); box-shadow: none; }
  .head { display: flex; align-items: flex-start; gap: .8em; padding: 0 .2em; }
  .t { flex: 1; min-width: 0; }
  .small { display: block; font-size: .58em; opacity: .65; white-space: nowrap; }
  .small:empty { display: none; }
  .title { display: block; margin-top: .1em; font-weight: 600; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .left { flex: none; margin-top: .15em; padding: .15em .55em; background: var(--acc); color: var(--ink); font-size: .75em; font-weight: 700;
    font-variant-numeric: tabular-nums; border-radius: var(--r); }
  .left:empty { display: none; }
  .list { display: flex; flex-direction: column; gap: .4em; }
  .opt { position: relative; height: 1.9em; border-radius: var(--r); overflow: hidden; transition: opacity .5s; }
  .layer { position: absolute; inset: 0; display: flex; align-items: center; gap: .6em; padding: 0 .75em; box-sizing: border-box; font-size: .85em; }
  .layer.base { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--cardInk); }
  .layer.top { background: var(--acc); color: var(--ink); clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); transition: clip-path .9s var(--io); }
  .opt:not(.lead) .layer.top { background: color-mix(in srgb, var(--acc) 45%, var(--card)); color: var(--cardInk); }
  .sq { width: .5em; height: .5em; flex: none; background: currentColor; border-radius: 50%; scale: 0; transition: scale .3s var(--io); }
  .opt.lead .sq { scale: 1; }
  .name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
  .num:empty { display: none; }
  #poll.ended .opt.win .layer.top { clip-path: inset(0 0 0 0); }
  #poll.ended .opt:not(.win) { opacity: .4; }
  .total { padding: 0 .2em; font-size: .62em; opacity: .65; }
  .total:empty { display: none; }
  #poll { --r: .35em; }
  .opt { border-radius: 0; -webkit-mask: var(--strokeW) center / 100% 100% no-repeat; } .opt .layer { padding: 0 1.4em; }
  .small { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; } .title, .name, .left { font-weight: 800; font-style: italic; text-transform: uppercase; }
</style>
</head>
<body>
<div id="poll">
  <div class="card">
    <div class="head"><div class="t"><span class="small"></span><span class="title"></span></div><span class="left"></span></div>
    <div class="list"></div>
    <div class="total"></div>
  </div>
</div>

<script src="../../runtime/overly.js"></script>
<script src="sumi.js"></script>
<script src="../../runtime/poll.js"></script>
<script>
const box = document.getElementById('poll');
const $ = (s) => box.querySelector(s);
let S = null, P = null, left = '', outTimer = 0, ready = false;

function size() { box.style.setProperty('--fs', Math.max(12, Math.min(innerHeight * .058, innerWidth * .045)) + 'px'); }
addEventListener('resize', size);
size();

const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
function numText(c) {
  const mode = S?.['poll.numbers'] || 'both';
  return mode === 'none' ? '' : mode === 'pct' ? c.pct + '%' : mode === 'votes' ? c.votes.toLocaleString('ru-RU') : `${c.pct}% · ${c.votes.toLocaleString('ru-RU')}`;
}

function look() {
  box.style.setProperty('--acc', S['poll.color']);
  box.style.setProperty('--ink', B.ink(S['poll.color']));
  box.style.setProperty('--font', Overly.font(S['poll.font']));
  B.mode(box, S['poll.mode']);
  Overly.css(S['poll.css']);
  const s = $('.small');
  if (s.textContent !== (S['poll.small'] || '')) s.textContent = S['poll.small'] || '';
  if (P) fill(P);
}

function tag() { $('.left').textContent = P?.state === 'ended' ? 'Итоги' : S?.['poll.showTimer'] ? left : ''; }

function fill(p) {
  P = p;
  box.classList.toggle('ended', p.state === 'ended');
  const t = $('.title');
  if (t.textContent !== p.title && !t.querySelector('span')) t.textContent = p.title;   // по буквам не обрываем
  [...$('.list').children].forEach((row, i) => {
    const c = p.choices[i];
    if (!c) return;
    row.querySelectorAll('.name').forEach(e => e.textContent = c.title);
    row.querySelectorAll('.num').forEach(e => e.textContent = numText(c));
    if (ready) row.style.setProperty('--p', c.pct + '%');
    row.classList.toggle('lead', c.lead);
    row.classList.toggle('win', c.win);
  });
  $('.total').textContent = S?.['poll.showTotal']
    ? `${p.state === 'ended' ? 'Итого' : 'Всего'}: ${p.total.toLocaleString('ru-RU')} ${plural(p.total, 'голос', 'голоса', 'голосов')}` : '';
  tag();
}

OverlyPoll.start({
  show(p) {
    clearTimeout(outTimer);
    ready = false;
    const layer = (cls) => `<div class="layer ${cls}"><i class="sq"></i><span class="name"></span><span class="num"></span></div>`;
    $('.list').replaceChildren(...p.choices.map(() => {
      const row = document.createElement('div');
      row.className = 'opt';
      row.innerHTML = layer('base') + layer('top');
      return row;
    }));
    $('.title').textContent = '';
    fill(p);
    const card = $('.card');
    card.classList.remove('wipe-out');
    box.classList.add('on');
    document.fonts.ready.then(() => {
      B.replay(card, 'wipe-in');
      setTimeout(() => {
        B.letters($('.title'), p.title, 0);
        B.replay($('.small'), 'pop-in');
        [...$('.list').children].forEach((row, i) => setTimeout(() => B.replay(row, 'wipe-in'), i * 90));
      }, 300);
      setTimeout(() => { ready = true; fill(P); }, 700);
    });
  },
  update(p) { fill(p); },
  hide() {
    B.replay($('.card'), 'wipe-out');
    outTimer = setTimeout(() => box.classList.remove('on'), 600);
  },
  tick(text) { left = text; tag(); },
});

Overly.onSettings(v => { S = v; look(); });
</script>
</body>
</html>
