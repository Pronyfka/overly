<meta charset="utf-8">
<title>Тушь — итоги</title>
<!-- Тема «Тушь»: вид и движение в sumi.css и skin.css, мазки рисует sumi.js (Ink). -->
<link href="../../fonts/shantell-sans.css" rel="stylesheet">
<link rel="stylesheet" href="sumi.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #list { position: absolute; inset: 0; padding: 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center;
    gap: .5em; font: 400 var(--fs, 22px)/1 var(--font); }
  .row { display: flex; align-items: flex-start; gap: .7em; }
  #list.v-top { justify-content: flex-start; } #list.v-bottom { justify-content: flex-end; }
  #list.h-left, #list.h-right { align-items: flex-start; }
  #list.h-right { align-items: flex-end; }
  #list.h-right .row { flex-direction: row-reverse; }
  #list.h-left .row .card, #list.h-right .row .card { flex: none; max-width: calc(100vw - 4em); }
  .row .sq { width: .7em; height: .7em; margin-top: .1em; background: var(--c, var(--acc)); flex: none; }
  .row .card { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1.1em; padding: .78em 1em; background: var(--card); color: var(--cardInk); }
  .row .lbl { flex: none; font-weight: 600; white-space: nowrap; }
  .row .val { min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.fresh .val { color: var(--cardInk); }
</style>
<link rel="stylesheet" href="skin.css">
</head>
<body>
<div id="list"></div>

<script src="../../runtime/overly.js"></script>
<script src="sumi.js"></script>
<script>
const list = document.getElementById('list');
const STORE = 'overly.blocks.stats';
const ROWS = ['lastTip', 'lastSub', 'bestTip', 'longSub', 'lastFollow', 'lastRaid', 'topBits'];
// Какой цвет события у строки
const ROW_TYPE = { lastTip: 'tip', bestTip: 'tip', lastSub: 'sub', longSub: 'resub', lastFollow: 'follow', lastRaid: 'raid', topBits: 'bits' };
let S = null;
let data = load();
let built = false;

function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch {} }

function valueOf(key) {
  const d = data[key];
  if (!d) return S['st.empty'] ?? '—';
  const money = (n) => B.fill(S['st.money'] || '{n}', n);
  if (key === 'lastTip' || key === 'bestTip') return `${d.name} — ${money(d.amount)}`;
  if (key === 'longSub') return `${d.name} — ${B.fill('{n} {месяц|месяца|месяцев}', d.amount)}`;
  if (key === 'lastRaid') return `${d.name} — ${B.fill('{n} {зритель|зрителя|зрителей}', d.amount)}`;
  if (key === 'topBits') return `${d.name} — ${d.amount}`;
  return d.name;
}

function rowEl(key) { return list.querySelector(`.row[data-key="${key}"]`); }

// Перестроить строки (после смены настроек) и проиграть появление
// Включённые строки в порядке, который задал стример (номер позиции)
const ordered = () => ROWS.filter(k => S['st.' + k]).sort((a, b) => (S[`st.${a}.pos`] ?? 0) - (S[`st.${b}.pos`] ?? 0));

function build() {
  const keys = ordered();
  list.replaceChildren(...keys.map((key, i) => {
    const r = document.createElement('div');
    r.className = 'row';
    r.dataset.key = key;
    r.innerHTML = '<i class="sq"></i><div class="card"><span class="lbl"></span><span class="val"></span></div>';
    r.querySelector('.lbl').textContent = S[`st.${key}.label`] || key;
    r.querySelector('.val').textContent = valueOf(key);
    if (S['st.eventColors']) r.style.setProperty('--c', S[ROW_TYPE[key] + '.color'] || '');
    setTimeout(() => { B.replay(r.querySelector('.card'), 'wipe-in'); B.replay(r.querySelector('.sq'), 'pop-in'); }, i * 90);
    r.querySelector('.card').style.clipPath = 'inset(0 100% 0 0)';
    r.querySelector('.card').addEventListener('animationend', (e) => { if (e.target.classList.contains('card')) e.target.style.clipPath = ''; }, { once: true });
    return r;
  }));
  built = true;
  fitRows();
}


// Строки не должны вылезать за источник: если их много или источник маленький, уменьшаем шрифт
function fitRows() {
  if (!S || !list.children.length) return;
  list.style.setProperty('--fs', S['st.fontSize'] + 'px');
  const top = list.firstElementChild.getBoundingClientRect().top, bottom = list.lastElementChild.getBoundingClientRect().bottom;
  const need = bottom - top + 28;
  if (need > innerHeight) list.style.setProperty('--fs', S['st.fontSize'] * innerHeight / need + 'px');
}
addEventListener('resize', fitRows);
let shape = '';
Overly.onSettings(v => {
  S = v;
  list.style.setProperty('--fs', v['st.fontSize'] + 'px');
  list.style.setProperty('--font', Overly.font(v['st.font']));
  list.style.setProperty('--acc', v['st.accent']);
  B.mode(list, v['st.mode']);
  Overly.css(v['st.css']);
  // Набор строк поменялся — перестраиваем с анимацией, иначе только обновляем подписи и цвета
  list.classList.remove('v-top', 'v-center', 'v-bottom', 'h-left', 'h-right', 'h-stretch');
  list.classList.add('v-' + (v['st.valign'] || 'center'), 'h-' + (v['st.halign'] || 'stretch'));
  const now = ordered().join();
  if (!built || now !== shape) { shape = now; build(); return; }
  for (const key of ROWS) {
    const r = rowEl(key);
    if (!r) continue;
    r.querySelector('.lbl').textContent = v[`st.${key}.label`] || key;
    r.querySelector('.val').textContent = valueOf(key);
    r.style.setProperty('--c', v['st.eventColors'] ? (v[ROW_TYPE[key] + '.color'] || '') : '');
  }
});

// Строка обновилась: квадрат крутится, значение проявляется по буквам
function bump(key) {
  const r = rowEl(key);
  if (!r) return;
  r.classList.add('fresh');
  B.replay(r.querySelector('.sq'), 'spin-in');
  B.letters(r.querySelector('.val'), valueOf(key));
  setTimeout(() => r.classList.remove('fresh'), 4000);
}

Overly.onEvent(a => {
  if (!S || !a) return;
  if (a.type === 'stats_clear') { data = {}; save(); build(); return; }
  if (!a.name || !B.NUM[a.type]) return;
  const n = Number(a.amount) || 0;
  const set = (key, v) => { data[key] = v; bump(key); };
  if (a.type === 'tip') {
    set('lastTip', { name: a.name, amount: n });
    if (!data.bestTip || n > data.bestTip.amount) set('bestTip', { name: a.name, amount: n });
  } else if (a.type === 'sub' || a.type === 'resub') {
    set('lastSub', { name: a.name });
    const months = a.type === 'resub' ? n || 1 : 1;
    if (!data.longSub || months > data.longSub.amount) set('longSub', { name: a.name, amount: months });
  } else if (a.type === 'follow') {
    set('lastFollow', { name: a.name });
  } else if (a.type === 'raid') {
    set('lastRaid', { name: a.name, amount: n });
  } else if (a.type === 'bits') {
    if (!data.topBits || n > data.topBits.amount) set('topBits', { name: a.name, amount: n });
  }
  save();
});
Overly.onSettings(() => requestAnimationFrame(fitRows));
</script>
</body>
</html>
