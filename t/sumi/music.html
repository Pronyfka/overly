<meta charset="utf-8">
<title>Тушь — музыка</title>
<!-- Тема «Тушь»: вид и движение в sumi.css и skin.css, мазки рисует sumi.js (Ink). -->
<link href="../../fonts/shantell-sans.css" rel="stylesheet">
<link rel="stylesheet" href="sumi.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #music { position: absolute; left: 0; top: 0; height: 120px; display: flex; font-family: var(--font); visibility: hidden; }
  #music.shown { visibility: visible; }
  #music.right { flex-direction: row-reverse; }
  .cover { width: 120px; height: 120px; flex: none; background: var(--acc); color: var(--ink); display: grid; place-items: center; font-size: 44px; opacity: 0; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover [hidden] { display: none; }
  #music.no-cover .cover { display: none; }
  .card { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 26px;
    background: var(--card); color: var(--cardInk); clip-path: inset(0 100% 0 0); }
  #music.right .card { text-align: right; }
  .label { font-size: 15px; color: var(--muted); }
  #music.no-label .label { display: none; }
  .title { font-size: 30px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 19px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: color-mix(in srgb, var(--muted) 25%, transparent); }
  .bar i { position: absolute; inset: 0; background: var(--acc); transform-origin: left; transform: scaleX(0); }
  #music.no-progress .bar, #music.no-progress .t { display: none; }
  .card { background: color-mix(in srgb, var(--card) var(--cardA, 100%), transparent); overflow: hidden; }
  /* Скругление: обложка и карточка вместе — один блок со скруглёнными краями */
  .cover { overflow: hidden; border-radius: var(--r) 0 0 var(--r); }
  .card { border-radius: 0 var(--r) var(--r) 0; }
  #music.right .cover { border-radius: 0 var(--r) var(--r) 0; }
  #music.right .card { border-radius: var(--r) 0 0 var(--r); }
  #music.no-cover .card, #music.mini .card { border-radius: var(--r); }
  /* Мини-версия: обложка и подпись уходят, остаются название, исполнитель и таймлайн — полоска ниже */
  #music { transition: height .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1); }
  #music .card > :not(.bar) { transition: opacity .2s; }
  #music.swap .card > :not(.bar) { opacity: 0; }
  #music.mini { height: 72px; }
  #music.mini .cover, #music.mini .label { display: none; }
  #music.mini .card { flex-direction: row; align-items: center; gap: 14px; padding-right: 130px; }
  #music.right.mini .card { flex-direction: row-reverse; padding: 0 26px 0 130px; }
  #music.mini .title { font-size: 24px; flex: 0 1 auto; max-width: 60%; }
  #music.mini .artist { font-size: 16px; flex: 1 1 0; }
  #music.mini .t { top: 50%; translate: 0 -50%; }
  #music.still, #music.still * { transition: none !important; }
  .t { position: absolute; right: 26px; top: 14px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #music.right .t { right: auto; left: 26px; }
</style>
<link rel="stylesheet" href="skin.css">
</head>
<body>
<div id="music">
  <div class="cover"><img alt=""><span class="ph">♪</span></div>
  <div class="card">
    <span class="label"></span><div class="title"></div><div class="artist"></div>
    <span class="t"></span><div class="bar"><i></i></div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe3ddcw"></script>
<script src="../../runtime/music.js?v=mwe3ddcw"></script>
<script src="sumi.js"></script>
<script>
const box = document.getElementById('music');
const $ = (s) => box.querySelector(s);
let swapT = 0, gen = 0;   // gen — чтобы поздний таймер скрытия не спрятал виджет, показанный снова
let S = null;

function fit() {
  const k = Math.min(innerHeight / 130, innerWidth / 400);
  box.style.zoom = k;
  box.style.width = Math.min(innerWidth / k, (innerWidth / k) * (S?.['music.width'] ?? 100) / 100) + 'px';
  box.style.top = (innerHeight / k - 120) / 2 + (box.classList.contains('mini') ? OverlyMusic.miniShift(48) : 0) + 'px';
  if (S?.['music.align'] === 'right') box.style.left = innerWidth / k - parseFloat(box.style.width) + 'px'; else box.style.left = '0px';
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  box.style.setProperty('--acc', v['music.color']);
  box.style.setProperty('--ink', B.ink(v['music.color']));
  box.style.setProperty('--font', Overly.font(v['music.font']));
  B.mode(box, v['music.mode']);
  box.style.setProperty('--cardA', (v['music.surfaceOpacity'] ?? 100) + '%');
  box.style.setProperty('--r', (v['music.radius'] ?? 0) + 'px');
  box.classList.toggle('right', v['music.align'] === 'right');
  box.classList.toggle('no-cover', !v['music.cover']);
  box.classList.toggle('no-label', !v['music.showLabel']);
  box.classList.toggle('no-progress', !v['music.progress']);
  $('.label').textContent = v['music.label'] || '';
  Overly.css(v['music.css']);
  fit();
});

function fill(m, delay) {
  B.letters($('.title'), m.title || '', delay);
  $('.artist').textContent = m.artist || '';
  const img = $('.cover img');
  img.hidden = !m.cover;
  $('.cover .ph').hidden = !!m.cover;
  if (m.cover) img.src = m.cover;
}

OverlyMusic.watch({
  show() {
    const g = ++gen;
    box.classList.add('shown');
    const c = $('.cover');
    ['wipe-out', 'pop-out'].forEach(a => { c.classList.remove(a); $('.card').classList.remove(a); });
    if (!box.classList.contains('no-cover')) B.tumble(box, c.offsetLeft + 60, 60, S['music.color'], { size: 60, time: .6 });
    setTimeout(() => { if (g === gen) { B.replay(c, 'spin-in'); B.replay($('.card'), 'wipe-in'); } }, 480);
  },
  hide() {
    B.replay($('.card'), 'wipe-out'); B.replay($('.cover'), 'pop-out');
    const g = ++gen;
    setTimeout(() => { if (g === gen) box.classList.remove('shown'); }, 500);
  },
  track(m, first) {
    fill(m, first ? 800 : 0);
    if (!first) { B.replay($('.cover'), 'spin-in'); B.replay($('.artist'), 'pop-in'); }
  },
  mini(on, instant) {
    clearTimeout(swapT);
    if (instant) { box.classList.add('still'); box.classList.toggle('mini', on); fit(); box.offsetWidth; box.classList.remove('still', 'swap'); return; }
    // Содержимое гаснет, полоска меняет высоту, содержимое проявляется уже в новом виде
    box.classList.add('swap');
    swapT = setTimeout(() => { box.classList.toggle('mini', on); fit(); swapT = setTimeout(() => box.classList.remove('swap'), 450); }, 220);
  },
  tick(pos, dur) {
    $('.bar i').style.transform = `scaleX(${dur ? pos / dur : 0})`;
    $('.t').textContent = dur ? `${OverlyMusic.time(pos)} / ${OverlyMusic.time(dur)}` : OverlyMusic.time(pos);
  },
});
</script>
</body>
</html>
