<meta charset="utf-8">
<title>Матрица — чат</title>
<!-- Тема «Матрица»: вид и движение в matrix.css и skin.css. -->
<link href="../../fonts/montserrat.css" rel="stylesheet">
<link rel="stylesheet" href="matrix.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #chat { position: absolute; inset: 0; font: 400 var(--fs, 18px)/1.4 var(--font); --tail: 28px; }
  .bubble { position: absolute; left: 44px; right: 8px; top: 8px; bottom: calc(var(--tail) + 8px); background: var(--bg, var(--card)); }
  /* Хвостик — треугольник под карточкой; рядом — цветной квадрат */
  .tail { position: absolute; left: 44px; bottom: 8px; width: 36px; height: var(--tail); background: var(--bg, var(--card));
    clip-path: polygon(0 0, 100% 0, 0 100%); }
  .mark { position: absolute; left: 0; bottom: 4px; width: 32px; height: 32px; background: var(--acc); }
  #chat.tail-right .bubble { left: 8px; right: 44px; }
  #chat.tail-right .tail { left: auto; right: 44px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
  #chat.tail-right .mark { left: auto; right: 0; }
  #chat.no-bubble .bubble, #chat.no-bubble .tail, #chat.no-bubble .mark { display: none; }

  .msgs { position: absolute; left: 44px; right: 8px; top: 8px; bottom: calc(var(--tail) + 8px); padding: .9em 1.2em; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: flex-end; gap: .55em; overflow: hidden; color: var(--cardInk); }
  #chat.tail-right .msgs { left: 8px; right: 44px; }
  #chat.no-bubble .msgs { inset: 0; padding: 12px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .m { overflow-wrap: anywhere; flex: none; }
  #chat.right .msgs { text-align: right; }
  .m.new { animation: msgIn .4s var(--out) both; }
  @keyframes msgIn { from { opacity: 0; translate: 0 .7em; } to { opacity: 1; translate: 0 0; } }
  .n { font-weight: 600; color: var(--c, var(--acc)); }
  .colon { color: var(--muted); margin: 0 .25em 0 .15em; }
  .b { display: inline-grid; place-items: center; width: 1.05em; height: 1.05em; margin-right: .3em; vertical-align: -.15em;
    font: 700 .62em/1 sans-serif; color: #fff; background: var(--bc); }
  #chat.no-badges .b { display: none; }
  .b.broadcaster { --bc: #FF5A5F; } .b.moderator { --bc: #12B59A; } .b.vip { --bc: #E05BD0; } .b.subscriber { --bc: #7B3FF2; }
  .m img { height: var(--emote, 1.4em); vertical-align: middle; margin: -.3em .05em; }
  .m mark { background: var(--acc); color: var(--ink, #fff); padding: 0 .2em; }
</style>
<link rel="stylesheet" href="skin.css">
</head>
<body>
<div id="chat">
  <div class="bubble"></div><div class="tail"></div><i class="mark"></i>
  <div class="msgs"></div>
</div>

<script src="../../runtime/overly.js?v=mwe2kpya"></script>
<script src="matrix.js"></script>
<script>
const chat = document.getElementById('chat');
const box = chat.querySelector('.msgs');
const BADGES = { broadcaster: '▶', moderator: '⚔', vip: '◆', subscriber: '★' };
let S = null;
let intro = false;

Overly.onSettings(v => {
  S = v;
  const st = chat.style;
  st.setProperty('--fs', v['chat.fontSize'] + 'px');
  st.setProperty('--acc', v['chat.accent']);
  st.setProperty('--ink', B.ink(v['chat.accent']));
  st.setProperty('--emote', v['chat.emoteSize'] + 'em');
  st.setProperty('--font', Overly.font(v['chat.font']));
  B.mode(chat, v['chat.mode']);
  const card = v['chat.mode'] === 'dark' ? '#1E1E22' : '#F0F0F1';
  st.setProperty('--bg', B.rgba(card, v['chat.opacity']));
  chat.classList.toggle('tail-right', v['chat.tail'] === 'right');
  chat.classList.toggle('no-bubble', !v['chat.bubble']);
  chat.classList.toggle('no-badges', !v['chat.badges']);
  chat.classList.toggle('right', v['chat.align'] === 'right');
  for (const m of box.children) m.style.setProperty('--c', v['chat.userColors'] && m.dataset.color ? m.dataset.color : '');
  Overly.css(v['chat.css']);
  trim();
  if (!intro) {   // карточка раскрывается сверху вниз, квадрат выскакивает
    intro = true;
    B.replay(chat.querySelector('.bubble'), 'wipe-down');
    setTimeout(() => { B.replay(chat.querySelector('.tail'), 'pop-in'); B.replay(chat.querySelector('.mark'), 'spin-in'); }, 350);
  }
});

const list = (text) => String(text || '').toLowerCase().split(/[\s,;]+/).filter(Boolean);

function hidden(msg) {
  const text = (msg.fragments || []).map(f => f.text).join('').trim();
  if (S['chat.hideCommands'] && text.startsWith('!')) return true;
  return list(S['chat.hideBots']).includes(String(msg.login || '').toLowerCase());
}

function remove(m) {
  if (!m.isConnected || m.dataset.out) return;
  m.dataset.out = '1';
  m.classList.remove('new');
  B.replay(m, 'fade-out');
  setTimeout(() => m.remove(), 260);
}

function trim() {
  const live = [...box.children].filter(m => !m.dataset.out);
  live.slice(0, Math.max(0, live.length - S['chat.max'])).forEach(m => m.remove());
}

function appendText(m, text, words) {
  if (!words.length) { m.append(document.createTextNode(text)); return; }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  for (const part of text.split(re)) {
    if (!part) continue;
    if (words.includes(part.toLowerCase())) m.append(Object.assign(document.createElement('mark'), { textContent: part }));
    else m.append(document.createTextNode(part));
  }
}

Overly.onChat(msg => {
  if (!S || hidden(msg)) return;
  const m = document.createElement('div');
  m.className = 'm new';
  m.dataset.id = msg.id || '';
  m.dataset.login = String(msg.login || '').toLowerCase();
  m.dataset.color = msg.color || '';
  if (S['chat.userColors'] && msg.color) m.style.setProperty('--c', msg.color);
  for (const b of msg.badges || []) {
    if (BADGES[b]) m.append(Object.assign(document.createElement('span'), { className: 'b ' + b, textContent: BADGES[b] }));
  }
  m.append(Object.assign(document.createElement('span'), { className: 'n', textContent: msg.name }));
  m.append(Object.assign(document.createElement('span'), { className: 'colon', textContent: ':' }));
  const words = list(S['chat.highlight']);
  for (const f of msg.fragments || []) {
    if (f.emote || f.url) {   // url — смайл BetterTTV / 7TV
      const img = new Image();
      img.alt = f.text;
      img.src = f.url || `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(f.emote)}/default/dark/3.0`;
      m.append(img);
    } else appendText(m, f.text, words);
  }
  m.addEventListener('animationend', () => m.classList.remove('new'), { once: true });
  box.append(m);
  trim();
  if (S['chat.fadeSec'] > 0) setTimeout(() => remove(m), S['chat.fadeSec'] * 1000);
});

Overly.onChatMod(a => {
  for (const m of [...box.children]) {
    if (a.kind === 'clear' || (a.kind === 'delete' && m.dataset.id === a.id) ||
        (a.kind === 'clear_user' && m.dataset.login === String(a.login || '').toLowerCase())) remove(m);
  }
});
</script>
</body>
</html>
