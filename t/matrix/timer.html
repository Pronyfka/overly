<meta charset="utf-8">
<title>Матрица — таймер марафона</title>
<!--
  Тема «Матрица»: таймер марафона. Карточка та же, что у цели (id="goal" — чтобы работали правила skin.css),
  справа крупное время. Продлили — над карточкой выскакивает плашка «+5:00 Ник», время подпрыгивает.
  Пауза — время приглушено. Время вышло — карточка заливается цветом с надписью конца (и точками, если включено).
-->
<link href="../../fonts/montserrat.css" rel="stylesheet">
<link rel="stylesheet" href="matrix.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #goal { position: absolute; left: 44px; top: 10px; bottom: 10px; width: calc((100vw - 54px) * var(--w, 1)); font-family: var(--font); font-size: var(--fs, 24px); }
  .card { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); }
  .layer { position: absolute; inset: 0; display: flex; align-items: center; gap: 1em; padding: 0 1.1em; box-sizing: border-box; }
  .layer.base { background: var(--card); color: var(--cardInk); }
  .t { flex: 1; min-width: 0; }
  .small { display: block; font-size: .58em; opacity: .65; white-space: nowrap; }
  .title { display: block; margin-top: .1em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { flex: none; font-size: 1.45em; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; transition: opacity .3s; }
  #goal.paused .time { opacity: .45; }
  .done { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: .5em; background: var(--acc); color: var(--ink);
    font-weight: 600; clip-path: inset(0 100% 0 0); }
  .done .sq { width: .55em; height: .55em; background: currentColor; }
  .mark { position: absolute; left: -34px; top: 50%; width: 22px; height: 22px; margin-top: -11px; background: var(--acc); scale: 0; }
  #goal.running .mark { animation: tick 1s steps(2) infinite; }
  @keyframes tick { 50% { opacity: .4; } }
  /* Плашка продления над правым краем карточки */
  .plus { position: absolute; right: .6em; bottom: calc(100% - .35em); display: flex; align-items: center; gap: .45em; padding: .18em .6em;
    background: var(--acc); color: var(--ink); font-size: .62em; font-weight: 700; white-space: nowrap; opacity: 0; z-index: 2; }
  .plus b { font-variant-numeric: tabular-nums; }
  .plus span { max-width: 10em; overflow: hidden; text-overflow: ellipsis; }
  .plus.pop-in { opacity: 1; }
</style>
<link rel="stylesheet" href="skin.css">
</head>
<body>
<div id="goal" class="timer">
  <i class="mark"></i>
  <div class="card">
    <div class="layer base"><div class="t"><span class="small"></span><span class="title"></span></div><span class="time"></span></div>
    <div class="done"><i class="sq"></i><span class="dtext"></span></div>
  </div>
  <div class="plus"><b></b><span></span></div>
</div>

<script src="../../runtime/overly.js?v=mwe36yl1"></script>
<script src="matrix.js"></script>
<script src="../../runtime/timer.js?v=mwe36yl1"></script>
<script>
const box = document.getElementById('goal');
const $ = (s) => box.querySelector(s);
let S = null, ready = false, wasDone = null, plusTimer = 0;

function size() { box.style.setProperty('--fs', Math.max(12, Math.min(innerHeight * .22, innerWidth * .036)) + 'px'); }
addEventListener('resize', size);
size();

function look() {
  box.style.setProperty('--acc', S['timer.color']);
  box.style.setProperty('--ink', B.ink(S['timer.color']));
  box.style.setProperty('--font', Overly.font(S['timer.font']));
  box.style.setProperty('--w', (S['timer.width'] || 100) / 100);
  B.mode(box, S['timer.mode']);
  Overly.css(S['timer.css']);
  // Текст меняем, только если он другой, — иначе оборвётся проявление по буквам
  const put = (sel, t) => { const e = $(sel); if (e.textContent !== t) e.textContent = t; };
  put('.small', S['timer.small'] || '');
  put('.title', S['timer.title'] || '');
}

function showDone(done) {
  if (!ready || done === wasDone) return;
  const d = $('.done');
  if (done) {
    d.classList.remove('wipe-out');
    B.replay(d, 'wipe-in');
    B.letters($('.dtext'), S?.['timer.endText'] || '', 350);
    if (S?.['timer.burst']) {
      const r = box.getBoundingClientRect();
      setTimeout(() => { B.burst(box, r.width * .3, r.height / 2, S['timer.color'], 10, r.height * .3); B.burst(box, r.width * .72, r.height / 2, S['timer.color'], 10, r.height * .3); }, 500);
    }
  } else if (wasDone) {
    B.replay(d, 'wipe-out');
  }
  wasDone = done;
}

let lastState = 'idle';
OverlyTimer.start({
  render(text, info) {
    for (const s of ['idle', 'running', 'paused', 'done']) box.classList.toggle(s, info.state === s);
    $('.time').textContent = text;
    lastState = info.state;
    showDone(info.state === 'done');
  },
  added(a) {
    if (!S || !S['timer.showAdd'] || a.seconds < 0 || !ready) return;
    $('.plus b').textContent = a.text;
    $('.plus span').textContent = a.name || '';
    const p = $('.plus');
    p.classList.remove('pop-out');
    B.replay(p, 'pop-in');
    B.replay($('.time'), 'pop-in');   // время «выскакивает» заново, как в появлении темы
    clearTimeout(plusTimer);
    plusTimer = setTimeout(() => { p.classList.remove('pop-in'); B.replay(p, 'pop-out'); }, 3200);
  },
});

// Появление: квадрат кувырком → карточка шторкой → текст по буквам → время
function intro() {
  B.tumble(box, -23, box.offsetHeight / 2, S['timer.color'], { size: 34, time: .6 });
  setTimeout(() => { B.replay($('.mark'), 'pop-in'); B.replay($('.card'), 'wipe-in'); }, 480);
  setTimeout(() => {
    B.letters($('.title'), S['timer.title'] || '', 0);
    B.replay($('.small'), 'pop-in');
    B.replay($('.time'), 'pop-in');
  }, 800);
  setTimeout(() => { ready = true; wasDone = false; showDone(lastState === 'done'); }, 1150);
}

let started = false;
Overly.onSettings(v => {
  S = v;
  look();
  if (!started) { started = true; document.fonts.ready.then(intro); }
});
</script>
</body>
</html>
