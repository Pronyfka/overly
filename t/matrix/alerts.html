<meta charset="utf-8">
<title>Матрица — алерты</title>
<!-- Порядок появления: плашка мигает → линия прочерчивается от неё → подпись выезжает из-за плашки →
     ник поднимается из-под линии серым → мигает контуром → становится сплошным. Уход — в обратном порядке. -->
<link href="../../fonts/montserrat.css" rel="stylesheet">
<link rel="stylesheet" href="matrix.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #alert { position: absolute; left: 50%; top: 50%; width: 780px; height: 300px; translate: -50% -50%; scale: var(--scale, 1); display: none;
    flex-direction: column; align-items: center; justify-content: center; font-family: var(--font); color: var(--text); --text: #fff; }
  #alert.shown { display: flex; }
  #alert[data-valign="top"] { top: 0; translate: -50% 0; transform-origin: 50% 0; justify-content: flex-start; }
  #alert[data-valign="bottom"] { top: auto; bottom: 0; translate: -50% 0; transform-origin: 50% 100%; justify-content: flex-end; }
  #alert.light { --text: #111318; }

  .media { max-width: 200px; max-height: 130px; object-fit: contain; margin-bottom: 8px; opacity: 0; }
  .media[hidden] { display: none; }
  .block { display: flex; flex-direction: column; width: fit-content; max-width: 760px; }
  .nameMask { overflow: hidden; line-height: 1.04; padding-top: .04em; }
  .name { display: block; font-size: 74px; font-weight: 800; text-transform: uppercase; letter-spacing: .005em; white-space: nowrap; color: #A9ADB8;
    translate: 0 110%; }
  .name.up { animation: nameUp .2s var(--out) forwards; }
  @keyframes nameUp { to { translate: 0 0; } }
  .name.ghost { color: transparent; -webkit-text-stroke: 1.5px var(--text); translate: 0 0; }
  .name.solid { color: var(--text); translate: 0 0; }
  .name.down { color: var(--text); animation: nameDown .2s var(--io) forwards; }
  @keyframes nameDown { from { translate: 0 0; } to { translate: 0 110%; } }

  .rule { height: 3px; background: var(--acc); transform-origin: right; scale: 0 1; }
  .rule.draw { animation: ruleIn .46s var(--io) forwards; }
  @keyframes ruleIn { to { scale: 1 1; } }
  .rule.undraw { scale: 1 1; animation: ruleOut .3s var(--io) forwards; }
  @keyframes ruleOut { to { scale: 0 1; } }

  .under { display: flex; align-items: stretch; justify-content: flex-end; gap: 12px; margin-top: 10px; }
  .kindMask { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: flex-end; }
  .kind { display: block; font-size: 25px; font-weight: 800; text-transform: uppercase; white-space: nowrap; color: var(--acc); translate: 105% 0; }
  .kind.out { animation: kindOut .3s var(--out) forwards; }
  @keyframes kindOut { to { translate: 0 0; } }
  .kind.back { translate: 0 0; animation: kindBack .22s var(--io) forwards; }
  @keyframes kindBack { to { translate: 105% 0; } }
  .chip { flex: none; display: grid; place-items: center; min-height: 40px; padding: 2px 16px; box-sizing: border-box; background: var(--acc); color: var(--ink);
    font-size: 22px; font-weight: 800; white-space: nowrap; opacity: 0; }
  .chip:empty { min-width: 40px; padding: 0; }
  .msg { max-width: 660px; margin-top: 14px; font-size: 22px; font-weight: 500; line-height: 1.3; text-align: center; color: var(--text); opacity: 0; }
  .msg:empty { display: none; }
</style>
<link rel="stylesheet" href="skin.css">
</head>
<body>
<div id="alert">
  <img class="media" alt="" hidden><video class="media" muted playsinline loop hidden></video>
  <div class="block">
    <div class="nameMask"><span class="name"></span></div>
    <div class="rule"></div>
    <div class="under"><div class="kindMask"><span class="kind"></span></div><span class="chip"></span></div>
  </div>
  <div class="msg"></div>
</div>

<script src="../../runtime/overly.js"></script>
<script src="matrix.js"></script>
<script>
const root = document.getElementById('alert');
const $ = (s) => root.querySelector(s);
let S = null;
let timers = [];
const at = (ms, fn) => timers.push(setTimeout(fn, ms));

function fit() {
  if (!S) return;
  root.style.setProperty('--scale', Math.min(innerWidth / 780, innerHeight / 300) * S.size / 100);
  root.dataset.valign = S.valign;
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  root.style.setProperty('--font', Overly.font(v.font));
  root.classList.toggle('light', v.mode === 'light');
  Overly.css(v.css);
  fit();
});

const durationOf = (a) => (S[a.type + '.dur'] > 0 ? S[a.type + '.dur'] : S.showSec) * 1000;

function setMedia(url) {
  const img = $('img.media'), vid = $('video.media');
  const isVideo = /\.(webm|mp4)$/i.test(url || '');
  img.hidden = !url || isVideo;
  vid.hidden = !url || !isVideo;
  if (url && !isVideo) img.src = url;
  if (url && isVideo) { if (vid.getAttribute('src') !== url) vid.src = url; vid.currentTime = 0; vid.play().catch(() => {}); }
  if (!url || !isVideo) vid.pause();
}

function reset() {
  $('.name').className = 'name';
  $('.rule').className = 'rule';
  $('.kind').className = 'kind';
  for (const s of ['.chip', '.msg', 'img.media', 'video.media']) $(s).classList.remove('pop-in', 'pop-out', 'wipe-in', 'wipe-out');
}

// Длинный ник уменьшаем, чтобы он не вылезал за блок
function fitName() {
  const n = $('.name');
  n.style.fontSize = '';
  const w = n.scrollWidth;
  if (w > 740) n.style.fontSize = 74 * 740 / w + 'px';
}

function showAlert(a) {
  const k = a.type;
  const n = B.NUM[k](a);
  const showMs = durationOf(a);
  timers.forEach(clearTimeout); timers = [];
  reset();

  const color = S[k + '.color'];
  root.style.setProperty('--acc', color);
  root.style.setProperty('--ink', B.ink(color));
  $('.name').textContent = a.name;
  $('.kind').textContent = S[k + '.label'] || '';
  $('.chip').textContent = B.fill(S[k + '.chip'], n);
  $('.msg').textContent = S.showMessage && a.message ? a.message : '';
  setMedia(S[k + '.media']);
  if (S.sound) {
    const vol = (S[k + '.volume'] ?? 100) / 100 * S.volume / 100;
    if (S[k + '.sound']) Overly.play(S[k + '.sound'], vol);
    else if (S.themeSound) B.sound(k, vol);
  }
  root.classList.add('shown');
  fitName();

  // ---- Появление, как в разборе: всё укладывается примерно в секунду ----
  B.replay($('.chip'), 'pop-in');
  root.querySelectorAll('.media').forEach(m => B.replay(m, 'pop-in'));
  at(70, () => $('.rule').classList.add('draw'));
  at(300, () => $('.kind').classList.add('out'));
  at(440, () => $('.name').classList.add('up'));
  at(640, () => { $('.name').className = 'name ghost'; });
  at(710, () => { $('.name').className = 'name solid'; });
  at(760, () => { $('.name').className = 'name ghost'; });
  at(810, () => { $('.name').className = 'name solid'; });
  at(860, () => { if ($('.msg').textContent) B.replay($('.msg'), 'pop-in'); });

  // ---- Уход в обратном порядке ----
  at(showMs - 620, () => { $('.name').className = 'name ghost'; });
  at(showMs - 570, () => { $('.name').className = 'name down'; if ($('.msg').textContent) { $('.msg').classList.remove('pop-in'); B.replay($('.msg'), 'pop-out'); } });
  at(showMs - 440, () => { $('.kind').className = 'kind back'; });
  at(showMs - 340, () => { $('.rule').className = 'rule undraw'; });
  at(showMs - 120, () => {
    $('.chip').classList.remove('pop-in'); B.replay($('.chip'), 'pop-out');
    root.querySelectorAll('.media').forEach(m => { m.classList.remove('pop-in'); B.replay(m, 'pop-out'); });
  });
  at(showMs + 90, () => { root.classList.remove('shown'); reset(); $('video.media').pause(); });
}

const queue = [];
let busy = false;
function next() {
  const a = queue.shift();
  if (!a) { busy = false; return; }
  busy = true;
  showAlert(a);
  setTimeout(next, durationOf(a) + 120 + S.gapSec * 1000);
}
Overly.onEvent(a => {
  if (!S || !B.NUM[a?.type] || !S[a.type + '.on'] || !a.name) return;
  if ((S[a.type + '.min'] || 0) > (Number(a.amount) || 0)) return;
  queue.push(a);
  if (!busy) document.fonts.ready.then(() => { if (!busy) next(); });
});
</script>
</body>
</html>
