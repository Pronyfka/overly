<meta charset="utf-8">
<title>Матрица — рамка вебки</title>
<!-- Тема «Матрица»: вид и движение в matrix.css и skin.css. -->
<link rel="stylesheet" href="matrix.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #cam { position: absolute; inset: 0; --bw: 4px; --sq: 34px; }
  .border { position: absolute; inset: 0; border: var(--bw) solid var(--card); box-sizing: border-box; clip-path: inset(0 100% 0 0); }
  .corner { position: absolute; width: var(--sq); height: var(--sq); background: var(--acc); opacity: 0; }
  .corner.tl { left: calc(var(--sq) / -3); top: calc(var(--sq) / -3); }
  .corner.tr { right: calc(var(--sq) / -3); top: calc(var(--sq) / -3); }
  .corner.bl { left: calc(var(--sq) / -3); bottom: calc(var(--sq) / -3); }
  .corner.br { right: calc(var(--sq) / -3); bottom: calc(var(--sq) / -3); }
  .corner.none { display: none; }
  /* Квадрат вылезает за край — оставляем ему место */
  #cam.pad { inset: calc(var(--sq) / 3); }
</style>
<link rel="stylesheet" href="skin.css">
</head>
<body>
<div id="cam"><div class="border"></div><i class="corner"></i></div>

<script src="../../runtime/overly.js?v=mwe2s8ed"></script>
<script src="matrix.js"></script>
<script>
const cam = document.getElementById('cam');
let intro = false;

Overly.onSettings(v => {
  cam.style.setProperty('--acc', v['cam.color']);
  cam.style.setProperty('--bw', v['cam.border'] + 'px');
  cam.style.setProperty('--sq', v['cam.cornerSize'] + 'px');
  B.mode(cam, v['cam.mode']);
  const pos = v['cam.corner'] || 'tl';
  cam.querySelector('.corner').className = 'corner ' + pos + (intro ? ' spin-in' : '');
  cam.classList.toggle('pad', pos !== 'none');
  Overly.css(v['cam.css']);
  if (!intro) {   // рамка раскрывается шторкой, квадрат выскакивает с поворотом
    intro = true;
    B.replay(cam.querySelector('.border'), 'wipe-in');
    setTimeout(() => B.replay(cam.querySelector('.corner'), 'spin-in'), 350);
  }
});
</script>
</body>
</html>
