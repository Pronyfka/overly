<meta charset="utf-8">
<title>Ведьмин час — алерты</title>
<!--
  ТЕМА «ВЕДЬМИН ЧАС» · АЛЕРТЫ
  Вспыхивает туманная полоса цвета события, из неё вылезает персонаж (призрак, рука зомби, череп…),
  под полосой проявляются подпись и ник. Призрак летает вдоль полосы, рука машет, остальные покачиваются.
  Уход: персонаж проваливается обратно, полоса гаснет.
  События: Overly.onEvent({ type: 'sub', name: 'Ник', amount: 2, message: 'Текст' })
  Типы: follow, sub, resub, gift, raid, bits, tip
-->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link href="../../fonts/rubik-wet-paint.css" rel="stylesheet">
<link rel="stylesheet" href="witch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }

  /* Алерт живёт в коробке 640×290 и вписывается в источник любого размера (--scale считает скрипт) */
  #alert { position: absolute; left: 50%; top: 50%; width: 640px; height: 290px; translate: -50% -50%;
    scale: var(--scale, 1); transform-origin: 50% 50%; visibility: hidden; font-family: var(--font); color: var(--text); }
  #alert.shown { visibility: visible; }
  #alert[data-valign="top"] { top: calc(10px * var(--scale, 1)); translate: -50% 0; transform-origin: 50% 0; }
  #alert[data-valign="bottom"] { top: auto; bottom: calc(10px * var(--scale, 1)); translate: -50% 0; transform-origin: 50% 100%; }

  /* Сцена персонажа обрезана по полосе — он вылезает прямо из тумана */
  .stage { position: absolute; left: 0; right: 0; top: 0; height: 160px; overflow: hidden; }
  .who { position: absolute; left: 50%; bottom: -6px; width: 140px; height: 140px; margin-left: -70px;
    translate: 0 110%; transition: translate .5s var(--pop); }
  .who > svg, .who .media { width: 100%; height: 100%; display: block; object-fit: contain; }
  .who [hidden] { display: none !important; }
  .who .body { width: 100%; height: 100%; transform-origin: 50% 100%; }
  #alert.up .who { translate: 0 0; }
  #alert.down .who { translate: 0 115%; transition: translate .45s cubic-bezier(.6, 0, .8, .4); }

  /* Вылез — приземляется с отскоком (сплющился-вытянулся), дальше живёт, пока висит алерт */
  #alert.up .body { animation: land .7s var(--ease); }
  @keyframes land { 0% { transform: scale(.8, 1.25); } 35% { transform: scale(1.18, .82); } 60% { transform: scale(.94, 1.06); } 100% { transform: none; } }
  #alert.idle[data-char="ghost"] .who { animation: glide 3.6s ease-in-out infinite; }
  #alert.idle[data-char="ghost"] .body { animation: hover 1.2s ease-in-out infinite alternate; }
  #alert.idle[data-char="hand"] .body { animation: handWave .9s ease-in-out infinite alternate; }
  #alert.idle[data-char="bat"] .body { animation: hover .5s ease-in-out infinite alternate; }
  #alert.idle .body { animation: bob 1.4s ease-in-out infinite alternate; }
  @keyframes glide { 0%, 100% { translate: 0 0; } 25% { translate: -170px 0; } 75% { translate: 170px 0; } }
  @keyframes hover { to { transform: translateY(-8px); } }
  @keyframes handWave { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes bob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-5px) rotate(2deg); } }

  /* Ореол за персонажем дышит в цвет события */
  .halo { position: absolute; left: 50%; bottom: -60px; width: 260px; height: 200px; margin-left: -130px; border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--acc) 55%, transparent), transparent); opacity: 0; transition: opacity .5s; }
  #alert.up .halo { opacity: .8; animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { scale: 1.15; opacity: .5; } }
  #alert.idle .mist .core { animation: corePulse 1.8s ease-in-out infinite; }
  @keyframes corePulse { 50% { filter: brightness(1.5); } }
  .puff { left: 320px; top: 158px; }

  .mist { position: absolute; left: 40px; right: 40px; top: 125px; }

  /* Подпись, ник и сообщение — по центру под полосой */
  .txt { position: absolute; left: 0; right: 0; top: 182px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  /* Поля вокруг текста — чтобы свечение ника не обрезалось */
  .txt > * { opacity: 0; translate: 0 -10px; transition: opacity .3s, translate .3s; max-width: 600px; padding: 4px 24px 10px; margin: -4px 0 -10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #alert.on .txt > * { opacity: 1; translate: 0 0; transition: opacity .45s var(--ease) var(--d), translate .55s var(--pop) var(--d); }
  .kind { color: var(--acc); }
  .msg { font: 500 19px/1.3 var(--font); color: var(--mutedText, var(--muted)); }
  .msg:empty { display: none; }
  #alert.plain .nick { font-family: var(--font); font-weight: 800; }
  /* Буквы ника падают по очереди, потом качаются волной */
  .nick .ch { opacity: 0; translate: 0 -26px; rotate: -12deg; }
  #alert.on .nick .ch { opacity: 1; translate: 0 0; rotate: 0deg;
    transition: opacity .2s calc(var(--i) * 38ms + 120ms), translate .5s var(--pop) calc(var(--i) * 38ms + 120ms), rotate .5s var(--pop) calc(var(--i) * 38ms + 120ms); }
</style>
</head>
<body>
<div id="alert">
  <div class="stage">
    <div class="halo"></div>
    <div class="who"><div class="body"></div><img class="media" alt="" hidden><video class="media" muted playsinline loop hidden></video></div>
  </div>
  <div class="mist"><div class="fog"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="sparks"></div><div class="core"></div></div>
  <div class="puff"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="txt">
    <div class="kind" style="--d:0ms"></div>
    <div class="nick" style="--d:90ms"></div>
    <div class="msg" style="--d:180ms"></div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="witch.js"></script>
<script>
const root = document.getElementById('alert');
const $ = (s) => root.querySelector(s);
let S = null;
let timers = [];
const at = (ms, fn) => timers.push(setTimeout(fn, ms));
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

// Искры над полосой: каждая со своей задержкой и сносом
$('.sparks').innerHTML = Array.from({ length: 12 }, (_, i) =>
  `<i style="left:${8 + i * 7.5 + Math.random() * 4}%;--dl:${(Math.random() * 2.2).toFixed(2)}s;--dx:${Math.round(Math.random() * 40 - 20)}px"></i>`).join('');

// Число события для подписи «{n}»
const NUM = {
  follow: () => 1,
  sub:    a => a.amount > 1 ? a.amount : 1,
  resub:  a => a.amount ?? 1,
  gift:   a => a.amount || 1,
  raid:   a => a.amount ?? 1,
  bits:   a => a.amount ?? 0,
  tip:    a => a.amount ?? 0,
};

// Вписываем коробку 640×290 в источник и уменьшаем на «Размер»
function fit() {
  if (!S) return;
  const k = Math.min(innerWidth / 660, innerHeight / 300) * S.size / 100;
  root.style.setProperty('--scale', k);
  root.dataset.valign = S.valign;
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  const st = root.style;
  st.setProperty('--font', Overly.font(v.font));
  st.setProperty('--text', v.textColor);
  st.setProperty('--mutedText', v.mutedColor);
  root.classList.toggle('plain', !v.spookyNick);
  Overly.css(v.css);
  fit();
});

const durationOf = (a) => (S[a.type + '.dur'] > 0 ? S[a.type + '.dur'] : S.showSec) * 1000;

function showAlert(a) {
  const k = a.type;
  const n = NUM[k](a);
  const showMs = durationOf(a);
  timers.forEach(clearTimeout); timers = [];

  root.style.setProperty('--acc', S[k + '.color'] || '#B57CFF');
  const ch = S[k + '.char'] || 'ghost';
  root.dataset.char = ch;
  $('.body').innerHTML = Witch.char(ch);
  $('.body').hidden = Witch.setMedia(root, S[k + '.media']);
  $('.kind').textContent = S[k + '.label'] || '';
  // Короткий ник — по буквам (падают и качаются), длинный — целиком, чтобы влез с многоточием
  if ([...a.name].length <= 18) Witch.letters($('.nick'), a.name); else $('.nick').textContent = a.name;
  $('.nick').classList.remove('wave');
  $('.msg').textContent = (S.showMessage && a.message) || Witch.fill(S[k + '.line'], n);
  if (S.sound) {
    const vol = (S[k + '.volume'] ?? 100) / 100 * S.volume / 100;
    if (S[k + '.sound']) Overly.play(S[k + '.sound'], vol);
    else if (S.themeSound) Witch.spooky(k, vol);
  }

  root.className = 'shown';
  root.dataset.char = ch;
  void root.offsetWidth;
  at(16, () => root.classList.add('lit'));
  at(380, () => { root.classList.add('up'); replay($('.puff'), 'go'); });
  at(700, () => root.classList.add('on'));
  at(1100 + [...a.name].length * 38, () => { root.classList.add('idle'); $('.nick').classList.add('wave'); });
  at(showMs - 1000, () => { root.classList.remove('on', 'idle'); $('.nick').classList.remove('wave'); root.classList.add('down'); replay($('.puff'), 'go'); });
  at(showMs - 450, () => root.classList.remove('lit'));
  at(showMs, () => { root.className = ''; $('video.media').pause(); });
}

// Очередь: алерты не перебивают друг друга, а идут по одному
const queue = [];
let busy = false;
function next() {
  const a = queue.shift();
  if (!a) { busy = false; return; }
  busy = true;
  showAlert(a);
  setTimeout(next, durationOf(a) + S.gapSec * 1000);
}
Overly.onEvent(a => {
  if (!S || !NUM[a?.type] || !S[a.type + '.on'] || !a.name) return;
  if ((S[a.type + '.min'] || 0) > (Number(a.amount) || 0)) return;   // меньше порога — не показываем
  queue.push(a);
  if (!busy) document.fonts.ready.then(() => { if (!busy) next(); });
});
</script>
</body>
</html>
