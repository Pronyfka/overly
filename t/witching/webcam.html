<meta charset="utf-8">
<title>Ведьмин час — рамка вебки</title>
<!--
  ТЕМА «ВЕДЬМИН ЧАС» · РАМКА ВЕБКИ
  Кривая «нарисованная» рамка со срезанными углами, мерцающей слизью на боках и тянущимися каплями сверху.
  С верхнего края может свисать паук на нитке.
  Четыре готовых цвета (фиолетовый, тыква, чёрный, слизь) или свои. Табличка с надписью — по желанию.
  В OBS положите источник поверх камеры и растяните по ней. Алерты удобно ставить на нижний край рамки.
-->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link href="../../fonts/rubik-wet-paint.css" rel="stylesheet">
<link rel="stylesheet" href="witch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #frame { position: absolute; inset: 0; }
  #frame > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* Табличка: маленькая кривая плашка цвета рамки */
  .plate { position: absolute; display: flex; align-items: center; gap: .45em; padding: .35em .9em .45em;
    font: 400 calc(clamp(12px, 4.2vmin, 40px) * var(--labelScale, 1)) / 1 var(--spook); color: var(--text); white-space: nowrap; }
  .plate > svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; }
  .plate .ico { width: 1.3em; height: 1.3em; flex: none; }
  .plate .ico svg { width: 100%; height: 100%; display: block; }
  #frame { isolation: isolate; }
  /* Табличка сидит прямо на рамке, внутри источника */
  .plate.tl { left: 7%; top: calc(var(--t) + 8px); }
  .plate.tr { right: 7%; top: calc(var(--t) + 8px); }
  .plate.bl { left: 7%; bottom: calc(var(--t) + 8px); }
  .plate.br { right: 7%; bottom: calc(var(--t) + 8px); }
  .plate.empty { display: none; }
  /* Паук свисает с верхнего края рамки */
  #frame .spider { right: 14%; top: calc(var(--t) - 4px); width: clamp(28px, 11vmin, 110px); height: clamp(28px, 11vmin, 110px); }
  #frame.no-spider .spider { display: none; }
  #frame.no-ico .plate .ico { display: none; }
  #frame.plain .plate { font-family: var(--font); font-weight: 800; letter-spacing: .06em; }
</style>
</head>
<body>
<div id="frame">
  <div class="spider"></div>
  <svg class="border"></svg>
  <div class="plate"><svg></svg><span class="ico"></span><span class="txt"></span></div>
</div>

<script src="../../runtime/overly.js?v=mwe2kpya"></script>
<script src="witch.js"></script>
<script>
const frame = document.getElementById('frame');
const $ = (s) => frame.querySelector(s);
let S = null;
$('.spider').innerHTML = Witch.char('spider');

function colors() {
  if (S['cam.preset'] !== 'custom') return Witch.FRAMES[S['cam.preset']] || Witch.FRAMES.purple;
  return { main: S['cam.main'], dark: S['cam.dark'], light: S['cam.light'], slime: S['cam.slime'] };
}

// Рамка рисуется в пикселях источника — пересчитываем при каждом изменении размера
function draw() {
  if (!S) return;
  const c = colors();
  const t = Math.max(6, Math.min(innerWidth, innerHeight) * S['cam.thickness'] / 100);
  frame.style.setProperty('--t', t + 'px');
  Witch.frame($('.border'), innerWidth, innerHeight, { t, colors: c, drips: S['cam.drips'], seed: S['cam.seed'] || 7 });
  const plate = $('.plate');
  plate.style.setProperty('--text', S['cam.textColor']);
  requestAnimationFrame(() => {
    const r = plate.getBoundingClientRect();
    Witch.frame(plate.querySelector('svg'), r.width, r.height, { t: Math.max(3, r.height * .09), colors: c, fill: c.main, seed: 3 });
  });
}
addEventListener('resize', draw);

Overly.onSettings(v => {
  S = v;
  frame.style.setProperty('--labelScale', (v['cam.labelSize'] || 100) / 100);
  frame.style.setProperty('--font', Overly.font(v['cam.font']));
  frame.classList.toggle('no-ico', v['cam.icon'] === 'none');
  frame.classList.toggle('plain', !v['cam.spooky']);
  frame.classList.toggle('no-spider', !v['cam.spider']);
  const plate = $('.plate');
  plate.querySelector('.txt').textContent = v['cam.label'] || '';
  plate.querySelector('.ico').innerHTML = v['cam.icon'] && v['cam.icon'] !== 'none' ? Witch.char(v['cam.icon']) : '';
  plate.className = 'plate ' + v['cam.labelPos'] + (v['cam.label'] ? '' : ' empty');
  Overly.css(v['cam.css']);
  document.fonts.ready.then(draw);
  draw();
});
</script>
</body>
</html>
