<meta charset="utf-8">
<title>Ведьмин час — музыка</title>
<!--
  ТЕМА «ВЕДЬМИН ЧАС» · МУЗЫКА
  Что играет в Яндекс Музыке: карточка в кривой рамке, обложка, «Сейчас играет», название, исполнитель
  и полоса прогресса «слизью» с каплей на конце. Появляется, поднимаясь с покачиванием; на паузе — проваливается вниз.
  Высота источника задаёт размер, ширина — длину карточки.
-->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link href="../../fonts/rubik-wet-paint.css" rel="stylesheet">
<link rel="stylesheet" href="witch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #music { position: absolute; left: 6px; top: 0; height: 140px; display: flex; align-items: center; gap: 20px; padding: 0 30px 0 22px;
    box-sizing: border-box; font-family: var(--font); color: var(--text); visibility: hidden; isolation: isolate;
    opacity: 0; translate: 0 30px; rotate: -2deg; transition: opacity .3s, translate .5s var(--pop), rotate .5s var(--pop); }
  #music.shown { visibility: visible; }
  #music.in { opacity: 1; translate: 0 0; rotate: 0deg; }
  #music > svg.box { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; }

  .cover { width: 96px; height: 96px; flex: none; border-radius: 10px; overflow: hidden; position: relative;
    background: color-mix(in srgb, var(--acc) 18%, #170C26); display: grid; place-items: center; rotate: -3deg;
    box-shadow: 0 0 0 3px var(--night), 0 0 0 5px color-mix(in srgb, var(--acc) 60%, transparent); }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover .ph { width: 76%; height: 76%; }
  .cover .ph svg { width: 100%; height: 100%; }
  .cover [hidden] { display: none; }
  #music.no-cover .cover { display: none; }
  /* Обложка покачивается, будто плывёт в котле */
  #music.in .cover { animation: coverFloat 3.2s ease-in-out infinite; }
  @keyframes coverFloat { 0%, 100% { translate: 0 0; rotate: -3deg; } 50% { translate: 0 -4px; rotate: 1.5deg; } }
  #music .puff { left: 70px; top: 70px; scale: .8; }
  #music.no-cover .puff { left: 40px; }

  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .info .kind { font-size: 13px; }
  #music.no-label .info .kind { display: none; }
  .title { font: 400 30px/1.1 var(--spook); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 2px 0 rgba(0, 0, 0, .45); }
  #music.plain .title { font-family: var(--font); font-weight: 800; }
  .artist { font-size: 18px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Полоса «слизью»: заполнение с каплей на конце */
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  #music.no-progress .prog { display: none; }
  .bar { position: relative; flex: 1; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: var(--acc);
    box-shadow: 0 0 10px color-mix(in srgb, var(--acc) 70%, transparent); }
  .bar .fill::after { content: ""; position: absolute; right: 2px; top: 4px; width: 7px; height: 11px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    background: var(--acc); animation: drip 2.4s ease-in infinite; }
  @keyframes drip { 0%, 40% { translate: 0 0; scale: 1 .6; opacity: 1; } 85% { translate: 0 12px; scale: .8 1.2; opacity: 1; } 100% { translate: 0 16px; opacity: 0; } }
  .t { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Мини-версия: обложка и подпись уходят, остаются название, исполнитель и полоса — карточка ниже */
  #music { transition: opacity .3s, translate .5s var(--pop), rotate .5s var(--pop), height .45s var(--ease), top .45s var(--ease); }
  #music > .cover, #music > .info { transition: opacity .2s; }
  #music.swap > .cover, #music.swap > .info { opacity: 0; }
  #music.mini { height: 88px; }
  #music.mini .cover, #music.mini .info .kind { display: none; }
  #music.mini .info { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0 12px; }
  #music.mini .title { font-size: 24px; flex: 0 1 auto; max-width: 65%; }
  #music.mini .artist { font-size: 16px; flex: 1 1 0; }
  #music.mini .prog { flex-basis: 100%; margin-top: 6px; }
  #music.still, #music.still * { transition: none !important; }
  /* Смена трека: содержимое тонет и всплывает */
  #music.flip > .cover, #music.flip > .info { opacity: 0; translate: 0 12px; transition: opacity .2s, translate .2s; }
  #music > .cover, #music > .info { translate: 0 0; }
</style>
</head>
<body>
<div id="music">
  <svg class="box"></svg>
  <div class="puff"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="cover"><img alt=""><span class="ph"></span></div>
  <div class="info">
    <div class="kind"></div>
    <div class="title"></div>
    <div class="artist"></div>
    <div class="prog"><div class="bar"><span class="fill"></span></div><span class="t"></span></div>
  </div>
</div>

<script src="../../runtime/overly.js"></script>
<script src="../../runtime/music.js"></script>
<script src="witch.js"></script>
<script>
const box = document.getElementById('music');
const $ = (s) => box.querySelector(s);
let S = null, swapT = 0;
$('.cover .ph').innerHTML = Witch.char('pumpkin');

// Рамка карточки перерисовывается под её текущий размер
function drawBox() {
  if (!S) return;
  const c = S['music.preset'] === 'custom'
    ? { main: S['music.frame'], dark: '#0C0A10', light: '#ffffff55', slime: S['music.color'] }
    : Witch.FRAMES[S['music.preset']] || Witch.FRAMES.purple;
  Witch.frame($('svg.box'), box.offsetWidth, box.offsetHeight, { t: 7, colors: c, fill: Witch.rgba(S['music.surface'], S['music.surfaceOpacity']), seed: 11 });
}

function fit() {
  const k = Math.min(innerHeight / 160, innerWidth / 400);
  box.style.zoom = k;
  box.style.width = innerWidth / k - 12 + 'px';
  box.style.top = (innerHeight / k - 140) / 2 + (box.classList.contains('mini') ? OverlyMusic.miniShift(52) : 0) + 'px';
  drawBox();
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  const st = box.style;
  st.setProperty('--acc', v['music.color']);
  st.setProperty('--font', Overly.font(v['music.font']));
  box.classList.toggle('no-cover', !v['music.cover']);
  box.classList.toggle('no-label', !v['music.showLabel']);
  box.classList.toggle('no-progress', !v['music.progress']);
  box.classList.toggle('plain', !v['music.spooky']);
  $('.kind').textContent = v['music.label'] || '';
  Overly.css(v['music.css']);
  fit();
});

function fill(m) {
  $('.title').textContent = m.title || '';
  $('.artist').textContent = m.artist || '';
  const img = $('.cover img');
  img.hidden = !m.cover;
  $('.cover .ph').hidden = !!m.cover;
  if (m.cover) img.src = m.cover;
}

// Рамка следует за высотой карточки, пока идёт переход в мини-версию и обратно
box.addEventListener('transitionend', e => { if (e.target === box && e.propertyName === 'height') drawBox(); });

OverlyMusic.watch({
  show() {
    box.classList.add('shown'); drawBox();
    requestAnimationFrame(() => { box.classList.add('in'); const p = $('.puff'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); });
  },
  hide() { box.classList.remove('in'); setTimeout(() => { if (!box.classList.contains('in')) box.classList.remove('shown'); }, 500); },
  track(m, first) {
    if (first) return fill(m);
    box.classList.add('flip');
    const p = $('.puff'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go');   // новый трек — клуб дыма
    setTimeout(() => { fill(m); box.classList.remove('flip'); }, 260);
  },
  mini(on, instant) {
    clearTimeout(swapT);
    if (instant) { box.classList.add('still'); box.classList.toggle('mini', on); fit(); box.offsetWidth; box.classList.remove('still', 'swap'); return; }
    box.classList.add('swap');
    swapT = setTimeout(() => { box.classList.toggle('mini', on); fit(); swapT = setTimeout(() => { box.classList.remove('swap'); drawBox(); }, 450); }, 220);
  },
  tick(pos, dur) {
    $('.fill').style.width = (dur ? Math.min(100, pos / dur * 100) : 0) + '%';
    $('.t').textContent = dur ? `${OverlyMusic.time(pos)} / ${OverlyMusic.time(dur)}` : OverlyMusic.time(pos);
  },
});
</script>
</body>
</html>
