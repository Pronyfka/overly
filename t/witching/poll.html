<meta charset="utf-8">
<title>Ведьмин час — голосование</title>
<!--
  ТЕМА «ВЕДЬМИН ЧАС» · ГОЛОСОВАНИЕ (опрос Twitch)
  Та же кривая рамка с подтёками, что у цели. Вопрос жутким шрифтом и колба-таймер, под ним варианты —
  маленькие колбы, в которые наливается зелье голосов (у лидера — цвета зелья, у остальных — мутное).
  Конец — над победителем всплывает призрак, остальные колбы тускнеют. Появление и уход — карточка качается и падает.
-->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link href="../../fonts/rubik-wet-paint.css" rel="stylesheet">
<link rel="stylesheet" href="witch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #poll { position: absolute; left: 8px; right: 8px; top: 10px; box-sizing: border-box; padding: 1.1em 1.3em 1.2em; display: flex; flex-direction: column; gap: .65em;
    font-family: var(--font); font-size: min(5.2vh, 4vw); color: var(--text); isolation: isolate;
    opacity: 0; translate: 0 -.6em; rotate: 1.5deg; }
  #poll.in { opacity: 1; translate: 0 0; rotate: 0deg; transition: opacity .3s, translate .7s var(--pop), rotate .7s var(--pop); }
  #poll.out { opacity: 0; translate: 0 .8em; rotate: -2deg; transition: opacity .35s .1s, translate .45s var(--ease), rotate .45s var(--ease); }
  #poll > svg.box { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; }

  .head { display: flex; align-items: flex-start; gap: .7em; }
  .q { flex: 1; min-width: 0; font: 400 1.3em/1.15 var(--spook); text-shadow: 0 2px 0 rgba(0, 0, 0, .45);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #poll.plain .q { font-family: var(--font); font-weight: 800; font-size: 1.15em; }
  .left { flex: none; margin-top: .2em; padding: .15em .55em; border-radius: 99px; background: rgba(0, 0, 0, .35); font-size: .8em; font-weight: 800;
    color: var(--acc); font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--acc) 50%, transparent); }
  .left:empty { display: none; }

  .list { display: flex; flex-direction: column; gap: .5em; }
  .opt { position: relative; display: flex; flex-direction: column; gap: .25em; transition: opacity .5s; }
  .line { display: flex; align-items: baseline; gap: .6em; min-width: 0; }
  .name { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { flex: none; font-size: .8em; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .num:empty { display: none; }
  .opt.lead .num { color: var(--text); }
  .tube { position: relative; height: calc(.5em * var(--barH, 1)); border-radius: 99px; overflow: hidden;
    background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .14), inset 0 .1em .25em rgba(0, 0, 0, .5); }
  .liquid { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; transition: width 1.2s cubic-bezier(.3, 1.2, .5, 1), filter .4s;
    background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 70%, #fff), var(--acc) 45%, color-mix(in srgb, var(--acc) 70%, #000));
    filter: saturate(.25) brightness(.8); }
  .opt.lead .liquid { filter: none; box-shadow: 0 0 .5em color-mix(in srgb, var(--acc) 70%, transparent); }
  .tube::after { content: ""; position: absolute; left: .4em; right: .4em; top: 18%; height: 18%; border-radius: 99px; background: rgba(255, 255, 255, .25); }
  .opt.lead .tube.slosh .liquid { animation: slosh .8s var(--ease); }
  @keyframes slosh { 30% { filter: brightness(1.6); scale: 1 1.15; } }
  #poll.ended .opt:not(.win) { opacity: .45; }
  .opt.win .liquid { animation: doneGlow 1.4s ease-in-out infinite; }
  @keyframes doneGlow { 50% { filter: brightness(1.35); box-shadow: 0 0 1.2em var(--acc); } }
  .ghost { position: absolute; right: 0; bottom: .1em; width: 2.2em; height: 2.2em; opacity: 0; pointer-events: none; }
  .ghost svg { width: 100%; height: 100%; display: block; }
  .opt.win .ghost { animation: ghostUp 1.1s var(--pop) forwards, ghostFloat 2.4s ease-in-out 1.1s infinite; }
  @keyframes ghostUp { from { opacity: 0; translate: 0 .8em; scale: .4; } to { opacity: 1; translate: 0 -.9em; scale: 1; } }
  @keyframes ghostFloat { 50% { translate: 0 -1.2em; rotate: 6deg; } 0%, 100% { opacity: 1; translate: 0 -.9em; } }
  .opt.win .num { margin-right: 2.4em; }
  .total { font-size: .75em; font-weight: 700; color: var(--muted); }
  .total:empty { display: none; }
</style>
</head>
<body>
<div id="poll">
  <svg class="box"></svg>
  <div class="head"><span class="q"></span><span class="left"></span></div>
  <div class="list"></div>
  <div class="total"></div>
</div>

<script src="../../runtime/overly.js?v=mwe2s8ed"></script>
<script src="witch.js"></script>
<script src="../../runtime/poll.js?v=mwe2s8ed"></script>
<script>
const box = document.getElementById('poll');
const $ = (s) => box.querySelector(s);
let S = null, P = null, left = '', outTimer = 0;
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
function numText(c) {
  const mode = S?.['poll.numbers'] || 'both';
  return mode === 'none' ? '' : mode === 'pct' ? c.pct + '%' : mode === 'votes' ? c.votes.toLocaleString('ru-RU') : `${c.pct}% · ${c.votes.toLocaleString('ru-RU')}`;
}

function colors() {
  return S['poll.preset'] === 'custom'
    ? { main: S['poll.frame'], dark: '#0C0A10', light: '#ffffff55', slime: S['poll.color'] }
    : Witch.FRAMES[S['poll.preset']] || Witch.FRAMES.purple;
}
function drawBox() {
  if (!S || !box.offsetHeight) return;
  const w = box.offsetWidth, h = box.offsetHeight;
  Witch.frame($('svg.box'), w, h, { t: Math.max(4, Math.min(h, w) * .025), colors: colors(), fill: Witch.rgba(S['poll.surface'], S['poll.surfaceOpacity']), seed: 7 });
}
addEventListener('resize', drawBox);
new ResizeObserver(drawBox).observe(box);   // варианты добавились — рамка перерисовывается по новой высоте

function look() {
  const st = box.style;
  st.setProperty('--acc', S['poll.color']);
  st.setProperty('--text', S['poll.textColor']);
  st.setProperty('--font', Overly.font(S['poll.font']));
  st.setProperty('--barH', (S['poll.barHeight'] || 100) / 100);
  box.classList.toggle('plain', !S['poll.spooky']);
  Overly.css(S['poll.css']);
  if (P) fill(P);
  drawBox();
}

function tag() { $('.left').textContent = P?.state === 'ended' ? 'Итоги' : S?.['poll.showTimer'] ? left : ''; }

function fill(p, grow = true) {
  const before = P;
  P = p;
  box.classList.toggle('ended', p.state === 'ended');
  $('.q').textContent = p.title;
  [...$('.list').children].forEach((row, i) => {
    const c = p.choices[i];
    if (!c) return;
    row.querySelector('.name').textContent = c.title;
    row.querySelector('.num').textContent = numText(c);
    if (grow) row.querySelector('.liquid').style.width = Math.max(c.pct ? 3 : 0, c.pct) + '%';
    if (before && before.id === p.id && c.votes > (before.choices[i]?.votes || 0)) replay(row.querySelector('.tube'), 'slosh');
    row.classList.toggle('lead', c.lead);
    row.classList.toggle('win', c.win);
  });
  $('.total').textContent = S?.['poll.showTotal']
    ? `${p.state === 'ended' ? 'Итого' : 'Всего'}: ${p.total.toLocaleString('ru-RU')} ${plural(p.total, 'голос', 'голоса', 'голосов')}` : '';
  tag();
}

OverlyPoll.start({
  show(p) {
    clearTimeout(outTimer);
    P = null;
    $('.list').replaceChildren(...p.choices.map(() => {
      const row = document.createElement('div');
      row.className = 'opt';
      row.innerHTML = `<div class="line"><span class="name"></span><span class="num"></span></div><div class="tube"><div class="liquid"></div></div><span class="ghost">${Witch.char('ghost')}</span>`;
      return row;
    }));
    fill(p, false);
    box.classList.remove('out', 'in');
    document.fonts.ready.then(() => {
      drawBox();
      void box.offsetWidth;
      box.classList.add('in');
      setTimeout(() => fill(P), 500);   // зелье наливается, когда карточка уже на месте
    });
  },
  update(p) { fill(p); },
  hide() {
    box.classList.add('out');
    outTimer = setTimeout(() => box.classList.remove('in', 'out'), 600);
  },
  tick(text) { left = text; tag(); },
});

Overly.onSettings(v => { S = v; look(); });
</script>
</body>
</html>
