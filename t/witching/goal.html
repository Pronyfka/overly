<meta charset="utf-8">
<title>Ведьмин час — цель</title>
<!--
  ТЕМА «ВЕДЬМИН ЧАС» · ЦЕЛЬ
  Кривая карточка с бурлящим котлом и стеклянной колбой: зелье заполняет её до процента цели,
  внутри поднимаются пузыри, край жидкости колышется волной. Цифра выросла — зелье плещет, из края вырывается
  клуб дыма, процент подпрыгивает. Цель выполнена — зелье светится, над карточкой взлетает призрак.
-->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link href="../../fonts/rubik-wet-paint.css" rel="stylesheet">
<link rel="stylesheet" href="witch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  /* Всё в em: базовый шрифт растёт с высотой источника (и не даёт вылезти по ширине) */
  #goal { position: absolute; inset: 10px 8px 8px; box-sizing: border-box; padding: .8em 1.3em .9em 1em; display: flex; align-items: center; gap: .9em;
    font-family: var(--font); font-size: min(12.5vh, 2.6vw); color: var(--text); isolation: isolate;
    opacity: 0; translate: 0 -.6em; rotate: 1.5deg; }
  #goal.in { opacity: 1; translate: 0 0; rotate: 0deg; transition: opacity .3s, translate .7s var(--pop), rotate .7s var(--pop); }
  #goal > svg.box { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; }

  .pot { position: relative; width: 3.6em; height: 3.6em; flex: none; margin: -.3em 0; }
  .pot svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .pot .ghost { position: absolute; inset: 0; opacity: 0; translate: 0 0; }
  #goal.done .pot .ghost { animation: ghostOut 3.2s ease-in-out infinite; }
  @keyframes ghostOut { 0% { opacity: 0; translate: 0 .4em; scale: .5; } 20% { opacity: 1; } 60% { opacity: 1; translate: .3em -1.6em; scale: .8; rotate: 8deg; }
    100% { opacity: 0; translate: -.2em -2.6em; scale: .9; rotate: -6deg; } }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .45em; }
  .row { display: flex; align-items: baseline; gap: .8em; min-width: 0; }
  .title { flex: 1; min-width: 0; font: 400 1.3em/1.1 var(--spook); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 2px 0 rgba(0, 0, 0, .45); }
  #goal.plain .title { font-family: var(--font); font-weight: 800; font-size: 1.1em; }
  .count { font-size: .78em; font-weight: 700; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .count b { color: var(--text); font-weight: 800; }
  .count:empty { display: none; }

  /* Колба: стекло, зелье с волной на краю, пузыри внутри */
  .tube { position: relative; height: calc(.78em * var(--barH, 1)); border-radius: 99px; overflow: hidden;
    background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .16), inset 0 .12em .3em rgba(0, 0, 0, .5); }
  .liquid { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width 1.4s cubic-bezier(.3, 1.2, .5, 1);
    background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 70%, #fff), var(--acc) 45%, color-mix(in srgb, var(--acc) 70%, #000));
    box-shadow: 0 0 .6em color-mix(in srgb, var(--acc) 70%, transparent); border-radius: 99px 0 0 99px; }
  /* Волнистый край: вертикальная волна, бегущая вниз */
  .liquid .edge { position: absolute; left: 100%; top: -20%; width: .5em; height: 140%; margin-left: -1px; overflow: hidden; }
  .liquid .edge i { position: absolute; left: 0; top: -100%; width: 100%; height: 300%;
    background: radial-gradient(circle at 0 50%, var(--acc) 62%, transparent 64%) 0 0 / 100% .42em repeat-y; animation: edgeRun .9s linear infinite; }
  @keyframes edgeRun { to { translate: 0 .42em; } }
  .liquid .b { position: absolute; bottom: -.3em; width: .2em; height: .2em; border-radius: 50%; background: rgba(255, 255, 255, .75);
    animation: tubeBub 2s ease-in infinite; }
  @keyframes tubeBub { 0% { translate: 0 0; opacity: 0; } 20% { opacity: 1; } 100% { translate: .3em -1em; opacity: 0; } }
  .tube::after { content: ""; position: absolute; left: .4em; right: .4em; top: 18%; height: 18%; border-radius: 99px; background: rgba(255, 255, 255, .28); }
  .tube.slosh .liquid { animation: slosh .8s var(--ease); }
  @keyframes slosh { 30% { filter: brightness(1.6); scale: 1 1.08; } }
  .puff { scale: .6; }
  #goal.done .liquid { animation: doneGlow 1.4s ease-in-out infinite; }
  @keyframes doneGlow { 50% { filter: brightness(1.35); box-shadow: 0 0 1.4em var(--acc); } }

  .pct { font: 400 2.1em/1 var(--spook); color: var(--acc); font-variant-numeric: tabular-nums; flex: none; min-width: 2.4em; text-align: right;
    text-shadow: 0 0 .4em color-mix(in srgb, var(--acc) 60%, transparent), 0 3px 0 rgba(0, 0, 0, .4); transform-origin: 70% 80%; }
  #goal.no-pct .pct { display: none; }
  .pct.jump { animation: jump .55s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes jump { 40% { scale: 1.25; rotate: -6deg; } }
</style>
</head>
<body>
<div id="goal">
  <svg class="box"></svg>
  <div class="pot"></div>
  <div class="main">
    <div class="row"><span class="title"></span><span class="count"></span></div>
    <div class="tube"><div class="liquid"><span class="edge"><i></i></span></div></div>
  </div>
  <span class="pct"></span>
  <div class="puff"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>

<script src="../../runtime/overly.js?v=mwe2kpya"></script>
<script src="witch.js"></script>
<script>
const goal = document.getElementById('goal');
const $ = (s) => goal.querySelector(s);
let S = null, stats = {}, last = null, opened = false;

$('.pot').innerHTML = Witch.char('cauldron') + `<span class="ghost">${Witch.char('ghost')}</span>`;
// Пузыри в зелье: разбросаны по длине, у каждого свой темп
$('.liquid').insertAdjacentHTML('beforeend', Array.from({ length: 9 }, (_, i) =>
  `<i class="b" style="left:${6 + i * 11}%;animation-delay:${(-Math.random() * 2).toFixed(2)}s;animation-duration:${(1.6 + Math.random()).toFixed(2)}s"></i>`).join(''));

function colors() {
  return S['goal.preset'] === 'custom'
    ? { main: S['goal.frame'], dark: '#0C0A10', light: '#ffffff55', slime: S['goal.color'] }
    : Witch.FRAMES[S['goal.preset']] || Witch.FRAMES.purple;
}
function drawBox() {
  if (!S) return;
  const w = goal.offsetWidth, h = goal.offsetHeight;   // без учёта наклона при появлении
  Witch.frame($('svg.box'), w, h, { t: Math.max(4, h * .06), colors: colors(), fill: Witch.rgba(S['goal.surface'], S['goal.surfaceOpacity']), seed: 5 });
}
addEventListener('resize', drawBox);

const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

function render() {
  if (!S) return;
  const st = goal.style;
  st.setProperty('--acc', S['goal.color']);
  st.setProperty('--text', S['goal.textColor']);
  st.setProperty('--font', Overly.font(S['goal.font']));
  st.setProperty('--barH', (S['goal.barHeight'] || 100) / 100);
  goal.classList.toggle('plain', !S['goal.spooky']);
  Overly.css(S['goal.css']);

  const target = Math.max(1, Number(S['goal.target']) || 1);
  const value = stats[S['goal.type']];
  const known = typeof value === 'number';
  const done = known && value >= target;
  const pct = known ? Math.min(100, Math.floor(100 * value / target)) : 0;
  goal.classList.toggle('done', done);
  goal.classList.toggle('no-pct', !S['goal.percentBig']);

  $('.title').textContent = done ? (S['goal.done'] || S['goal.title']) : S['goal.title'];
  $('.pct').textContent = known ? pct + '%' : '—';
  const fmt = (n) => n.toLocaleString('ru-RU');
  const mode = S['goal.countMode'] || 'both';
  $('.count').innerHTML = !known ? 'подключите Twitch'
    : mode === 'none' ? ''
    : mode === 'percent' ? `<b>${pct}%</b>`
    : mode === 'count' ? `<b>${fmt(value)}</b>`
    : mode === 'left' ? `<b>${done ? 0 : fmt(target - value)}</b> осталось`
    : `<b>${fmt(value)}</b> / ${fmt(target)}`;
  // Зелье наливается после появления карточки
  const fill = () => { $('.liquid').style.width = Math.max(pct ? 4 : 0, pct) + '%'; };
  if (goal.classList.contains('in')) fill(); else setTimeout(fill, 500);

  if (known && last !== null && value > last) {   // выросло: плеск, клуб дыма у края зелья, прыжок процента
    replay($('.tube'), 'slosh');
    replay($('.pct'), 'jump');
    const t = $('.tube').getBoundingClientRect(), g = goal.getBoundingClientRect();
    const p = $('.puff');
    p.style.left = t.left - g.left + t.width * pct / 100 + 'px';
    p.style.top = t.top - g.top + t.height / 2 + 'px';
    replay(p, 'go');
  }
  last = known ? value : null;
  drawBox();
}

Overly.onSettings(v => {
  const typeChanged = S && S['goal.type'] !== v['goal.type'];
  S = v;
  if (typeChanged) last = null;
  render();
  if (!opened) { opened = true; document.fonts.ready.then(() => { drawBox(); goal.classList.add('in'); }); }
});
Overly.onStats(s => { stats = s; render(); });
</script>
</body>
</html>
