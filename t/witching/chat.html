<meta charset="utf-8">
<title>Ведьмин час — чат</title>
<!--
  ТЕМА «ВЕДЬМИН ЧАС» · ЧАТ
  Сообщения — кривые «нарисованные» пузыри, каждый чуть наклонён по-своему. Новое выпрыгивает из клуба дыма,
  удалённое или старое — тает, как призрак (размывается и улетает вверх). Значки — маленькие персонажи:
  стример — тыква, модератор — череп, VIP — зелье, саб — призрак. С некоторых пузырей медленно стекает капля.
-->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link href="../../fonts/rubik-wet-paint.css" rel="stylesheet">
<link rel="stylesheet" href="witch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #chat { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    gap: var(--gap, 10px); padding: 18px 22px; box-sizing: border-box; font: 500 var(--fs, 20px)/1.35 var(--font); color: var(--text); }
  #chat.newest-top { flex-direction: column-reverse; }
  #chat.right { align-items: flex-end; }
  #chat.right .m { text-align: right; }
  #chat.stretch .m { align-self: stretch; }

  /* Пузырь: неровные углы, обводка цвета ника, лёгкий наклон */
  .m { position: relative; max-width: 100%; box-sizing: border-box; padding: .55em .9em .6em; overflow-wrap: anywhere; flex: none;
    background: var(--surf); border: 2px solid color-mix(in srgb, var(--acc) 55%, transparent);
    border-radius: 16px 24px 14px 22px / 22px 14px 24px 16px; rotate: var(--tilt, 0deg);
    box-shadow: 0 4px 0 rgba(0, 0, 0, .25), 0 0 18px color-mix(in srgb, var(--acc) 18%, transparent); transform-origin: 0 100%; }
  #chat.right .m { transform-origin: 100% 100%; }
  #chat.no-tilt .m { rotate: 0deg; }
  #chat.no-panel .m { background: none; border-color: transparent; box-shadow: none; padding-left: 0; padding-right: 0; text-shadow: 0 1px 4px rgba(0, 0, 0, .85); }

  /* Капля стекает с нижнего края пузыря */
  .m.drippy::after { content: ""; position: absolute; left: var(--dx, 30%); top: 100%; width: 8px; height: 10px; margin-top: -2px;
    background: color-mix(in srgb, var(--acc) 55%, transparent); border-radius: 0 0 50% 50% / 0 0 70% 70%;
    transform-origin: 50% 0; animation: chatDrip 3.4s ease-in infinite; animation-delay: var(--dd, 0s); }
  #chat.no-panel .m.drippy::after { display: none; }
  @keyframes chatDrip { 0%, 30% { scale: 1 .4; translate: 0 0; opacity: 1; } 70% { scale: .9 1.4; translate: 0 0; opacity: 1; }
    85% { scale: .7 .7; translate: 0 14px; opacity: .8; } 100% { scale: .5 .5; translate: 0 24px; opacity: 0; } }

  .head { display: flex; align-items: center; gap: .35em; margin-bottom: .18em; }
  #chat.right .head { justify-content: flex-end; }
  .n { font-weight: 800; color: var(--acc); letter-spacing: .01em; }
  #chat.inline .head { display: inline-flex; margin: 0 .45em 0 0; vertical-align: baseline; }
  .b { width: 1.45em; height: 1.45em; margin: -.15em 0; flex: none; display: inline-block; }
  .b svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #chat.no-badges .b { display: none; }
  .t { color: var(--text); }
  #chat.inline .t { display: inline; }
  .m img { height: var(--emote, 1.5em); vertical-align: middle; margin: -.3em .05em; }
  .m mark { background: none; color: var(--hl); font-weight: 800; text-shadow: 0 0 10px color-mix(in srgb, var(--hl) 70%, transparent); }
  .m.hl { border-color: var(--hl); box-shadow: 0 4px 0 rgba(0, 0, 0, .25), 0 0 26px color-mix(in srgb, var(--hl) 45%, transparent); }

  /* Клуб дыма у края, из которого выпрыгивает пузырь */
  .m .puff { left: 1.2em; top: 60%; scale: .55; }
  #chat.right .m .puff { left: auto; right: 1.2em; }

  /* Появление: «Из дыма» — пузырь выпрыгивает с отскоком; «Снизу» — поднимается; «Без анимации» */
  #chat.a-pop .m.in { animation: popIn .6s cubic-bezier(.3, 1.5, .5, 1) both; }
  @keyframes popIn { 0% { opacity: 0; scale: .4; rotate: -8deg; } 60% { opacity: 1; } 100% { opacity: 1; scale: 1; rotate: var(--tilt, 0deg); } }
  #chat.a-pop.no-tilt .m.in { animation-name: popInFlat; }
  @keyframes popInFlat { 0% { opacity: 0; scale: .4; rotate: -8deg; } 60% { opacity: 1; } 100% { opacity: 1; scale: 1; rotate: 0deg; } }
  #chat.a-rise .m.in { animation: riseIn .5s var(--ease) both; }
  @keyframes riseIn { from { opacity: 0; translate: 0 24px; } to { opacity: 1; translate: 0 0; } }
  #chat.a-none .m .puff { display: none; }

  /* Уход: тает, как призрак */
  .m.out { animation: vanish .7s ease-in forwards !important; }
  @keyframes vanish { to { opacity: 0; translate: 0 -26px; scale: 1.06 .9; filter: blur(8px); } }
</style>
</head>
<body>
<div id="chat"></div>

<script src="../../runtime/overly.js"></script>
<script src="witch.js"></script>
<script>
const box = document.getElementById('chat');
// Значки Twitch → маленькие персонажи темы
const BADGES = { broadcaster: 'pumpkin', moderator: 'skull', vip: 'potion', subscriber: 'ghost' };
const PUFF = '<div class="puff"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
let S = null, count = 0;

Overly.onSettings(v => {
  S = v;
  const st = box.style;
  st.setProperty('--fs', v['chat.fontSize'] + 'px');
  st.setProperty('--acc', v['chat.accent']);
  st.setProperty('--gap', v['chat.gap'] + 'px');
  st.setProperty('--text', v['chat.textColor']);
  st.setProperty('--surf', Witch.rgba(v['chat.surface'], v['chat.surfaceOpacity']));
  st.setProperty('--emote', v['chat.emoteSize'] + 'em');
  st.setProperty('--hl', v['chat.highlightColor']);
  st.setProperty('--font', Overly.font(v['chat.font']));
  box.className = [
    v['chat.align'] === 'right' && 'right',
    v['chat.newest'] === 'top' && 'newest-top',
    !v['chat.panel'] && 'no-panel',
    !v['chat.badges'] && 'no-badges',
    !v['chat.tilt'] && 'no-tilt',
    v['chat.layout'] === 'inline' && 'inline',
    v['chat.stretch'] && 'stretch',
    'a-' + (v['chat.anim'] || 'pop'),
  ].filter(Boolean).join(' ');
  for (const m of box.children) m.style.setProperty('--acc', v['chat.userColors'] && m.dataset.color ? m.dataset.color : '');
  Overly.css(v['chat.css']);
  trim();
});

const list = (text) => String(text || '').toLowerCase().split(/[\s,;]+/).filter(Boolean);

function hidden(msg) {
  const text = (msg.fragments || []).map(f => f.text).join('').trim();
  if (S['chat.hideCommands'] && text.startsWith('!')) return true;
  return list(S['chat.hideBots']).includes(String(msg.login || '').toLowerCase());
}

function remove(m) {
  if (!m.isConnected || m.dataset.out) return;
  m.dataset.out = '1';
  if (S['chat.anim'] === 'none') { m.remove(); return; }
  m.classList.add('out');
  setTimeout(() => m.remove(), 720);
}

function trim() {
  const live = [...box.children].filter(m => !m.dataset.out);
  live.slice(0, Math.max(0, live.length - S['chat.max'])).forEach(m => m.remove());
}

// Текст с подсветкой слов из настройки «Подсвечивать слова»
function appendText(el, text, words) {
  if (!words.length) { el.append(document.createTextNode(text)); return false; }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  let found = false;
  for (const part of text.split(re)) {
    if (!part) continue;
    if (words.includes(part.toLowerCase())) { el.append(Object.assign(document.createElement('mark'), { textContent: part })); found = true; }
    else el.append(document.createTextNode(part));
  }
  return found;
}

const make = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text || '' });

Overly.onChat(msg => {
  if (!S || hidden(msg)) return;
  const m = make('div', 'm');
  m.dataset.id = msg.id || '';
  m.dataset.login = String(msg.login || '').toLowerCase();
  m.dataset.color = msg.color || '';
  if (S['chat.userColors'] && msg.color) m.style.setProperty('--acc', msg.color);
  // У каждого пузыря свой наклон; с каждого третьего стекает капля
  m.style.setProperty('--tilt', (Math.random() * 2.4 - 1.2).toFixed(2) + 'deg');
  if (++count % 3 === 0) {
    m.classList.add('drippy');
    m.style.setProperty('--dx', 15 + Math.random() * 60 + '%');
    m.style.setProperty('--dd', -Math.random() * 3 + 's');
  }

  const head = make('div', 'head');
  for (const b of msg.badges || []) if (BADGES[b]) { const i = make('span', 'b'); i.title = b; i.innerHTML = Witch.char(BADGES[b]); head.append(i); }
  head.append(make('span', 'n', msg.name));
  const t = make('div', 't');
  const words = list(S['chat.highlight']);
  let hl = false;
  for (const f of msg.fragments || []) {
    if (f.emote || f.url) {   // url — смайл BetterTTV / 7TV
      const img = new Image();
      img.alt = f.text;
      img.src = f.url || `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(f.emote)}/default/dark/3.0`;
      t.append(img);
    } else if (appendText(t, f.text, words)) {
      hl = true;
    }
  }
  if (hl) m.classList.add('hl');
  m.append(head, t);
  m.insertAdjacentHTML('beforeend', PUFF);
  box.append(m);
  trim();
  if (S['chat.anim'] !== 'none') {
    m.classList.add('in');
    if (S['chat.anim'] !== 'rise') requestAnimationFrame(() => m.querySelector('.puff').classList.add('go'));
  }
  if (S['chat.fadeSec'] > 0) setTimeout(() => remove(m), S['chat.fadeSec'] * 1000);
});

// Модерация: удалённое сообщение, бан/таймаут (все сообщения человека), очистка чата
Overly.onChatMod(a => {
  for (const m of [...box.children]) {
    if (a.kind === 'clear' || (a.kind === 'delete' && m.dataset.id === a.id) ||
        (a.kind === 'clear_user' && m.dataset.login === String(a.login || '').toLowerCase())) remove(m);
  }
});
</script>
</body>
</html>
