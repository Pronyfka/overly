<meta charset="utf-8">
<title>Ведьмин час — таймер марафона</title>
<!--
  ТЕМА «ВЕДЬМИН ЧАС» · ТАЙМЕР МАРАФОНА
  Кривая карточка с бурлящим котлом: название жутким шрифтом, крупное светящееся время.
  Продлили марафон — из котла вырывается клуб дыма, время подпрыгивает, рядом всплывает «+5:00» и ник.
  Пауза — котёл не светится, время бледнеет. Время вышло — над котлом взлетает призрак, вместо цифр надпись конца.
-->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link href="../../fonts/rubik-wet-paint.css" rel="stylesheet">
<link rel="stylesheet" href="witch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #timer { position: absolute; inset: 10px 8px 8px; box-sizing: border-box; padding: .7em 1.3em .8em 1em; display: flex; align-items: center; gap: .9em;
    font-family: var(--font); font-size: min(12.5vh, 2.6vw); color: var(--text); isolation: isolate;
    opacity: 0; translate: 0 -.6em; rotate: 1.5deg; }
  #timer.in { opacity: 1; translate: 0 0; rotate: 0deg; transition: opacity .3s, translate .7s var(--pop), rotate .7s var(--pop); }
  #timer > svg.box { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; }

  .pot { position: relative; width: 3.6em; height: 3.6em; flex: none; margin: -.3em 0; transition: filter .4s; }
  .pot svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #timer.paused .pot, #timer.idle .pot { filter: grayscale(.7) brightness(.7); }
  .pot .ghost { position: absolute; inset: 0; opacity: 0; }
  #timer.done .pot .ghost { animation: ghostOut 3.2s ease-in-out infinite; }
  @keyframes ghostOut { 0% { opacity: 0; translate: 0 .4em; scale: .5; } 20% { opacity: 1; } 60% { opacity: 1; translate: .3em -1.6em; scale: .8; rotate: 8deg; }
    100% { opacity: 0; translate: -.2em -2.6em; scale: .9; rotate: -6deg; } }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .15em; }
  .title { min-width: 0; font: 400 1.15em/1.1 var(--spook); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 2px 0 rgba(0, 0, 0, .45); }
  #timer.plain .title { font-family: var(--font); font-weight: 800; font-size: 1em; }
  .time { font: 400 2.5em/1 var(--spook); color: var(--acc); font-variant-numeric: tabular-nums; white-space: nowrap; transform-origin: 20% 80%;
    text-shadow: 0 0 .4em color-mix(in srgb, var(--acc) 60%, transparent), 0 3px 0 rgba(0, 0, 0, .4); transition: opacity .4s; }
  #timer.plain .time { font-family: var(--font); font-weight: 800; }
  #timer.paused .time { opacity: .5; }
  #timer.done .time { font-size: 1.5em; }
  .time.jump { animation: jump .55s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes jump { 40% { scale: 1.18; rotate: -4deg; } }

  .add { flex: none; display: flex; flex-direction: column; align-items: flex-end; opacity: 0; }
  .add b { font: 400 1.5em/1 var(--spook); color: var(--acc); text-shadow: 0 0 .4em color-mix(in srgb, var(--acc) 60%, transparent); }
  #timer.plain .add b { font-family: var(--font); font-weight: 800; }
  .add span { font-size: .75em; font-weight: 700; color: var(--muted); max-width: 8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .add.show { animation: rise 3.2s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; translate: 0 .6em; } 12%, 78% { opacity: 1; translate: 0 0; } 100% { opacity: 0; translate: 0 -.8em; } }
  .puff { left: 2.4em; top: 30%; scale: .6; }
</style>
</head>
<body>
<div id="timer">
  <svg class="box"></svg>
  <div class="pot"></div>
  <div class="main">
    <span class="title"></span>
    <span class="time"></span>
  </div>
  <div class="add"><b></b><span></span></div>
  <div class="puff"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>

<script src="../../runtime/overly.js?v=mwe36yl1"></script>
<script src="witch.js"></script>
<script src="../../runtime/timer.js?v=mwe36yl1"></script>
<script>
const box = document.getElementById('timer');
const $ = (s) => box.querySelector(s);
let S = null, opened = false;

$('.pot').innerHTML = Witch.char('cauldron') + `<span class="ghost">${Witch.char('ghost')}</span>`;

function colors() {
  return S['timer.preset'] === 'custom'
    ? { main: S['timer.frame'], dark: '#0C0A10', light: '#ffffff55', slime: S['timer.color'] }
    : Witch.FRAMES[S['timer.preset']] || Witch.FRAMES.purple;
}
function drawBox() {
  if (!S) return;
  const w = box.offsetWidth, h = box.offsetHeight;
  Witch.frame($('svg.box'), w, h, { t: Math.max(4, h * .06), colors: colors(), fill: Witch.rgba(S['timer.surface'], S['timer.surfaceOpacity']), seed: 9 });
}
addEventListener('resize', drawBox);

const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

function look() {
  const st = box.style;
  st.setProperty('--acc', S['timer.color']);
  st.setProperty('--text', S['timer.textColor']);
  st.setProperty('--font', Overly.font(S['timer.font']));
  box.classList.toggle('plain', !S['timer.spooky']);
  $('.title').textContent = S['timer.title'] || '';
  Overly.css(S['timer.css']);
  drawBox();
}

OverlyTimer.start({
  render(text, info) {
    for (const s of ['idle', 'running', 'paused', 'done']) box.classList.toggle(s, info.state === s);
    $('.time').textContent = info.state === 'done' ? (S?.['timer.endText'] || '0:00') : text;
  },
  added(a) {
    if (!S || !S['timer.showAdd'] || a.seconds < 0) return;
    $('.add b').textContent = a.text;
    $('.add span').textContent = a.name || '';
    replay($('.add'), 'show');
    replay($('.time'), 'jump');
    replay($('.puff'), 'go');
  },
});

Overly.onSettings(v => {
  S = v;
  look();
  if (!opened) { opened = true; document.fonts.ready.then(() => { drawBox(); box.classList.add('in'); }); }
});
</script>
</body>
</html>
