<meta charset="utf-8">
<title>Жвачка — цель</title>
<!-- Тема «Жвачка»: логика как у остальных тем, вид — gum.css и skin.css. -->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link rel="stylesheet" href="gum.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #goal { position: absolute; left: 44px; top: 10px; bottom: 10px; width: calc((100vw - 54px) * var(--w, 1)); font-family: var(--font); font-size: var(--fs, 24px); }
  .card { position: absolute; inset: 0; opacity: 0; }
  /* Два одинаковых слоя: снизу — карточка, сверху — заливка цветом, обрезанная по проценту */
  .layer { position: absolute; inset: 0; display: flex; align-items: center; gap: 1em; padding: 0 1.1em; box-sizing: border-box; }
  .layer.base { background: var(--card); color: var(--cardInk); }
  .layer.top { background: var(--acc); color: var(--ink); clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0);
    transition: clip-path 1s var(--io); }
  #goal.line .layer.top { display: none; }
  .t { flex: 1; min-width: 0; }
  .small { display: block; font-size: .58em; opacity: .65; white-space: nowrap; }
  .title { display: block; margin-top: .1em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .count:empty { display: none; }
  /* Полоска снизу */
  .line-bar { position: absolute; left: 0; right: 0; bottom: 0; height: .32em; background: color-mix(in srgb, var(--muted) 30%, transparent); display: none; }
  .line-bar i { position: absolute; inset: 0; background: var(--acc); transform-origin: left; transform: scaleX(var(--k, 0)); transition: transform 1s var(--io); }
  #goal.line .line-bar { display: block; }
  /* Выполнено */
  .done { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: .5em; background: var(--acc); color: var(--ink);
    font-weight: 600; opacity: 0; }
  .done .sq { width: .55em; height: .55em; background: currentColor; }
  .mark { position: absolute; left: -34px; top: 50%; width: 22px; height: 22px; margin-top: -11px; background: var(--acc); scale: 0; }
</style>
<link rel="stylesheet" href="skin.css">
</head>
<body>
<div id="goal">
  <i class="mark"></i>
  <div class="card">
    <div class="layer base"><div class="t"><span class="small"></span><span class="title"></span></div><span class="count"></span></div>
    <div class="layer top"><div class="t"><span class="small"></span><span class="title"></span></div><span class="count"></span></div>
    <div class="line-bar"><i></i></div>
    <div class="done"><i class="sq"></i><span class="dtext"></span></div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="gum.js"></script>
<script>
const goal = document.getElementById('goal');
const $ = (s) => goal.querySelector(s);
const $$ = (s) => goal.querySelectorAll(s);
let S = null, stats = {}, ready = false, wasDone = null, pct = 0;

function size() { goal.style.setProperty('--fs', Math.max(12, Math.min(innerHeight * .22, innerWidth * .036)) + 'px'); }
addEventListener('resize', size);
size();

function setFill(p) {
  goal.style.setProperty('--p', p + '%');
  goal.style.setProperty('--k', p / 100);
}

function render() {
  if (!S) return;
  goal.style.setProperty('--acc', S['goal.color']);
  goal.style.setProperty('--ink', B.ink(S['goal.color']));
  goal.style.setProperty('--font', Overly.font(S['goal.font']));
  goal.style.setProperty('--w', (S['goal.width'] || 100) / 100);
  B.mode(goal, S['goal.mode']);
  goal.classList.toggle('line', S['goal.fillStyle'] === 'line');
  Overly.css(S['goal.css']);

  const target = Math.max(1, Number(S['goal.target']) || 1);
  const value = stats[S['goal.type']];
  const known = typeof value === 'number';
  const done = known && value >= target;
  pct = known ? Math.min(100, Math.floor(100 * value / target)) : 0;
  const fmt = (n) => n.toLocaleString('ru-RU');
  const mode = S['goal.countMode'] || 'both';
  const count = !known ? 'подключите Twitch'
    : mode === 'none' ? ''
    : mode === 'percent' ? pct + '%'
    : mode === 'count' ? fmt(value)
    : mode === 'left' ? `осталось ${done ? 0 : fmt(target - value)}`
    : `${fmt(value)} / ${fmt(target)}`;
  // Текст меняем, только если он другой, — иначе оборвётся проявление по буквам
  const put = (sel, t) => $$(sel).forEach(e => { if (e.textContent !== t) e.textContent = t; });
  put('.small', S['goal.small'] || '');
  put('.title', S['goal.title'] || '');
  put('.count', count);
  if (ready) setFill(pct);

  // Цель выполнена: карточка становится цветной, «■ Цель выполнена!», разлетаются точки
  if (ready && done !== wasDone) {
    const d = $('.done');
    if (done && S['goal.burst']) {
      d.classList.remove('wipe-out');
      B.replay(d, 'wipe-in');
      B.letters($('.dtext'), S['goal.done'] || '', 350);
      const r = goal.getBoundingClientRect();
      setTimeout(() => { B.burst(goal, r.width * .3, r.height / 2, S['goal.color'], 10, r.height * .3); B.burst(goal, r.width * .72, r.height / 2, S['goal.color'], 10, r.height * .3); }, 500);
    } else if (wasDone) {
      B.replay(d, 'wipe-out');
    }
  }
  if (ready) wasDone = done;
}

// Появление: квадрат кувырком → карточка шторкой → текст по буквам → заливка дорастает
function intro() {
  B.tumble(goal, -23, goal.offsetHeight / 2, S['goal.color'], { size: 34, time: .6 });
  setTimeout(() => { B.replay($('.mark'), 'pop-in'); B.replay($('.card'), 'wipe-in'); }, 480);
  setTimeout(() => {
    $$('.title').forEach(e => B.letters(e, S['goal.title'] || '', 0));
    $$('.small').forEach(e => B.replay(e, 'pop-in'));
  }, 800);
  setTimeout(() => { ready = true; wasDone = false; setFill(pct); render(); }, 1150);
}

let started = false;
Overly.onSettings(v => {
  S = v;
  render();
  if (!started) { started = true; document.fonts.ready.then(intro); }
});
Overly.onStats(s => { stats = s; render(); });
</script>
</body>
</html>
