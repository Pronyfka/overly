<meta charset="utf-8">
<title>Жвачка — алерты</title>
<!-- Появление: цветная капсула с пузырьками влетает под углом → выравнивается → растягивается на всю длину,
     справа проступает надпись → белая карточка заливает её слева скошенным фронтом, цвет остаётся ярлыком справа.
     Уход — в обратном порядке. Всё это время блок покачивается в объёме. -->
<link href="../../fonts/rubik.css" rel="stylesheet">
<link rel="stylesheet" href="gum.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #alert { position: absolute; left: 50%; top: 50%; width: 760px; height: 300px; translate: -50% -50%; scale: var(--scale, 1); display: none;
    flex-direction: column; align-items: center; justify-content: center; font-family: var(--font); }
  #alert.shown { display: flex; }
  #alert[data-valign="top"] { top: 8px; translate: -50% 0; transform-origin: 50% 0; justify-content: flex-start; }
  #alert[data-valign="bottom"] { top: auto; bottom: 8px; translate: -50% 0; transform-origin: 50% 100%; justify-content: flex-end; }
  .stage { display: flex; flex-direction: column; align-items: center; }
  .media { max-width: 200px; max-height: 130px; object-fit: contain; border-radius: 22px; margin-bottom: 12px; opacity: 0; }
  .media[hidden] { display: none; }

  @property --x { syntax: '<length>'; inherits: true; initial-value: 0px; }
  .pillbox { position: relative; width: 680px; height: 96px; --x: 0px; }
  .cap { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; border-radius: 48px; overflow: hidden; background: var(--acc); color: var(--ink); opacity: 0;
    transform-origin: 48px 50%; box-shadow: 0 8px 0 color-mix(in srgb, var(--acc) 60%, #000); }
  .cap.in { animation: capIn .42s cubic-bezier(.2, .8, .3, 1) forwards; }
  @keyframes capIn { 0% { opacity: 0; rotate: -12deg; translate: -24px 30px; filter: blur(5px); } 30% { opacity: 1; filter: blur(2px); } 72% { rotate: 4deg; translate: 0 -3px; filter: none; } 100% { opacity: 1; rotate: 0deg; translate: 0 0; } }
  .cap.long { opacity: 1; transition: width .36s cubic-bezier(.55, 0, .2, 1); width: 100%; }
  .cap.short { opacity: 1; transition: width .28s cubic-bezier(.6, 0, .3, 1); width: 34%; }
  .cap.out { animation: capOut .24s cubic-bezier(.6, 0, .9, .4) forwards; }
  @keyframes capOut { from { opacity: 1; } to { opacity: 0; rotate: -12deg; translate: -24px 30px; filter: blur(4px); } }
  /* Пузырьки внутри капсулы */
  .fizz { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0; }
  .cap.in .fizz, .cap.long .fizz { animation: fizz .85s ease-in-out both; }
  .fizz:nth-child(1) { left: 30px; top: 22px; --dx: 56px; --dy: 20px; }
  .fizz:nth-child(2) { left: 104px; top: 52px; --dx: 34px; --dy: -26px; width: 8px; height: 8px; animation-delay: .06s !important; }
  .fizz:nth-child(3) { left: 66px; top: 62px; --dx: 92px; --dy: -8px; width: 6px; height: 6px; animation-delay: .12s !important; }
  @keyframes fizz { 0% { opacity: 0; scale: .4; } 20% { opacity: 1; scale: 1; } 70% { opacity: .9; } 100% { opacity: 0; scale: .3; translate: var(--dx) var(--dy); } }
  .tag { position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 32px 0 18px; font-size: 25px; font-weight: 700; white-space: nowrap; opacity: 0; transition: opacity .16s; }
  .cap.long .tag { opacity: 1; }

  /* Белая карточка заливает капсулу слева. Перед ней бежит тёмная полоса */
  .shade, .white { position: absolute; inset: 0; border-radius: 48px; pointer-events: none; }
  .shade { background: rgba(0, 0, 0, .2); clip-path: polygon(0 0, calc(var(--x) + 26px) 0, calc(var(--x) + 4px) 100%, 0 100%); }
  .white { background: var(--card); color: var(--cardInk); clip-path: polygon(0 0, var(--x) 0, calc(var(--x) - 22px) 100%, 0 100%); display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 38px; }
  .pillbox.sweep { animation: sweep .36s cubic-bezier(.5, 0, .25, 1) forwards; }
  @keyframes sweep { from { --x: 0px; } to { --x: var(--stop); } }
  .pillbox.unsweep { --x: var(--stop); animation: unsweep .28s cubic-bezier(.6, 0, .3, 1) forwards; }
  @keyframes unsweep { from { --x: var(--stop); } to { --x: 0px; } }
  .pillbox.done { --x: var(--stop); }
  .pillbox.idle .shade, .pillbox.idle .white { visibility: hidden; }
  .kind { font-size: 19px; font-weight: 600; color: var(--acc); line-height: 1.15; white-space: nowrap; }
  .kind:empty { display: none; }
  .name { font-size: 40px; font-weight: 700; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: var(--nameW, 420px); }

  .msg { max-width: 600px; margin-top: 22px; padding: 12px 24px; background: var(--card); color: var(--cardInk); border-radius: 26px; font-size: 22px; line-height: 1.3; opacity: 0;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--acc) 55%, transparent); }
  .msg:empty { display: none; }
</style>
</head>
<body>
<div id="alert">
  <div class="stage wob">
    <img class="media" alt="" hidden><video class="media" muted playsinline loop hidden></video>
    <div class="pillbox idle">
      <div class="cap"><i class="fizz"></i><i class="fizz"></i><i class="fizz"></i><span class="tag"></span></div>
      <div class="shade"></div>
      <div class="white"><span class="kind"></span><span class="name"></span></div>
    </div>
    <div class="msg"></div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe3ddcw"></script>
<script src="gum.js"></script>
<script>
const root = document.getElementById('alert');
const $ = (s) => root.querySelector(s);
let S = null;
let timers = [];
const at = (ms, fn) => timers.push(setTimeout(fn, ms));

function fit() {
  if (!S) return;
  root.style.setProperty('--scale', Math.min(innerWidth / 760, innerHeight / 300) * S.size / 100);
  root.dataset.valign = S.valign;
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  root.style.setProperty('--font', Overly.font(v.font));
  B.mode(root, v.mode);
  Overly.css(v.css);
  fit();
});

const durationOf = (a) => (S[a.type + '.dur'] > 0 ? S[a.type + '.dur'] : S.showSec) * 1000;

function setMedia(url) {
  const img = $('img.media'), vid = $('video.media');
  const isVideo = /\.(webm|mp4)$/i.test(url || '');
  img.hidden = !url || isVideo;
  vid.hidden = !url || !isVideo;
  if (url && !isVideo) img.src = url;
  if (url && isVideo) { if (vid.getAttribute('src') !== url) vid.src = url; vid.currentTime = 0; vid.play().catch(() => {}); }
  if (!url || !isVideo) vid.pause();
}

function reset() {
  $('.pillbox').className = 'pillbox idle';
  $('.cap').className = 'cap';
  $('.cap').style.width = '';
  for (const s of ['.msg', 'img.media', 'video.media']) $(s).classList.remove('pop-in', 'pop-out', 'wipe-in', 'wipe-out');
}

function showAlert(a) {
  const k = a.type;
  const n = B.NUM[k](a);
  const showMs = durationOf(a);
  timers.forEach(clearTimeout); timers = [];
  reset();

  const color = S[k + '.color'] || '#FF4D8D';
  root.style.setProperty('--acc', color);
  root.style.setProperty('--ink', B.ink(color));
  // На ярлыке — сумма или число, если они заданы, иначе название события
  const chip = B.fill(S[k + '.chip'], n);
  const label = S[k + '.label'] || '';
  $('.tag').textContent = chip || label;
  $('.kind').textContent = chip ? label : '';
  $('.name').textContent = a.name;
  $('.msg').textContent = S.showMessage && a.message ? a.message : '';
  setMedia(S[k + '.media']);
  if (S.sound) {
    const vol = (S[k + '.volume'] ?? 100) / 100 * S.volume / 100;
    if (S[k + '.sound']) Overly.play(S[k + '.sound'], vol);
    else if (S.themeSound) B.sound(k, vol);
  }
  root.classList.add('shown');
  // Длинное сообщение или картинка: уменьшаем весь блок, чтобы он влез целиком
  const stage = $('.stage');
  stage.style.scale = '';
  const roomy = (root.offsetHeight - 24) / (stage.offsetHeight + 12);
  if (roomy < 1) stage.style.scale = roomy;

  // Ярлык занимает столько, сколько нужно надписи; белое заливает остальное
  const stop = 680 - Math.min(300, $('.tag').offsetWidth) + 6;
  $('.pillbox').style.setProperty('--stop', stop + 'px');
  $('.name').style.setProperty('--nameW', stop - 80 + 'px');

  // ---- Появление ----
  const cap = $('.cap'), box = $('.pillbox');
  cap.classList.add('in');
  root.querySelectorAll('.media').forEach(m => B.replay(m, 'pop-in'));
  at(430, () => { cap.classList.remove('in'); cap.classList.add('long'); });
  at(800, () => { box.classList.remove('idle'); box.classList.add('sweep'); });
  at(1180, () => { box.classList.remove('sweep'); box.classList.add('done'); if ($('.msg').textContent) B.replay($('.msg'), 'wipe-in'); });

  // ---- Уход ----
  at(showMs - 1000, () => {
    if ($('.msg').textContent) { $('.msg').classList.remove('wipe-in'); B.replay($('.msg'), 'wipe-out'); }
    box.classList.remove('done'); box.classList.add('unsweep');
    root.querySelectorAll('.media').forEach(m => { m.classList.remove('pop-in'); B.replay(m, 'pop-out'); });
  });
  at(showMs - 680, () => { box.classList.add('idle'); cap.classList.remove('long'); cap.classList.add('short'); });
  at(showMs - 350, () => { cap.classList.remove('short'); cap.style.width = '34%'; cap.classList.add('out'); });
  at(showMs - 90, () => { root.classList.remove('shown'); reset(); $('video.media').pause(); });
}

const queue = [];
let busy = false;
function next() {
  const a = queue.shift();
  if (!a) { busy = false; return; }
  busy = true;
  showAlert(a);
  setTimeout(next, durationOf(a) + S.gapSec * 1000);
}
Overly.onEvent(a => {
  if (!S || !B.NUM[a?.type] || !S[a.type + '.on'] || !a.name) return;
  if ((S[a.type + '.min'] || 0) > (Number(a.amount) || 0)) return;
  queue.push(a);
  if (!busy) document.fonts.ready.then(() => { if (!busy) next(); });
});
</script>
<link rel="stylesheet" href="skin.css">
</body>
</html>
