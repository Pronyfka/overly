<meta charset="utf-8">
<title>Glitch HUD — чат</title>
<!--
  ТЕМА GLITCH HUD · ЧАТ
  Без плашек: значки-квадраты, ник цветом из Twitch, двоеточие и текст. Жирный техно-шрифт.
  Новое сообщение: по строке пролетает полоса цвета ника, текст влетает со срезом-сбоем.
  Значки: стример, модератор, VIP, подписчик — цветные квадраты с символом. Смайлы Twitch — картинками.
  Удалённые модераторами сообщения и баны уходят со сбоем.
-->
<link href="../../fonts/exo-2.css" rel="stylesheet">
<link rel="stylesheet" href="glitch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #chat { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: var(--gap, 12px);
    padding: 14px; box-sizing: border-box; font: 700 var(--fs, 22px)/1.3 var(--chat, 'Exo 2'), sans-serif; --acc: #C6FF2E; }
  #chat.newest-top { flex-direction: column-reverse; }
  #chat.right .m { text-align: right; }

  .m { position: relative; isolation: isolate; color: var(--textColor, #fff); overflow-wrap: anywhere; }
  #chat.shadow .m { text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  #chat.panel .m { padding: .3em .55em; }
  #chat.panel .m::after { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--bg, rgba(10,10,11,.7));
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%); }
  .n { color: var(--c, var(--acc)); font-weight: 800; }
  .n::after { content: ' :'; color: var(--textColor, #fff); font-weight: 700; }
  #chat.stacked .n { display: block; }
  #chat.stacked .n::after { content: ''; }
  .b { display: inline-grid; place-items: center; width: 1.12em; height: 1.12em; margin-right: .3em; vertical-align: -.16em;
    font: 900 .62em/1 sans-serif; color: #fff; background: var(--bc); text-shadow: none; }
  #chat.no-badges .b { display: none; }
  .b.broadcaster { --bc: #ff2d55; } .b.moderator { --bc: #2bbf6a; } .b.vip { --bc: #e05bd0; } .b.subscriber { --bc: #8b5cf6; }
  .m img { height: var(--emote, 1.5em); vertical-align: middle; margin: -.3em .05em; }
  .m mark { background: var(--hl, #C6FF2E); color: #0a0a0b; padding: 0 .15em; text-shadow: none; }

  #chat.a-glitch .m.new { animation: gIn .42s steps(1) both; }
  #chat.a-slide .m.new { animation: slide .3s cubic-bezier(.2,.9,.3,1) both; }
  #chat.right.a-slide .m.new { animation-name: slideR; }
  #chat.a-fade .m.new { animation: popIn .4s ease both; }
  @keyframes slide { from { opacity: 0; translate: -40px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes slideR { from { opacity: 0; translate: 40px 0; } to { opacity: 1; translate: 0 0; } }
  /* gIn красит текст в белый на время вспышки — ник и так белеет, это часть эффекта */
</style>
</head>
<body>
<div id="chat"></div>

<script src="../../runtime/overly.js"></script>
<script src="glitch.js"></script>
<script>
const box = document.getElementById('chat');
const BADGES = { broadcaster: '▶', moderator: '⚔', vip: '◆', subscriber: '★' };
let S = null;

Overly.onSettings(v => {
  S = v;
  const st = box.style;
  st.setProperty('--fs', v['chat.fontSize'] + 'px');
  st.setProperty('--acc', v['chat.accent']);
  st.setProperty('--gap', v['chat.gap'] + 'px');
  st.setProperty('--textColor', v['chat.textColor']);
  st.setProperty('--bg', G.rgba(v['chat.bgColor'], v['chat.bgOpacity']));
  st.setProperty('--emote', v['chat.emoteSize'] + 'em');
  st.setProperty('--hl', v['chat.highlightColor']);
  st.setProperty('--chat', Overly.font(v['chat.font']));
  box.className = [
    v['chat.align'] === 'right' && 'right',
    v['chat.newest'] === 'top' && 'newest-top',
    v['chat.panel'] && 'panel',
    !v['chat.badges'] && 'no-badges',
    v['chat.layout'] === 'stacked' && 'stacked',
    v['chat.shadow'] && 'shadow',
    'a-' + (v['chat.anim'] || 'glitch'),
  ].filter(Boolean).join(' ');
  for (const m of box.children) m.style.setProperty('--c', v['chat.userColors'] && m.dataset.color ? m.dataset.color : '');
  Overly.css(v['chat.css']);
  trim();
});

const list = (text) => String(text || '').toLowerCase().split(/[\s,;]+/).filter(Boolean);

function hidden(msg) {
  const text = (msg.fragments || []).map(f => f.text).join('').trim();
  if (S['chat.hideCommands'] && text.startsWith('!')) return true;
  return list(S['chat.hideBots']).includes(String(msg.login || '').toLowerCase());
}

function remove(m) {
  if (!m.isConnected || m.dataset.out) return;
  m.dataset.out = '1';
  m.classList.remove('new');
  G.replay(m, 'g-out');
  setTimeout(() => m.remove(), 380);
}

function trim() {
  const live = [...box.children].filter(m => !m.dataset.out);
  live.slice(0, Math.max(0, live.length - S['chat.max'])).forEach(m => m.remove());
}

// Текст с подсветкой слов из настройки «Подсвечивать слова»
function appendText(m, text, words) {
  if (!words.length) { m.append(document.createTextNode(text)); return; }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  for (const part of text.split(re)) {
    if (!part) continue;
    if (words.includes(part.toLowerCase())) m.append(Object.assign(document.createElement('mark'), { textContent: part }));
    else m.append(document.createTextNode(part));
  }
}

Overly.onChat(msg => {
  if (!S || hidden(msg)) return;
  const m = document.createElement('div');
  m.className = 'm new';
  m.dataset.id = msg.id || '';
  m.dataset.login = String(msg.login || '').toLowerCase();
  m.dataset.color = msg.color || '';
  if (S['chat.userColors'] && msg.color) m.style.setProperty('--c', msg.color);

  for (const b of msg.badges || []) {
    if (BADGES[b]) m.append(Object.assign(document.createElement('span'), { className: 'b ' + b, textContent: BADGES[b] }));
  }
  m.append(Object.assign(document.createElement('span'), { className: 'n', textContent: msg.name }));
  m.append(' ');
  const words = list(S['chat.highlight']);
  for (const f of msg.fragments || []) {
    if (f.emote || f.url) {   // url — смайл BetterTTV / 7TV
      const img = new Image();
      img.alt = f.text;
      img.src = f.url || `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(f.emote)}/default/dark/3.0`;
      m.append(img);
    } else appendText(m, f.text, words);
  }
  // После появления снимаем класс — иначе при смене настроек анимация проигралась бы у всех заново
  m.addEventListener('animationend', () => m.classList.remove('new'), { once: true });
  box.append(m);
  trim();
  if ((S['chat.anim'] || 'glitch') === 'glitch') G.streak(m, '38%', '24%', m.style.getPropertyValue('--c') || S['chat.accent']);
  if (S['chat.fadeSec'] > 0) setTimeout(() => remove(m), S['chat.fadeSec'] * 1000);
});

// Модерация: удалённое сообщение, бан/таймаут (все сообщения человека), очистка чата
Overly.onChatMod(a => {
  for (const m of [...box.children]) {
    if (a.kind === 'clear' || (a.kind === 'delete' && m.dataset.id === a.id) ||
        (a.kind === 'clear_user' && m.dataset.login === String(a.login || '').toLowerCase())) remove(m);
  }
});
</script>
</body>
</html>
