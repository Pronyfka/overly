<meta charset="utf-8">
<title>Glitch HUD — лента событий</title>
<!--
  ТЕМА GLITCH HUD · ЛЕНТА СОБЫТИЙ
  Последние события столбиком: подпись цвета события («САБ», «500 ₽», «РЕЙД (42)»), ник, треугольник и линия снизу.
  Новое событие влетает сверху крупнее остальных: полоса цвета события, ник собирается из шума,
  рядом со стрелкой мелькает штрихованная сетка. Старые события тускнеют.
  Лента помнится после перезапуска источника (настройка «Помнить после перезапуска»).
-->
<link href="../../fonts/russo-one.css" rel="stylesheet">
<link href="../../fonts/pixelify-sans.css" rel="stylesheet">
<link rel="stylesheet" href="glitch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #feed { position: absolute; inset: 0; padding: 14px 18px; box-sizing: border-box; display: flex; flex-direction: column;
    gap: .55em; font-size: var(--fs, 22px); color: #fff; }
  #feed.newest-bottom { flex-direction: column-reverse; justify-content: flex-start; }
  #feed.right .e { margin-left: auto; text-align: right; }

  .e { position: relative; width: 62%; max-width: 100%; padding-bottom: .32em; flex: none; --c: var(--acc); }
  .e::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--c); }
  .e .lbl { display: block; font: 500 .62em/1 var(--pixel); letter-spacing: .14em; text-transform: uppercase; color: var(--c); }
  .e .who { display: block; margin-top: .18em; padding-right: 1.6em; font: 400 1em/1.05 var(--head); text-transform: uppercase;
    color: var(--nameColor, #fff); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .e .arr { position: absolute; right: .1em; bottom: .55em; width: 0; height: 0; border-top: .32em solid transparent;
    border-bottom: .32em solid transparent; border-left: .5em solid var(--c); }
  #feed.right .e .who { padding-right: 0; padding-left: 1.6em; }
  #feed.right .e .arr { right: auto; left: .1em; rotate: 180deg; }

  /* Новое — крупнее и шире, с сеткой у стрелки */
  #feed.big .e:first-child { width: 100%; font-size: 1.35em; }
  #feed.big.newest-bottom .e:first-child { width: 62%; font-size: 1em; }
  #feed.big.newest-bottom .e:last-child { width: 100%; font-size: 1.35em; }
  .e .grid { position: absolute; right: 0; bottom: .3em; width: 5em; height: 1.4em; opacity: 0; color: var(--c);
    background: linear-gradient(currentColor 1px, transparent 1px) 0 0 / .5em .5em, linear-gradient(90deg, currentColor 1px, transparent 1px) 0 0 / .5em .5em; }
  .e .grid.on { animation: gridFlash 1.1s steps(6) forwards; }
  @keyframes gridFlash { 0% { opacity: .5; } 60% { opacity: .35; } 100% { opacity: 0; } }
  #feed.right .e .grid { right: auto; left: 0; }

  /* Старые — тусклее */
  #feed.fade-old .e:nth-child(n+2) { opacity: .78; }
  #feed.fade-old .e:nth-child(n+3) { opacity: .6; }
  #feed.fade-old .e:nth-child(n+4) { opacity: .45; }
  #feed.fade-old .e:nth-child(n+5) { opacity: .32; }
  #feed.fade-old.newest-bottom .e { opacity: 1; }
  .e.g-out { position: absolute; }   /* уходящее не сдвигает остальные */
</style>
</head>
<body>
<div id="feed"></div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="glitch.js"></script>
<script>
const feed = document.getElementById('feed');
const STORE = 'overly.glitch.feed';
let S = null;
let items = [];     // { type, name, amount } — новые первыми
let restored = false;

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(STORE, S?.['ev.keep'] ? JSON.stringify(items) : '[]'); } catch {}
}

const label = (a) => G.fill(S[`ev.${a.type}.label`] || a.type, G.NUM[a.type](a));

function make(a) {
  const e = document.createElement('div');
  e.className = 'e';
  e.style.setProperty('--c', S[a.type + '.color'] || 'var(--acc)');
  e.innerHTML = '<span class="lbl"></span><span class="who"></span><i class="arr"></i><i class="grid"></i>';
  e.querySelector('.lbl').textContent = label(a);
  e.querySelector('.who').textContent = a.name;
  return e;
}

// Перерисовать без анимации (после настроек или восстановления)
function render() {
  feed.replaceChildren(...items.slice(0, S['ev.max']).map(make));
}

Overly.onSettings(v => {
  S = v;
  const st = feed.style;
  st.setProperty('--fs', v['ev.fontSize'] + 'px');
  st.setProperty('--head', Overly.font(v['ev.headFont']));
  st.setProperty('--pixel', Overly.font(v['ev.pixelFont']));
  st.setProperty('--nameColor', v['ev.nameColor']);
  st.setProperty('--g', G.GLITCH[v['ev.glitch']] ?? 1);
  feed.className = [
    v['ev.align'] === 'right' && 'right', v['ev.newest'] === 'bottom' && 'newest-bottom',
    v['ev.big'] && 'big', v['ev.fadeOld'] && 'fade-old', v['ev.glitch'] === 'off' && 'no-glitch',
  ].filter(Boolean).join(' ');
  if (!restored) { restored = true; items = v['ev.keep'] ? load() : []; }
  Overly.css(v['ev.css']);
  render();
});

Overly.onEvent(a => {
  if (!S) return;
  if (a?.type === 'feed_clear') {   // кнопка «Очистить ленту» в редакторе
    items = []; save();
    [...feed.children].forEach((e, i) => setTimeout(() => G.replay(e, 'g-out'), i * 50));
    setTimeout(render, 450);
    return;
  }
  if (!G.NUM[a?.type] || !S['ev.' + a.type] || !a.name) return;
  items.unshift({ type: a.type, name: a.name, amount: a.amount });
  items = items.slice(0, 30);
  save();

  // Лишнее снизу уходит со сбоем, новое влетает сверху
  const extra = [...feed.children].slice(S['ev.max'] - 1);
  extra.forEach(e => { G.replay(e, 'g-out'); setTimeout(() => e.remove(), 380); });
  const e = make(a);
  const who = e.querySelector('.who'), lbl = e.querySelector('.lbl');
  who.style.opacity = lbl.style.opacity = 0;
  feed.prepend(e);
  G.replay(e, 'g-in');
  // После влёта снимаем анимацию: её конечная непрозрачность перебивала бы «старые — тусклее»
  e.addEventListener('animationend', (ev) => { if (ev.target === e) e.classList.remove('g-in'); });
  if (S['ev.glitch'] !== 'off') G.streak(e, 'calc(100% - 3px)', '4px',e.style.getPropertyValue('--c'));
  e.querySelector('.grid').classList.add('on');
  setTimeout(() => { lbl.style.opacity = ''; G.replay(lbl, 'type-in'); }, 120);
  setTimeout(() => { who.style.opacity = ''; G.replay(who, 'g-in'); G.scramble(who, a.name, 420); }, 200);
});

// Лента не вылезает за источник: в маленьком источнике шрифт становится меньше
function fitFeed() {
  if (!S || !feed.children.length) return;
  feed.style.setProperty('--fs', S['ev.fontSize'] + 'px');
  const r = [...feed.children].map(c => c.getBoundingClientRect());
  const need = Math.max(...r.map(x => x.bottom)) - Math.min(...r.map(x => x.top)) + 32;
  if (need > innerHeight) feed.style.setProperty('--fs', S['ev.fontSize'] * innerHeight / need + 'px');
}
new MutationObserver(fitFeed).observe(feed, { childList: true });
addEventListener('resize', fitFeed);
Overly.onSettings(() => requestAnimationFrame(fitFeed));
</script>
</body>
</html>
