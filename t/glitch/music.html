<meta charset="utf-8">
<title>Glitch HUD — музыка</title>
<!--
  ТЕМА GLITCH HUD · МУЗЫКА
  Что играет в Яндекс Музыке: обложка в HUD-уголке, пиксельное «СЕЙЧАС ИГРАЕТ», название и исполнитель
  влетают со сбоем, ниже — полоса прогресса со штриховкой и время. Новый трек — строки уходят и влетают заново.
  Пауза или музыка выключена — виджет уходит со сбоем.
  Высота источника задаёт размер текста, ширина — длину полосы.
-->
<link href="../../fonts/russo-one.css" rel="stylesheet">
<link href="../../fonts/pixelify-sans.css" rel="stylesheet">
<link rel="stylesheet" href="glitch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  /* Рисуем в высоту 160, ширина — во весь источник (zoom считает скрипт) */
  #music { position: absolute; left: 0; top: 0; height: 160px; display: flex; align-items: center; gap: 22px; padding: 0 14px;
    box-sizing: border-box; color: #fff; visibility: hidden; }
  #music.shown { visibility: visible; }
  #music.right { flex-direction: row-reverse; text-align: right; }
  .cover { position: relative; width: 120px; height: 120px; flex: none; }
  .cover img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); object-fit: cover; background: #15151a; }
  .cover::before, .cover::after { content: ''; position: absolute; width: 34px; height: 34px; border: 3px solid var(--acc); }
  .cover::before { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  .cover::after { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  .cover .hatch { position: absolute; right: 0; top: 0; width: 26px; height: 8px; color: #fff; }
  .cover .ph { position: absolute; inset: 8px; display: grid; place-items: center; background: #15151a; color: var(--acc); font: 400 40px/1 var(--head); }
  .cover [hidden] { display: none; }
  #music.no-cover .cover { display: none; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #music.right .info { align-items: flex-end; }
  .label { display: flex; align-items: center; gap: 8px; color: var(--acc); font-size: 15px; }
  #music.right .label { flex-direction: row-reverse; }
  #music.no-label .label { display: none; }
  .title { position: relative; font: 400 36px/1.05 var(--head); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .artist { position: relative; font: 400 22px/1.1 var(--head); color: var(--acc); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 4px; width: 100%; }
  #music.right .prog { flex-direction: row-reverse; }
  #music.no-progress .prog { display: none; }
  .bar { position: relative; flex: 1; height: 6px; color: rgba(255,255,255,.28); }
  .bar i { position: absolute; inset: 0; background: var(--acc); transform-origin: left; transform: scaleX(0); }
  #music.right .bar i { transform-origin: right; }
  #music { background: var(--bg, transparent); border-radius: var(--r, 0); transition: height .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1); }
  /* Мини-версия: обложка и подпись уходят, остаются название, исполнитель и таймлайн — полоска ниже */
  #music > .cover, #music > .info { transition: opacity .2s; }
  #music.swap > .cover, #music.swap > .info { opacity: 0; }
  #music.mini { height: 100px; padding: 0 20px; }
  #music.mini .cover, #music.mini .label { display: none; }
  #music.mini .info { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0 14px; }
  #music.right.mini .info { flex-direction: row-reverse; }
  #music.mini .title { font-size: 28px; flex: 0 1 auto; max-width: 65%; }
  #music.mini .artist { font-size: 18px; flex: 1 1 0; }
  #music.mini .prog { flex-basis: 100%; margin-top: 6px; }
  #music.still, #music.still * { transition: none !important; }
  .t { font-size: 15px; white-space: nowrap; opacity: .85; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="music">
  <div class="cover"><img alt=""><span class="ph">♪</span><i class="hatch"></i></div>
  <div class="info">
    <div class="px label"><i class="ring"></i><span></span></div>
    <div class="title"></div>
    <div class="artist"></div>
    <div class="prog"><div class="bar hatch"><i></i></div><span class="px t"></span></div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe36yl1"></script>
<script src="../../runtime/music.js?v=mwe36yl1"></script>
<script src="glitch.js"></script>
<script>
const box = document.getElementById('music');
const $ = (s) => box.querySelector(s);
let swapT = 0, gen = 0;   // gen — чтобы поздний таймер скрытия не спрятал виджет, показанный снова
let S = null;

function fit() {
  const k = Math.min(innerHeight / 170, innerWidth / 420);
  box.style.zoom = k;
  box.style.width = innerWidth / k + 'px';
  box.style.top = (innerHeight / k - 160) / 2 + (box.classList.contains('mini') ? OverlyMusic.miniShift(60) : 0) + 'px';
}
addEventListener('resize', fit);
fit();

Overly.onSettings(v => {
  S = v;
  box.style.setProperty('--acc', v['music.color']);
  box.style.setProperty('--head', Overly.font(v['music.headFont']));
  box.style.setProperty('--pixel', Overly.font(v['music.pixelFont']));
  box.style.setProperty('--g', G.GLITCH[v['music.glitch']] ?? 1);
  box.classList.toggle('right', v['music.align'] === 'right');
  box.style.setProperty('--bg', G.rgba(v['music.bg'], v['music.bgOpacity']));
  box.style.setProperty('--r', (v['music.radius'] ?? 0) + 'px');
  box.classList.toggle('no-cover', !v['music.cover']);
  box.classList.toggle('no-label', !v['music.showLabel']);
  box.classList.toggle('no-progress', !v['music.progress']);
  box.classList.toggle('no-glitch', v['music.glitch'] === 'off');
  $('.label span').textContent = v['music.label'] || '';
  Overly.css(v['music.css']);
});

const parts = () => [$('.cover'), $('.label'), $('.title'), $('.artist'), $('.prog')];
// Влёт по очереди: обложка, подпись, название (из шума), исполнитель, полоса
function enter(m) {
  parts().forEach(el => { el.style.opacity = '0'; });   // до своего влёта часть не видна
  parts().forEach((el, i) => setTimeout(() => {
    el.style.opacity = '';
    el.classList.remove('g-out');
    G.replay(el, i === 1 || i === 4 ? 'type-in' : 'g-in');
    if ((i === 2 || i === 3) && S?.['music.glitch'] !== 'off') G.streak(el, '30%', '36%');
  }, i * 90));
  setTimeout(() => G.scramble($('.title'), m.title || '', 380), 180);
}

OverlyMusic.watch({
  show() { gen++; box.classList.add('shown'); },
  hide() {
    const g = ++gen;
    parts().reverse().forEach((el, i) => setTimeout(() => { if (g === gen) G.replay(el, 'g-out'); }, i * 50));
    setTimeout(() => { if (g === gen) box.classList.remove('shown'); }, 450);
  },
  track(m, first) {
    const set = () => {
      $('.title').textContent = m.title || '';
      $('.artist').textContent = m.artist || '';
      const img = $('.cover img');
      img.hidden = !m.cover;
      $('.cover .ph').hidden = !!m.cover;
      if (m.cover) img.src = m.cover;
      enter(m);
    };
    if (first) return set();
    // Смена трека: строки уходят со сбоем и влетают заново
    [$('.title'), $('.artist'), $('.cover')].forEach(el => G.replay(el, 'g-out'));
    setTimeout(set, 360);
  },
  mini(on, instant) {
    clearTimeout(swapT);
    if (instant) { box.classList.add('still'); box.classList.toggle('mini', on); fit(); box.offsetWidth; box.classList.remove('still', 'swap'); return; }
    // Содержимое гаснет, полоска меняет высоту, содержимое проявляется уже в новом виде
    box.classList.add('swap');
    swapT = setTimeout(() => { box.classList.toggle('mini', on); fit(); swapT = setTimeout(() => box.classList.remove('swap'), 450); }, 220);
  },
  tick(pos, dur) {
    $('.bar i').style.transform = `scaleX(${dur ? pos / dur : 0})`;
    $('.t').textContent = dur ? `${OverlyMusic.time(pos)} / ${OverlyMusic.time(dur)}` : OverlyMusic.time(pos);
  },
});
</script>
</body>
</html>
