<meta charset="utf-8">
<title>Glitch HUD — голосование</title>
<!--
  ТЕМА GLITCH HUD · ГОЛОСОВАНИЕ (опрос Twitch)
  Без карточки, как весь HUD: пиксельная строка «ГОЛОСОВАНИЕ // 0:42», вопрос крупным шрифтом, варианты с номерами
  01–05 и штрихованными полосками. Лидер — цвета акцента. Появление: загрузочные полосы → сбой → строки по очереди.
  Конец: метка «ИТОГИ», победитель вспыхивает сбоем с меткой «WIN», остальные гаснут. Уход — разрез.
-->
<link href="../../fonts/russo-one.css" rel="stylesheet">
<link href="../../fonts/pixelify-sans.css" rel="stylesheet">
<link rel="stylesheet" href="glitch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #poll { position: absolute; left: 0; top: 0; width: 620px; padding: 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
    color: var(--textColor, #fff); --acc: #C6FF2E; visibility: hidden; }
  #poll.on { visibility: visible; }
  #poll.shadow .q, #poll.shadow .px, #poll.shadow .name { text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .head { display: flex; align-items: center; gap: 12px; font-size: 18px; letter-spacing: .14em; }
  .head .tag { padding: 2px 8px; border: 1px solid var(--acc); color: var(--acc); font-size: 15px; }
  .head .tag:empty { display: none; }
  #poll.ended .head .tag { background: var(--acc); color: var(--ink, #000); }
  .q { font: 400 34px/1.1 var(--head); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .list { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
  .opt { display: grid; grid-template-columns: auto 1fr auto; align-items: end; column-gap: 12px; row-gap: 5px; }
  .opt .i { font-size: 16px; color: var(--acc); }
  .opt .name { font: 400 22px/1.1 var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt .num { font-size: 16px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .opt .num:empty { display: none; }
  .opt .bar { grid-column: 1 / -1; height: 9px; position: relative;
    background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--textColor, #fff) 30%, transparent) 0 1.5px, transparent 1.5px 4px); }
  .opt .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--textColor, #fff); transition: width .6s steps(8); }
  .opt.lead .bar i { background: var(--acc); }
  .opt.lead .name { color: var(--acc); }
  .opt .win { display: none; margin-left: 10px; padding: 1px 6px; background: var(--acc); color: var(--ink, #000); font-size: 14px; vertical-align: 4px; }
  .opt.won .win { display: inline-block; }
  #poll.ended .opt:not(.won) { opacity: .4; }
  .total { font-size: 15px; letter-spacing: .1em; opacity: .75; }
  .total:empty { display: none; }

  .loader { position: absolute; left: 14px; top: 18px; display: grid; gap: 7px; width: 240px; visibility: visible; }
  .loader i { display: block; height: 9px; background: linear-gradient(90deg, var(--acc) var(--p, 70%), transparent 0),
    repeating-linear-gradient(-45deg, var(--acc) 0 1.5px, transparent 1.5px 4px); }
  .loader i:nth-child(2) { width: 66%; --p: 55%; }
  .loader.run i { animation: load .7s steps(7) forwards; }
  @keyframes load { to { --p: 100%; } }
  @property --p { syntax: '<percentage>'; inherits: false; initial-value: 70%; }
  .loader:not(.run) { display: none; }
  #poll.wait > :not(.loader) { visibility: hidden; }
</style>
</head>
<body>
<div id="poll">
  <div class="loader"><i></i><i></i></div>
  <div class="px head"><span class="lbl">ГОЛОСОВАНИЕ</span><span class="tag"></span></div>
  <div class="q"></div>
  <div class="list"></div>
  <div class="px total"></div>
</div>

<script src="../../runtime/overly.js?v=mwe2kpya"></script>
<script src="glitch.js"></script>
<script src="../../runtime/poll.js?v=mwe2kpya"></script>
<script>
const box = document.getElementById('poll');
const $ = (s) => box.querySelector(s);
let S = null, P = null, left = '', hideTimer = 0;

function fit() {
  const k = Math.min(innerWidth / 620, innerHeight / 470);
  box.style.zoom = k;
}
addEventListener('resize', fit);
fit();

const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
function numText(c) {
  const mode = S?.['poll.numbers'] || 'both';
  return mode === 'none' ? '' : mode === 'pct' ? c.pct + '%' : mode === 'votes' ? String(c.votes) : `${c.pct}% // ${c.votes}`;
}

function look() {
  const st = box.style;
  st.setProperty('--acc', S['poll.color']);
  st.setProperty('--ink', G.ink(S['poll.color']));
  st.setProperty('--textColor', S['poll.textColor']);
  st.setProperty('--head', Overly.font(S['poll.headFont']));
  st.setProperty('--pixel', Overly.font(S['poll.pixelFont']));
  box.classList.toggle('shadow', !!S['poll.shadow']);
  box.classList.toggle('no-glitch', !S['poll.glitch']);
  Overly.css(S['poll.css']);
  if (P) fill(P);
}

function tag() { $('.tag').textContent = P?.state === 'ended' ? 'ИТОГИ' : S?.['poll.showTimer'] ? left : ''; }

function fill(p) {
  P = p;
  box.classList.toggle('ended', p.state === 'ended');
  $('.q').textContent = p.title.toUpperCase();
  [...$('.list').children].forEach((row, i) => {
    const c = p.choices[i];
    if (!c) return;
    row.querySelector('.n').textContent = c.title.toUpperCase();
    row.querySelector('.num').textContent = numText(c);
    row.querySelector('.bar i').style.width = c.pct + '%';
    row.classList.toggle('lead', c.lead);
    row.classList.toggle('won', c.win);
  });
  $('.total').textContent = S?.['poll.showTotal'] ? `${p.state === 'ended' ? 'ИТОГО' : 'ВСЕГО'}: ${p.total} ${plural(p.total, 'ГОЛОС', 'ГОЛОСА', 'ГОЛОСОВ')}` : '';
  tag();
}

OverlyPoll.start({
  show(p) {
    clearTimeout(hideTimer);
    $('.list').replaceChildren(...p.choices.map((_, i) => {
      const row = document.createElement('div');
      row.className = 'opt';
      row.innerHTML = `<span class="px i">0${i + 1}</span><span class="name"><span class="n"></span><span class="px win">WIN</span></span><span class="px num"></span><div class="bar"><i></i></div>`;
      return row;
    }));
    const widths = p.choices.map(c => c.pct);
    p.choices.forEach(c => c.pct = 0);   // полоски дорастают после появления
    fill(p);
    box.classList.remove('g-out');
    box.classList.add('on', 'wait');
    document.fonts.ready.then(() => {
      const loader = $('.loader');
      G.replay(loader, 'run');
      setTimeout(() => {
        loader.classList.remove('run');
        box.classList.remove('wait');
        G.replay($('.head'), 'type-in');
        G.replay($('.q'), 'g-in');
        [...$('.list').children].forEach((row, i) => setTimeout(() => G.replay(row, 'g-in'), 120 + i * 90));
        G.replay($('.total'), 'type-in');
        setTimeout(() => { p.choices.forEach((c, i) => c.pct = widths[i]); fill(P === p ? p : P); }, 300);
      }, 750);
    });
  },
  update(p) {
    const ended = p.state === 'ended' && P?.state !== 'ended';
    fill(p);
    if (ended && S?.['poll.glitch']) {
      const won = $('.opt.won');
      if (won) G.replay(won, 'g-in');
      G.replay($('.tag'), 'g-twitch');
    }
  },
  hide() {
    G.replay(box, 'g-out');
    hideTimer = setTimeout(() => box.classList.remove('on', 'g-out'), 400);
  },
  tick(text) { left = text; tag(); },
});

Overly.onSettings(v => { S = v; look(); });
</script>
</body>
</html>
