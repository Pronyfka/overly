<meta charset="utf-8">
<title>Glitch HUD — алерты</title>
<!--
  ТЕМА GLITCH HUD · АЛЕРТЫ
  Текст влетает построчно: «НОВЫЙ ДОНАТ» → «ПОЛУЧЕН ОТ» → ник (собирается из шума) → сумма.
  Каждая строка — со срезом-сбоем и белой вспышкой; по строкам пролетает полоса цвета события.
  Вокруг — HUD-детали: кольцо, узел с линией, штрихованный квадрат, пиксельная строка с меткой «ПЕРЕДАЧА».
  Уход: полосы цвета события режут текст, строки разъезжаются и пропадают.
  События: Overly.onEvent({ type: 'tip', name: 'Ник', amount: 500, message: 'Текст' })
  Типы: follow, sub, resub, gift, raid, bits, tip
-->
<link href="../../fonts/russo-one.css" rel="stylesheet">
<link href="../../fonts/exo-2.css" rel="stylesheet">
<link href="../../fonts/pixelify-sans.css" rel="stylesheet">
<link rel="stylesheet" href="glitch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }

  /* Алерт живёт в коробке 900×380 и вписывается в источник любого размера (--scale считает скрипт) */
  #alert { position: absolute; left: 50%; top: 50%; width: 900px; height: 380px; translate: -50% -50%;
    scale: var(--scale, 1); transform-origin: 50% 50%; visibility: hidden; color: #fff; }
  #alert.shown { visibility: visible; }
  #alert[data-valign="top"] { top: calc(10px * var(--scale, 1)); translate: -50% 0; transform-origin: 50% 0; }
  #alert[data-valign="bottom"] { top: auto; bottom: calc(10px * var(--scale, 1)); translate: -50% 0; transform-origin: 50% 100%; }

  .row { position: absolute; top: 50%; left: 80px; translate: 0 -50%; display: flex; align-items: center; gap: 28px; max-width: 790px; }
  #alert.right .row { left: auto; right: 80px; flex-direction: row-reverse; }
  .lines { position: relative; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  #alert.right .lines { align-items: flex-end; text-align: right; }
  .lines > :not(.hud):not(.streak) { position: relative; opacity: 0; max-width: 100%; }
  .lines > :not(.hud):not(.streak).on { opacity: 1; }

  .t { font: 400 58px/.98 var(--head); text-transform: uppercase; color: var(--acc); white-space: nowrap; letter-spacing: .01em; }
  .name { font: 400 58px/1 var(--head); color: var(--nameColor, #fff); white-space: nowrap; text-transform: uppercase; }
  .extra { margin-top: 6px; font: 400 32px/1 var(--head); color: var(--acc); white-space: nowrap; }
  .extra:empty, .msg:empty, .t:empty { display: none; }
  .msg { margin-top: 10px; max-width: 640px; font: 700 24px/1.25 var(--text); color: var(--msgColor, #fff); text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  .glyphs { margin-top: 10px; display: flex; align-items: center; gap: 10px; color: var(--acc); }
  .glyphs .px { font-size: 15px; opacity: .85; }
  .glyphs > i { display: block; width: 110px; height: 1px; background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); opacity: .6; }
  #alert.right .glyphs { flex-direction: row-reverse; }

  /* Своя картинка / GIF / видео */
  .media { width: 170px; height: 170px; object-fit: contain; flex: none; opacity: 0; }
  .media.on { opacity: 1; transition: opacity .2s steps(2); }
  .media[hidden] { display: none; }

  /* HUD-детали — по левому краю текста (справа при выравнивании вправо) */
  .hud { position: absolute; opacity: 0; color: var(--acc); }
  .hud.on { opacity: 1; }
  #alert.no-hud .hud, #alert.no-hud .glyphs { display: none; }
  .ring { left: -44px; top: 4px; }
  .node { left: -46px; color: #fff; }
  .vline { left: -40px; width: 1px; height: 150px; background: rgba(255,255,255,.55); transform-origin: top; scale: 1 0; }
  .vline.on { scale: 1 1; transition: scale .35s cubic-bezier(.3,.9,.3,1); }
  .sq { left: -46px; width: 13px; height: 13px; }
  .glyphs .tag { font-size: 13px; padding: 2px; }
  .glyphs .tag b { padding: 2px 5px; }
  .glyphs .tag .hatch { width: 18px; }
  #alert.right .ring, #alert.right .node, #alert.right .sq { left: auto; right: -46px; }
  #alert.right .vline { left: auto; right: -40px; }
</style>
</head>
<body>
<div id="alert">
  <div class="row">
    <img class="media" alt="" hidden><video class="media" muted playsinline loop hidden></video>
    <div class="lines">
      <i class="hud ring"></i>
      <div class="t l1"></div>
      <div class="t l2"></div>
      <div class="name"></div>
      <div class="extra"></div>
      <div class="msg"></div>
      <div class="glyphs"><span class="px"></span><i></i><span class="tag"><i class="hatch"></i><b>ПЕРЕДАЧА</b><i class="hatch"></i></span></div>
      <i class="hud node"></i><i class="hud vline"></i>
      <i class="hud hatch sq"></i>
    </div>
  </div>
</div>

<script src="../../runtime/overly.js?v=mwe36yl1"></script>
<script src="glitch.js"></script>
<script>
const root = document.getElementById('alert');
const $ = (s) => root.querySelector(s);
let S = null;
let timers = [];
const at = (ms, fn) => timers.push(setTimeout(fn, ms));

// Вписываем коробку 900×380 в источник (с запасом под сбои по краям) и уменьшаем на «Размер»
function fit() {
  if (!S) return;
  const k = Math.min(innerWidth / 960, innerHeight / 400) * S.size / 100;
  root.style.setProperty('--scale', k);
  root.dataset.valign = S.valign;
}
addEventListener('resize', fit);

Overly.onSettings(v => {
  S = v;
  const st = root.style;
  st.setProperty('--head', Overly.font(v.headFont));
  st.setProperty('--pixel', Overly.font(v.pixelFont));
  st.setProperty('--text', Overly.font(v.textFont));
  st.setProperty('--nameColor', v.nameColor);
  st.setProperty('--msgColor', v.msgColor);
  st.setProperty('--g', G.GLITCH[v.glitch] ?? 1);
  root.classList.toggle('right', v.align === 'right');
  root.classList.toggle('no-hud', !v.hud);
  root.classList.toggle('no-glitch', v.glitch === 'off');
  Overly.css(v.css);
  fit();
});

const durationOf = (a) => (S[a.type + '.dur'] > 0 ? S[a.type + '.dur'] : S.showSec) * 1000;

// Своя картинка/GIF/видео события
function setMedia(url) {
  const img = $('img.media'), vid = $('video.media');
  const isVideo = /\.(webm|mp4)$/i.test(url || '');
  img.hidden = !url || isVideo;
  vid.hidden = !url || !isVideo;
  if (url && !isVideo) img.src = url;
  if (url && isVideo) { if (vid.getAttribute('src') !== url) vid.src = url; vid.currentTime = 0; vid.play().catch(() => {}); }
  if (!url || !isVideo) vid.pause();
}

// Длинный ник — уменьшаем шрифт, чтобы влез в ширину
function fitName(el) {
  el.style.fontSize = '';
  const max = 760 - (root.querySelector('.media:not([hidden])') ? 200 : 0);
  if (el.scrollWidth > max) el.style.fontSize = Math.max(26, 58 * max / el.scrollWidth) + 'px';
}

// Строка влетает: полоса цвета события + срез-сбой
function lineIn(el, withStreak = true) {
  el.classList.add('on');
  G.replay(el, 'g-in');
  if (withStreak && S.glitch !== 'off') G.streak(el, '30%', '36%');
}

function showAlert(a) {
  const k = a.type;
  const n = G.NUM[k](a);
  const showMs = durationOf(a);
  timers.forEach(clearTimeout); timers = [];

  // Сброс в начальное состояние
  root.querySelectorAll('.on, .g-in, .g-out, .g-twitch, .gone').forEach(el => el.classList.remove('on', 'g-in', 'g-out', 'g-twitch', 'gone'));
  root.querySelectorAll('.streak').forEach(s => s.remove());
  root.style.setProperty('--acc', S[k + '.color'] || '#C6FF2E');
  $('.l1').textContent = S[k + '.label'] || '';
  $('.l2').textContent = S[k + '.label2'] || '';
  const name = a.name;
  $('.name').textContent = name;
  $('.extra').textContent = G.fill(S[k + '.line'], n);
  $('.msg').textContent = S.showMessage && a.message ? a.message : '';
  $('.glyphs .px').textContent = G.glyphs(7);
  setMedia(S[k + '.media']);
  if (S.sound) {
    // Свой файл у события — играет он; нет файла — встроенный звук темы
    const vol = (S[k + '.volume'] ?? 100) / 100 * S.volume / 100;
    if (S[k + '.sound']) Overly.play(S[k + '.sound'], vol);
    else if (S.themeSound) G.sound(k, vol);
  }
  root.classList.add('shown');
  fitName($('.name'));

  // Узел с линией — на уровне ника, штрихованный квадрат — у пиксельной строки
  const nameMid = $('.name').offsetTop + $('.name').offsetHeight / 2;
  $('.node').style.top = nameMid - 7 + 'px';
  $('.vline').style.top = nameMid + 7 + 'px';
  $('.sq').style.top = $('.glyphs').offsetTop + 'px';

  // ---- Вход (~0,9 с) ----
  at(0, () => $('.ring').classList.add('on'));
  at(60, () => { if ($('.l1').textContent) lineIn($('.l1')); root.querySelectorAll('.media').forEach(m => m.classList.add('on')); });
  at(200, () => { if ($('.l2').textContent) lineIn($('.l2')); });
  at(340, () => {
    lineIn($('.name'));
    if (S.scramble) G.scramble($('.name'), name, 380);
    $('.node').classList.add('on'); $('.vline').classList.add('on');
  });
  at(520, () => { if ($('.extra').textContent) lineIn($('.extra'), false); $('.sq').classList.add('on'); });
  at(640, () => { if ($('.msg').textContent) lineIn($('.msg'), false); });
  at(700, () => { $('.glyphs').classList.add('on'); G.replay($('.glyphs'), 'type-in'); });

  // ---- Пока висит: изредка сбоит одна из строк ----
  if (S.idleGlitch && S.glitch !== 'off') {
    for (let ms = 2200; ms < showMs - 1100; ms += 1300 + Math.random() * 900) {
      at(ms, () => {
        const list = [...root.querySelectorAll('.t.on, .name.on')];
        const el = list[Math.random() * list.length | 0];
        if (el) G.replay(el, 'g-twitch');
      });
    }
  }

  // ---- Уход (~0,6 с): полосы режут текст, строки разъезжаются ----
  at(showMs - 620, () => {
    if (S.glitch === 'off') return;
    ['.l1', '.name', '.extra'].forEach((s, i) => setTimeout(() => {
      if ($(s).classList.contains('on')) G.streak($('.lines'), $(s).offsetTop + $(s).offsetHeight * .35 + 'px', '14px');
    }, i * 50));
  });
  at(showMs - 520, () => {
    [...root.querySelectorAll('.lines > .on, .media.on')].reverse().forEach((el, i) => setTimeout(() => {
      el.classList.remove('g-in', 'g-twitch', 'pop-in'); G.replay(el, 'g-out');
    }, i * 40));
  });
  at(showMs, () => { root.classList.remove('shown'); $('video.media').pause(); });
}

// Очередь: алерты не перебивают друг друга, а идут по одному
const queue = [];
let busy = false;
function next() {
  const a = queue.shift();
  if (!a) { busy = false; return; }
  busy = true;
  showAlert(a);
  setTimeout(next, durationOf(a) + S.gapSec * 1000);
}
Overly.onEvent(a => {
  if (!S || !G.NUM[a?.type] || !S[a.type + '.on'] || !a.name) return;
  if ((S[a.type + '.min'] || 0) > (Number(a.amount) || 0)) return;   // меньше порога — не показываем
  queue.push(a);
  if (!busy) document.fonts.ready.then(() => { if (!busy) next(); });
});
</script>
</body>
