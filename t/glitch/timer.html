<meta charset="utf-8">
<title>Glitch HUD — таймер марафона</title>
<!--
  ТЕМА GLITCH HUD · ТАЙМЕР МАРАФОНА
  Пиксельное название, огромное время цвета акцента, под ним пиксельная строка «+5:00 // НИК», когда марафон продлили.
  Появление: загрузочные полосы → сбой → время. Продление — время дёргается сбоем и на миг белеет.
  Пауза — метка «ПАУЗА» и мигающие секунды. Время вышло — надпись конца вместо цифр и метка «0:00».
-->
<link href="../../fonts/russo-one.css" rel="stylesheet">
<link href="../../fonts/pixelify-sans.css" rel="stylesheet">
<link rel="stylesheet" href="glitch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #timer { position: absolute; left: 0; top: 0; height: 260px; padding: 0 14px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right;
    color: var(--textColor, #fff); --acc: #C6FF2E; }
  #timer.left { align-items: flex-start; text-align: left; }
  #timer.center { align-items: center; text-align: center; }
  #timer.shadow .time, #timer.shadow .px { text-shadow: 0 2px 10px rgba(0,0,0,.8); }

  .head { display: flex; align-items: center; gap: 12px; }
  .title { font-size: 22px; letter-spacing: .16em; }
  .tag { display: none; padding: 2px 8px; border: 1px solid var(--acc); color: var(--acc); font-size: 15px; }
  #timer.paused .tag, #timer.done .tag { display: inline-block; }
  .time { font: 400 128px/1 var(--head); color: var(--acc); letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin: 6px 0 4px; white-space: nowrap; }
  .time.flash { color: #fff; }
  #timer.paused .time { animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  #timer.done .time { font-size: 72px; }
  .add { display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: .1em; min-height: 26px; opacity: 0; }
  .add .hatch { width: 14px; height: 14px; color: var(--acc); }
  .add b { color: var(--acc); font-weight: 400; }
  .add.show { animation: addShow 3.4s steps(1) forwards; }
  @keyframes addShow { 0% { opacity: 1; } 92% { opacity: 1; } 94% { opacity: 0; } 96% { opacity: 1; } 100% { opacity: 0; } }

  .loader { position: absolute; top: 50%; translate: 0 -50%; display: grid; gap: 7px; width: 240px; right: 0; }
  #timer.left .loader { right: auto; left: 0; }
  #timer.center .loader { right: auto; left: 50%; translate: -50% -50%; }
  .loader i { display: block; height: 9px; background: linear-gradient(90deg, var(--acc) var(--p, 70%), transparent 0),
    repeating-linear-gradient(-45deg, var(--acc) 0 1.5px, transparent 1.5px 4px); }
  .loader i:nth-child(2) { width: 66%; --p: 55%; }
  .loader.run i { animation: load .9s steps(9) forwards; }
  .loader.run i:nth-child(2) { animation-duration: .8s; }
  @keyframes load { to { --p: 100%; } }
  @property --p { syntax: '<percentage>'; inherits: false; initial-value: 70%; }
  #timer:not(.ready) .head, #timer:not(.ready) .time, #timer:not(.ready) .add { visibility: hidden; }
</style>
</head>
<body>
<div id="timer">
  <div class="loader"><i></i><i></i></div>
  <div class="head"><span class="px title"></span><span class="px tag"></span></div>
  <div class="time"></div>
  <div class="px add"><b></b><span class="who"></span><i class="hatch"></i></div>
</div>

<script src="../../runtime/overly.js?v=mwe36yl1"></script>
<script src="glitch.js"></script>
<script src="../../runtime/timer.js?v=mwe36yl1"></script>
<script>
const box = document.getElementById('timer');
const $ = (s) => box.querySelector(s);
let S = null;

function fit() {
  const k = Math.min(innerHeight / 270, innerWidth / 520);   // текст растёт с высотой, но не шире узкого источника
  box.style.zoom = k;
  box.style.width = innerWidth / k + 'px';
  box.style.top = (innerHeight / k - 260) / 2 + 'px';
}
addEventListener('resize', fit);
fit();

function look() {
  const st = box.style;
  st.setProperty('--acc', S['timer.color']);
  st.setProperty('--textColor', S['timer.textColor']);
  st.setProperty('--head', Overly.font(S['timer.headFont']));
  st.setProperty('--pixel', Overly.font(S['timer.pixelFont']));
  box.classList.toggle('left', S['timer.align'] === 'left');
  box.classList.toggle('center', S['timer.align'] === 'center');
  box.classList.toggle('shadow', !!S['timer.shadow']);
  box.classList.toggle('no-glitch', !S['timer.glitch']);
  $('.title').textContent = S['timer.title'] || '';
  Overly.css(S['timer.css']);
}

OverlyTimer.start({
  render(text, info) {
    for (const s of ['idle', 'running', 'paused', 'done']) box.classList.toggle(s, info.state === s);
    $('.tag').textContent = info.state === 'paused' ? 'ПАУЗА' : info.state === 'done' ? '0:00' : '';
    const t = info.state === 'done' ? (S?.['timer.endText'] || '0:00').toUpperCase() : text;
    if ($('.time').textContent !== t) {
      $('.time').textContent = t;
      if (info.state === 'done' && S?.['timer.glitch']) G.replay($('.time'), 'g-in');
    }
  },
  added(a) {
    if (!S || !S['timer.showAdd'] || a.seconds < 0) return;
    $('.add b').textContent = a.text;
    $('.add .who').textContent = a.name ? '// ' + a.name.toUpperCase() : '';
    G.replay($('.add'), 'show');
    G.replay($('.add b'), 'type-in');
    const t = $('.time');
    t.classList.add('flash');
    if (S['timer.glitch']) G.replay(t, 'g-twitch');
    setTimeout(() => t.classList.remove('flash'), 450);
  },
});

let started = false;
Overly.onSettings(v => {
  S = v;
  look();
  if (started) return;
  started = true;
  document.fonts.ready.then(() => {
    const loader = $('.loader');
    loader.classList.add('run');
    setTimeout(() => {
      G.replay(loader, 'g-out');
      box.classList.add('ready');
      G.replay($('.title'), 'type-in');
      G.replay($('.time'), 'g-in');
    }, 1000);
  });
});
</script>
</body>
</html>
