<meta charset="utf-8">
<title>Glitch HUD — рамка вебки</title>
<!--
  ТЕМА GLITCH HUD · РАМКА ВЕБКИ
  Цветная полоса сбоку со срезанным углом, тонкая рамка, белый уголок со штриховкой, узлы по углам,
  метка «КАМЕРА» со штриховкой. Только рамка — алерты сюда не выводятся.
  В OBS положите источник поверх камеры и растяните по ней.
-->
<link href="../../fonts/russo-one.css" rel="stylesheet">
<link href="../../fonts/pixelify-sans.css" rel="stylesheet">
<link rel="stylesheet" href="glitch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #frame { position: absolute; inset: 0; --c: var(--acc); --bw: 10px; --lineOp: .4;
    font-size: calc(clamp(10px, 3.4vmin, 30px) * var(--labelScale, 1)); }
  /* Тонкая рамка с отступом от края */
  .line { position: absolute; inset: 14px; border: 1px solid rgba(255,255,255, var(--lineOp)); }
  /* Цветная полоса со срезанным верхним углом и тонкой скобкой внутри */
  .bar { position: absolute; top: 0; bottom: 0; left: 0; width: var(--bw); background: var(--c);
    clip-path: polygon(0 0, 100% 18px, 100% 100%, 0 100%); }
  .bar-in { position: absolute; left: calc(var(--bw) + 6px); top: 26px; width: 22px; height: 30%;
    border-left: 2px solid var(--c); border-top: 2px solid var(--c); }
  .bar-wrap { position: absolute; inset: 0; pointer-events: none; }
  #frame.side-right .bar-wrap { scale: -1 1; }
  #frame.side-none .bar-wrap { display: none; }
  /* Белый уголок со штриховкой — в углу напротив полосы */
  .bracket { position: absolute; right: 0; top: 0; width: 18%; height: 26%; min-width: 46px; min-height: 40px; }
  .bracket::before { content: ''; position: absolute; right: 0; top: 0; width: 100%; height: 100%;
    border-top: 3px solid #fff; border-right: 3px solid #fff; box-sizing: border-box; }
  .bracket .hatch { position: absolute; color: #fff; }
  .bracket .h1 { right: 22%; top: -1px; width: 44%; height: 5px; }
  .bracket .h2 { right: -1px; top: 26%; width: 5px; height: 50%; }
  .bracket::after { content: ''; position: absolute; right: 10px; top: 10px; width: 0; height: 0;
    border-top: 12px solid #fff; border-left: 12px solid transparent; }
  #frame.side-right .bracket { right: auto; left: 0; scale: -1 1; }
  #frame.no-bracket .bracket { display: none; }
  /* Узлы по нижним углам тонкой рамки */
  .node { position: absolute; bottom: 7px; }
  .node.l { left: 7px; } .node.r { right: 7px; }
  #frame.no-nodes .node { display: none; }

  /* Метка-надпись */
  .label { position: absolute; display: flex; align-items: center; gap: .4em; font-size: 1em; }
  .label .tag { font-size: .62em; background: rgba(10,10,11,.6); }
  .label .tag .hatch { width: 1.6em; }
  .label.tl { left: 30px; top: 26px; } .label.tr { right: 30px; top: 26px; }
  .label.bl { left: 30px; bottom: 26px; } .label.br { right: 30px; bottom: 26px; }
  .label.empty { display: none; }
  .rec { width: .5em; height: .5em; background: #ff2d55; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #frame.no-rec .rec { display: none; }

</style>
</head>
<body>
<div id="frame">
  <div class="line"></div>
  <div class="bar-wrap"><div class="bar"></div><i class="bar-in"></i></div>
  <div class="bracket"><i class="hatch h1"></i><i class="hatch h2"></i></div>
  <i class="node l"></i><i class="node r"></i>
  <div class="label"><i class="rec"></i><span class="tag"><i class="hatch"></i><b></b><i class="hatch"></i></span></div>
</div>

<script src="../../runtime/overly.js?v=mwe2s8ed"></script>
<script src="glitch.js"></script>
<script>
const frame = document.getElementById('frame');
const $ = (s) => frame.querySelector(s);

Overly.onSettings(v => {
  const st = frame.style;
  st.setProperty('--acc', v['cam.color']);
  st.setProperty('--bw', v['cam.barWidth'] + 'px');
  st.setProperty('--lineOp', v['cam.lineOpacity'] / 100);
  st.setProperty('--labelScale', (v['cam.labelSize'] || 100) / 100);
  st.setProperty('--pixel', Overly.font(v['cam.pixelFont']));
  st.setProperty('--head', Overly.font(v['cam.headFont']));
  frame.className = [
    'side-' + (v['cam.side'] || 'left'), !v['cam.bracket'] && 'no-bracket', !v['cam.nodes'] && 'no-nodes', !v['cam.rec'] && 'no-rec',
  ].filter(Boolean).join(' ');
  const label = $('.label');
  label.querySelector('b').textContent = v['cam.label'] || '';
  label.className = 'label ' + v['cam.labelPos'] + (v['cam.label'] ? '' : ' empty');
  Overly.css(v['cam.css']);
});

</script>
</body>
