<meta charset="utf-8">
<title>Glitch HUD — цель</title>
<!--
  ТЕМА GLITCH HUD · ЦЕЛЬ
  Пиксельное название, огромный процент цвета акцента, под ним «612 / 1 000», тонкая шкала со штриховкой.
  Появление: две «загрузочные» полосы со штриховкой → сбой → проценты отсчитываются от нуля.
  При росте проценты досчитываются со сбоем (во время счёта — белые). Цель выполнена — метка «ВЫПОЛНЕНО».
  Фолловеры или сабы (всего на канале, с Twitch) или битсы (с последнего сброса в редакторе).
-->
<link href="../../fonts/russo-one.css" rel="stylesheet">
<link href="../../fonts/pixelify-sans.css" rel="stylesheet">
<link rel="stylesheet" href="glitch.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  /* Цель рисуется в высоту 260 и растягивается на всю ширину источника (масштаб — zoom, считает скрипт) */
  #goal { position: absolute; left: 0; top: 0; height: 260px; padding: 0 14px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right;
    color: var(--textColor, #fff); --acc: #C6FF2E; }
  #goal.left { align-items: flex-start; text-align: left; }
  #goal.center { align-items: center; text-align: center; }
  #goal.shadow .pct, #goal.shadow .px { text-shadow: 0 2px 10px rgba(0,0,0,.8); }

  .head { display: flex; align-items: center; gap: 12px; }
  .title { font-size: 22px; letter-spacing: .16em; }
  .done-tag { display: none; padding: 2px 8px; border: 1px solid var(--acc); color: var(--acc); font-size: 15px; }
  #goal.done .done-tag { display: inline-block; }
  .pct { font: 400 128px/1 var(--head); color: var(--acc); letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
  .pct.counting { color: #fff; }
  .count { display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: .1em; }
  .count .hatch { width: 14px; height: 14px; color: var(--acc); }
  .count:empty { display: none; }
  .bar { position: relative; width: 100%; height: 7px; margin-top: 16px; color: rgba(255,255,255,.28); }
  .bar .fill { position: absolute; inset: 0; background: var(--acc); transform-origin: left; transform: scaleX(0);
    transition: transform .9s cubic-bezier(.3,.9,.3,1); }
  #goal.no-bar .bar { display: none; }

  /* Загрузочные полосы при появлении */
  .loader { position: absolute; top: 50%; translate: 0 -50%; display: grid; gap: 7px; width: 240px; right: 0; }
  #goal.left .loader { right: auto; left: 0; }
  #goal.center .loader { right: auto; left: 50%; translate: -50% -50%; }
  .loader i { display: block; height: 9px; background: linear-gradient(90deg, var(--acc) var(--p, 70%), transparent 0),
    repeating-linear-gradient(-45deg, var(--acc) 0 1.5px, transparent 1.5px 4px); }
  .loader i:nth-child(2) { width: 66%; --p: 55%; }
  .loader.run i { animation: load .9s steps(9) forwards; }
  .loader.run i:nth-child(2) { animation-duration: .8s; }
  @keyframes load { to { --p: 100%; } }
  @property --p { syntax: '<percentage>'; inherits: false; initial-value: 70%; }
  .body { opacity: 0; display: contents; }
  #goal:not(.ready) .head, #goal:not(.ready) .pct, #goal:not(.ready) .count, #goal:not(.ready) .bar { visibility: hidden; }
</style>
</head>
<body>
<div id="goal">
  <div class="loader"><i></i><i></i></div>
  <div class="head"><span class="px title"></span><span class="px done-tag"></span></div>
  <div class="pct">0%</div>
  <div class="px count"></div>
  <div class="bar hatch"><span class="fill"></span></div>
</div>

<script src="../../runtime/overly.js?v=mwe6bc1p"></script>
<script src="glitch.js"></script>
<script>
const goal = document.getElementById('goal');
const $ = (s) => goal.querySelector(s);
let S = null, stats = {}, last = null, shownPct = 0, ready = false, counter = 0;

function fit() {
  const k = Math.min(innerHeight / 270, innerWidth / 420);   // текст растёт с высотой, но не шире узкого источника
  goal.style.zoom = k;
  goal.style.width = innerWidth / k + 'px';
  goal.style.top = (innerHeight / k - 260) / 2 + 'px';
}
addEventListener('resize', fit);
fit();

// Проценты досчитываются до нового значения; пока считают — белые, потом цвета акцента
function countTo(pct) {
  cancelAnimationFrame(counter);
  const from = shownPct, start = performance.now(), ms = Math.min(1200, 300 + Math.abs(pct - from) * 18);
  const el = $('.pct');
  if (from === pct) { el.textContent = pct + '%'; return; }
  el.classList.add('counting');
  if (S['goal.glitch']) G.replay(el, 'g-in');
  const step = () => {
    const k = Math.min(1, (performance.now() - start) / ms);
    shownPct = Math.round(from + (pct - from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = shownPct + '%';
    if (k < 1) counter = requestAnimationFrame(step);
    else { el.classList.remove('counting'); if (S['goal.glitch']) G.replay(el, 'g-twitch'); }
  };
  step();
}

function render() {
  if (!S) return;
  const st = goal.style;
  st.setProperty('--acc', S['goal.color']);
  st.setProperty('--textColor', S['goal.textColor']);
  st.setProperty('--head', Overly.font(S['goal.headFont']));
  st.setProperty('--pixel', Overly.font(S['goal.pixelFont']));
  Overly.css(S['goal.css']);

  const target = Math.max(1, Number(S['goal.target']) || 1);
  const value = stats[S['goal.type']];
  const known = typeof value === 'number';
  const done = known && value >= target;
  const pct = known ? Math.min(100, Math.floor(100 * value / target)) : 0;
  goal.classList.toggle('left', S['goal.align'] === 'left');
  goal.classList.toggle('center', S['goal.align'] === 'center');
  goal.classList.toggle('done', done);
  goal.classList.toggle('no-bar', !S['goal.bar']);
  goal.classList.toggle('shadow', !!S['goal.shadow']);
  goal.classList.toggle('no-glitch', !S['goal.glitch']);
  $('.title').textContent = S['goal.title'] || '';
  $('.done-tag').textContent = S['goal.done'] || '';

  const fmt = (n) => n.toLocaleString('ru-RU');
  const mode = S['goal.countMode'] || 'both';
  $('.count').innerHTML = '';
  const text = !known ? 'ПОДКЛЮЧИТЕ TWITCH'
    : mode === 'none' ? ''
    : mode === 'count' ? fmt(value)
    : mode === 'left' ? `ОСТАЛОСЬ ${done ? 0 : fmt(target - value)}`
    : `${fmt(value)} / ${fmt(target)}`;
  if (text) $('.count').append(Object.assign(document.createElement('span'), { textContent: text }), Object.assign(document.createElement('i'), { className: 'hatch' }));
  $('.fill').style.transform = `scaleX(${pct / 100})`;

  if (ready) {
    if (known && last !== null && value > last) countTo(pct);
    else if (shownPct !== pct) countTo(pct);
  }
  last = known ? value : null;
  goal.dataset.pct = pct;
}

// Появление: загрузочные полосы → сбой → проценты с нуля
function intro() {
  const loader = $('.loader');
  loader.classList.add('run');
  setTimeout(() => {
    G.replay(loader, 'g-out');
    goal.classList.add('ready');
    ready = true;
    G.replay($('.title'), 'type-in');
    G.replay($('.pct'), 'g-in');
    setTimeout(() => G.replay($('.count'), 'type-in'), 160);
    countTo(+goal.dataset.pct || 0);
  }, 1000);
}

let started = false;
Overly.onSettings(v => {
  const typeChanged = S && S['goal.type'] !== v['goal.type'];
  S = v;
  if (typeChanged) last = null;
  render();
  if (!started) { started = true; document.fonts.ready.then(intro); }
});
Overly.onStats(s => { stats = s; render(); });
</script>
</body>
</html>
